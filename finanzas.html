/* Texto completo de la Ley 2557-O, 115 artículos, para consultar sin conexión */
const LEY = [{"n":1,"t":"Ámbito de aplicación","x":"Los honorarios profesionales de los abogados y procuradores que actúan como patrocinantes o representantes, se trate de actividad judicial o extrajudicial, administrativa o mediación, se rigen por las disposiciones de la presente ley.","e":"Título I — Disposiciones Generales · Capítulo 1 — Ámbito de Aplicación"},{"n":2,"t":"Exclusión","x":"Quedan excluidos de esta ley:\n\n1) Los honorarios de abogados o procuradores no inscriptos en el Foro de  Abogados de la Provincia de San Juan.\n2) Pacto de honorarios: Los honorarios convenidos por los abogados y  procuradores con su cliente, en todo tipo de procesos (actuaciones judiciales,  extrajudiciales, administrativas y de mediación), dentro de los límites  establecidos en la presente Ley, los que rigen entre las partes, con total  independencia de la condena en costas que corresponda a la contraria o  terceros en el proceso.\n3) Los honorarios de los profesionales que actúan en calidad de abogados bajo  contrato en forma permanente o transitoria, con asignación fija, remuneración  periódica o en relación de dependencia, salvo cuando se generen en asuntos  ajenos a la relación que los vincula o cuando hubiere mediado condena en  costas a la parte contraria o de terceros ajenos a la relación contractual.","e":"Título I — Disposiciones Generales · Capítulo 1 — Ámbito de Aplicación"},{"n":3,"t":"Carácter oneroso","x":"La actividad profesional de abogados y procuradores es de carácter oneroso, no se admite prueba en contrario.\nLos abogados y procuradores pueden pactar libremente con su cliente el monto de sus honorarios en todo tipo de procesos, dentro de los límites establecidos en la presente Ley. El monto de los honorarios puede ser reducido o renunciado conforme a la libre voluntad de las partes, así como la forma y oportunidad de su pago.\nLos contratos de honorarios rigen las obligaciones entre las partes con total independencia de la condena en costas que corresponda a la contraria","e":"Título I — Disposiciones Generales · Capítulo 2 — Naturaleza y Característica"},{"n":4,"t":"Excepción a la onerosidad","x":"El abogado o procurador queda facultado a convenir honorarios inferiores a los dispuestos por esta Ley o a renunciar a los honorarios única y exclusivamente cuando el convenio lo celebra con sus ascendientes o descendientes, cónyuge o conviviente.","e":"Título I — Disposiciones Generales · Capítulo 2 — Naturaleza y Característica"},{"n":5,"t":"Carácter alimentario","x":"Los honorarios profesionales revisten carácter alimentario y preferidos a los créditos en el interés al cual han sido causados.","e":"Título I — Disposiciones Generales · Capítulo 2 — Naturaleza y Característica"},{"n":6,"t":"Embargo especial","x":"Se reconoce a favor de los profesionales que deben percibir honorarios, un embargo legal sobre todo valor, dinero o bien,  sea mueble o inmueble que, estando afectado al proceso, deba eventualmente responder al pago de aquéllos","e":"Título I — Disposiciones Generales · Capítulo 2 — Naturaleza y Característica"},{"n":7,"t":"Inembargabilidad","x":"Los honorarios son inembargables salvo que supere la suma equivalente a siete (7) UMA, en cuyo caso puede embargarse en la proporción del veinte por ciento (20 %) del excedente.","e":"Título I — Disposiciones Generales · Capítulo 2 — Naturaleza y Característica"},{"n":8,"t":"Propiedad y cesión de honorarios","x":"Los honorarios devengados o regulados son de propiedad exclusiva del abogado o procurador.\nPuede cederlos, total o parcialmente, por instrumento privado con certificación de firmas o por actuación labrada en acta ante el personal autorizado por el juzgado donde tramita el expediente, sin más trámite.","e":"Título I — Disposiciones Generales · Capítulo 2 — Naturaleza y Característica"},{"n":9,"t":"Cancelación de honorarios","x":"Cualquier asunto que haya demandado una actividad profesional judicial, extrajudicial, administrativa o de mediación, no puede considerarse concluido, si no se han abonado y cancelado los honorarios.","e":"Título I — Disposiciones Generales · Capítulo 3 — Obligación de Pago"},{"n":10,"t":"Cancelación judicial. Deber de los magistrados","x":"Los jueces no deben dar por terminado ningún expediente, ordenar levantamiento de embargos, inhibiciones o cualquier otra medida cautelar, hacer entrega de fondos o valores depositados, autorizar inscripciones, o cualquier otra gestión que fuere objeto del pleito hasta tanto no se hayan cancelado los honorarios de todos los abogados o procuradores actuantes en el proceso.\nÚnicamente pueden hacerlo si se acompaña constancia de cancelación de honorarios o con la conformidad expresa del profesional, presentada por escrito en autos. O en caso de urgencia, bastará con acreditar que se ha afianzado su pago con garantía suficiente y notificado en forma fehaciente al profesional interesado.\nEs un deber de los magistrados y encargados de las reparticiones administrativas intervinientes velar por el fiel cumplimiento de la presente Ley.","e":"Título I — Disposiciones Generales · Capítulo 3 — Obligación de Pago"},{"n":11,"t":"Obligado al pago","x":"El condenado en costas u obligado al pago tiene la obligación de abonar los honorarios regulados en juicio.\nEl abogado o procurador puede exigir el pago de sus honorarios al obligado al pago independientemente del convenio o pacto de cuota litis que haya celebrado con su cliente.\nEn el caso que los condenados en costas sean varios, la obligación pesa solidariamente sobre todos ellos y, en caso de tratarse de responsabilidades simplemente mancomunadas, la resolución o sentencia debe determinar la proporción de las obligaciones de cada uno.","e":"Título I — Disposiciones Generales · Capítulo 3 — Obligación de Pago"},{"n":12,"t":"Subrogación","x":"Las personas que abonaron los honorarios y luego no son condenadas en costas, total o parcialmente, se convierten en subrogantes legales del crédito respectivo y tienen el derecho de repetir de quien corresponda la cantidad abonada, por las mismas vías y con el mismo sistema fijado para los abogados y procuradores.","e":"Título I — Disposiciones Generales · Capítulo 3 — Obligación de Pago"},{"n":13,"t":"Renuncia anticipada. Sustitución","x":"El abogado o procurador que renuncie al proceso o gestión antes de concluirlo, o que es sustituido, puede solicitar la regulación provisoria de sus honorarios.\n En caso de renuncia se debe regular el mínimo de lo que corresponda.\nEn caso de sustitución, se debe regular lo que corresponda.","e":"Título I — Disposiciones Generales · Capítulo 3 — Obligación de Pago"},{"n":14,"t":"Actuación en caso de renuncia o sustitución","x":"En ambos supuestos el abogado o procurador puede continuar actuando como interesado en protección de sus derechos, en los siguientes casos:\n\n1) Por sus honorarios, si no los solicitó.\n2) Por una regulación adicional a la que tenga derecho, de acuerdo al resultado  del pleito.\n3) Por la ejecución del pacto celebrado con su cliente.","e":"Título I — Disposiciones Generales · Capítulo 3 — Obligación de Pago"},{"n":15,"t":"Regulación definitiva sin conclusión","x":"El abogado o procurador puede pedir regulación definitiva de los honorarios, aunque el procedimiento o gestión no haya concluido, cuando éste se encuentre paralizado por más de seis (6) meses, por causas ajenas a su voluntad.","e":"Título I — Disposiciones Generales · Capítulo 3 — Obligación de Pago"},{"n":16,"t":"Actuación en causa propia","x":"El abogado o procurador en causa propia puede cobrar sus honorarios y gastos cuando la parte contraria resulte condenada en costas.","e":"Título I — Disposiciones Generales · Capítulo 3 — Obligación de Pago"},{"n":17,"t":"Parámetros de regulación","x":"Los honorarios profesionales se deben regular sobre la cuantía del proceso, encuadrada en una de las escalas previstas en el artículo 27 de la presente Ley, y de la participación que el profesional tenga en las etapas del proceso.\nEn los procesos sin cuantía, se aplican los artículos 70 y siguientes de esta Ley.","e":"Título II — Disposiciones Particulares · Capítulo 1 — Parámetros Para Regulación"},{"n":18,"t":"Unidad de Medida Arancelaria","x":"Se crea la unidad de medida arancelaria que se identifica con las siglas \"UMA\".\nLa UMA tiene un valor de pesos veinte mil ($20.000) al momento de publicarse la presente Ley.\nDicho valor se debe actualizar cuando se incrementen las remuneraciones o haberes totales asignados al cargo de juez de primera instancia del Poder Judicial de San Juan, en la misma proporción.\nLa Corte de Justicia de la provincia de San Juan debe notificar a los organismos judiciales y al Foro de Abogados de San Juan, el porcentaje del incremento citado en el párrafo anterior.\nEl Foro de Abogados de San Juan debe informar a las reparticiones administrativas y a los matriculados el valor de la UMA.","e":"Título II — Disposiciones Particulares · Capítulo 1 — Parámetros Para Regulación · Sección 1 — Unidad de Medida Arancelaria"},{"n":19,"t":"Monto del proceso","x":"En los procesos judiciales la cuantía del asunto se determina por el monto de la demanda o reconvención. Cuando se trata de sumas de dinero se computa como cuantía del asunto la liquidación que resulte de la sentencia por capital, actualizado si correspondiere, e intereses y demás accesorias.\nCuando no se determina la cantidad en la demanda o durante el juicio, se debe tener en cuenta los valores, bienes o intereses comprometidos en el pleito susceptibles de apreciación pecuniaria conforme las pautas establecidas en esta Ley.","e":"Título II — Disposiciones Particulares · Capítulo 1 — Parámetros Para Regulación · Sección 2 — Cuantía del Proceso · Subsección 1 — Determinación de la Cuantía"},{"n":20,"t":"Supuestos especiales","x":"En los siguientes casos, la cuantía se determina:\n\n1) Si la demanda progresa parcialmente, los honorarios del profesional de la  actora se determinan considerándolo ganador por el monto admitido y perdedor  por el rechazado.\n Los honorarios del profesional del demandado, se fijan considerándolo perdedor  por el monto admitido y ganador por el rechazado.\n2) Cuando el proceso concluya por transacción o conciliación, administrativa o  judicial, la cuantía es el monto transado o conciliado.\n3) Cuando el proceso concluya por allanamiento, desistimiento o caducidad de  instancia, la cuantía resulta del monto demandado o reconvenido.","e":"Título II — Disposiciones Particulares · Capítulo 1 — Parámetros Para Regulación · Sección 2 — Cuantía del Proceso · Subsección 1 — Determinación de la Cuantía"},{"n":21,"t":"Procesos con cuantías especiales","x":"Sin perjuicio de lo dispuesto en el artículo anterior, los siguientes procesos tienen cuantías especiales:\n\n1) Alimentos: En los juicios de alimentos, se fijan los honorarios, considerando  como monto del proceso la cantidad a pagar durante dos (2) años. En los casos  de aumento, disminución o coparticipación en los alimentos, la cuantía resulta  de la diferencia entre la prestación alimentaria fijada con anterioridad y la  dispuesta actualmente, multiplicada por dos (2).\n En ningún caso la regulación de los honorarios podrá ser inferior a 5 UMA.\n2) Desalojo: En los procesos de desalojo, la cuantía resulta de un (1) canon  locativo vigente a la interposición de la demanda, multiplicado por treinta y seis  (36).\n Si el canon locativo vigente a la interposición de la demanda, resulta de difícil  determinación, o es inferior a los precios de mercado, o no hay canon locativo  vigente a la interposición de la demanda, el profesional puede:\n a) Pedir que la cuantía resulte del último canon locativo multiplicado por treinta  y seis (36);\n b) Pedir que la cuantía resulte del avalúo fiscal; o  c) Pedir que la cuantía resulte de informe pericial del canon locativo multiplicado  por treinta y seis (36).\n3) Desalojo laboral: En los procesos de desalojo por restitución de inmuebles o  parte de ellos, concedidos a los trabajadores en virtud de la relación de trabajo,  la cuantía del proceso se determina conforme el inciso anterior.\n4) Expropiación: En los procesos de expropiación, la cuantía resulta:\n a) De la suma ofrecida por el expropiante, si existe conformidad por parte del  expropiado;\n b) Del monto que ordena pagar la sentencia, si el monto indemnizatorio es  cuestionado.\n5) Liquidación de la sociedad conyugal: En los procesos de liquidación y disolución  de la sociedad conyugal, la cuantía del proceso se determina teniendo en  cuenta su patrimonio.","e":"Título II — Disposiciones Particulares · Capítulo 1 — Parámetros Para Regulación · Sección 2 — Cuantía del Proceso · Subsección 1 — Determinación de la Cuantía"},{"n":22,"t":"Bienes susceptibles de apreciación pecuniaria","x":"En los procesos judiciales que cuenten con bienes o derechos sobre los mismos, susceptibles de apreciación pecuniaria, la cuantía del proceso se determina, a elección del profesional, por:\n\n1) La tasación existente en autos.\n2) Avalúo fiscal.\n3) Tasación privada presentada por la parte, una o más.\n4) El monto acordado.\n5) El monto obtenido en la subasta.\n6) El precio de mercado.\n7) Cualquier otro medio que estime conveniente.\n\nEn caso de ser cuestionada la cuantía por la parte contraria, el juez debe determinar la base regulatoria conforme el procedimiento previsto en los artículos\n78 y siguientes de la presente Ley.","e":"Título II — Disposiciones Particulares · Capítulo 1 — Parámetros Para Regulación · Sección 2 — Cuantía del Proceso · Subsección 1 — Determinación de la Cuantía"},{"n":23,"t":"Distintos procesos","x":"Para determinar la cuantía de muebles y semovientes, bienes sujetos de agotamiento, concesiones y derechos intelectuales, se debe determinar por el procedimiento previsto en el artículo 22 de la presente Ley.\nCuando se trate de:\n\n1) Uso y Habitación: En estos procesos la cuantía se determina teniendo en  cuenta el diez por ciento (10 %) anual del valor del bien respectivo, multiplicado  por el número de años por el que se transmite el derecho. Este resultado no  puede exceder del cien por ciento (100 %) del valor del bien.\n2) Títulos de rentas y acciones: Para determinar el monto del juicio, el valor de  títulos de rentas y acciones de entidades privadas, se toma de la cotización en  bolsa o del valor que informe la entidad bancaria.\n3) Compra venta de inmuebles: En procesos de escrituración, rescisión, resolución  y, en general, en todos derivados del contrato de compraventa de inmuebles, la  cuantía se determina por el boleto de compraventa, o bien por las opciones  previstas por el artículo 22 de esta Ley, a elección del profesional.","e":"Título II — Disposiciones Particulares · Capítulo 1 — Parámetros Para Regulación · Sección 2 — Cuantía del Proceso · Subsección 1 — Determinación de la Cuantía"},{"n":24,"t":"Moneda extranjera","x":"En los procesos judiciales que cuenten con dinero, crédito u obligaciones expresados en moneda extranjera o metálico, la cuantía del proceso se determina por el valor de plaza conforme al tipo de cambio vendedor minorista al público que establezca el Banco de la Nación Argentina.","e":"Título II — Disposiciones Particulares · Capítulo 1 — Parámetros Para Regulación · Sección 2 — Cuantía del Proceso · Subsección 1 — Determinación de la Cuantía"},{"n":25,"t":"Administrador judicial e interventor","x":"Para la regulación de los honorarios del administrador judicial o interventor designado en juicios voluntarios, contenciosos o universales, se aplica la escala del artículo 27 sobre el monto de los ingresos obtenidos durante la administración o intervención, con prescindencia del valor de los bienes.","e":"Título II — Disposiciones Particulares · Capítulo 1 — Parámetros Para Regulación · Sección 2 — Cuantía del Proceso · Subsección 1 — Determinación de la Cuantía"},{"n":26,"t":"Transformación a UMA","x":"El monto o cuantía del proceso se debe transformar en la cantidad de UMA que correspondan según el valor que a ésta se le asigna.","e":"Título II — Disposiciones Particulares · Capítulo 1 — Parámetros Para Regulación · Sección 2 — Cuantía del Proceso · Subsección 2 — Determinación por Escala"},{"n":27,"t":"Escala","x":"La escala en la que deben ubicarse los procesos o asuntos, es:","e":"Título II — Disposiciones Particulares · Capítulo 1 — Parámetros Para Regulación · Sección 2 — Cuantía del Proceso · Subsección 2 — Determinación por Escala","tabla":"escala"},{"n":28,"t":"Regulación general","x":"En todos los procesos, salvo las excepciones que establece esta ley, la regulación de los honorarios se debe efectuar conforme a la escala y porcentaje establecido en el artículo 27 y las etapas en las que el profesional haya participado.","e":"Título II — Disposiciones Particulares · Capítulo 1 — Parámetros Para Regulación · Sección 2 — Cuantía del Proceso · Subsección 3 — Determinación por Procesos"},{"n":29,"t":"Regulación en primera instancia","x":"En los procesos judiciales susceptibles de apreciación pecuniaria, los honorarios profesionales por la actuación en primera instancia hasta la sentencia se determinan en porcentaje, según la escala en la que debe ubicarse la cuantía del proceso transformada en UMA, conforme lo previsto en el artículo 27.","e":"Título II — Disposiciones Particulares · Capítulo 1 — Parámetros Para Regulación · Sección 2 — Cuantía del Proceso · Subsección 3 — Determinación por Procesos"},{"n":30,"t":"Incidentes","x":"Los incidentes y tercerías, tramiten en forma autónoma o dentro de un mismo proceso o expediente, deben ser considerados por separado del juicio principal.\nEn los incidentes se debe regular de un 10 % a un 50 % de la escala establecida en el artículo 27.\nEn las tercerías, del 50 % al 100 % de la misma escala. En ningún caso el resultado puede ser inferior a tres (3) UMA.\nEn los incidentes que se promueven en las audiencias, la regulación se debe efectuar teniendo en cuenta la cuantía del juicio, el valor jurídico de la exposición del letrado, la pertinencia de la cuestión planteada y el resultado de la misma. En cualquier caso, no puede regularse una suma inferior al equivalente a una (1) UMA.","e":"Título II — Disposiciones Particulares · Capítulo 1 — Parámetros Para Regulación · Sección 2 — Cuantía del Proceso · Subsección 3 — Determinación por Procesos"},{"n":31,"t":"Juicios ejecutivos, monitorios y ejecuciones especiales","x":"Los honorarios en los procesos ejecutivos, monitorios en general y ejecuciones especiales, se deben regular de la siguiente forma:\n\n1) Por la actuación en la primera etapa, el porcentaje establecido en el artículo 27.\n Si no se dedujo excepciones u oposiciones, el monto que corresponde a  honorarios se debe reducir en un treinta por ciento (30 %).\n 2) Por la actuación en la segunda etapa, el sesenta por ciento (60 %) de los  honorarios regulados en la primera etapa. Si se dedujeron excepciones o se  efectuaron oposiciones, los honorarios se deben regular en un sesenta por  ciento (60 %) de los regulados en la primera etapa.","e":"Título II — Disposiciones Particulares · Capítulo 1 — Parámetros Para Regulación · Sección 2 — Cuantía del Proceso · Subsección 3 — Determinación por Procesos"},{"n":32,"t":"Medidas precautorias","x":"En las medidas precautorias, tramiten en forma autónoma, en forma incidental o dentro del proceso, el monto o cuantía se constituye por el valor que se tiende a asegurar.\nLos honorarios se deben regular en un tercio del porcentaje que corresponda por aplicación de la escala establecida en el artículo 27.\nEn los casos en que existe controversia, los honorarios se deben regular en un cincuenta por ciento (50 %) de la escala establecida en el artículo 27.\nEsta proporción también rige para fijar los honorarios de la contraria, si la medida precautoria es revocada.","e":"Título II — Disposiciones Particulares · Capítulo 1 — Parámetros Para Regulación · Sección 2 — Cuantía del Proceso · Subsección 3 — Determinación por Procesos"},{"n":33,"t":"Ejecución de sentencia","x":"En el procedimiento de ejecución de sentencia recaída en procesos de conocimiento, se debe regular la mitad del porcentaje que resulta de la escala establecida en el artículo 27.\nPor las actuaciones posteriores a la ejecución propiamente dicha, corresponde que se regule un cuarenta por ciento (40 %) del porcentaje que corresponde aplicar de la escala establecida en el artículo 27.","e":"Título II — Disposiciones Particulares · Capítulo 1 — Parámetros Para Regulación · Sección 2 — Cuantía del Proceso · Subsección 3 — Determinación por Procesos"},{"n":34,"t":"Allanamiento, Desistimiento o Perención de Instancia","x":"Cuando los procesos concluyen por allanamiento, desistimiento o perención de instancia, los honorarios se regulan teniendo en cuenta las etapas procesales cumplidas.","e":"Título II — Disposiciones Particulares · Capítulo 1 — Parámetros Para Regulación · Sección 2 — Cuantía del Proceso · Subsección 3 — Determinación por Procesos"},{"n":35,"t":"Transacción. Conciliación","x":"En los casos que el proceso concluya por transacción o conciliación, la cuantía para regular los honorarios es el monto transado o conciliado aplicando la escala establecida en el artículo 27, sin tener en cuenta la etapa en que la misma se produce.","e":"Título II — Disposiciones Particulares · Capítulo 1 — Parámetros Para Regulación · Sección 2 — Cuantía del Proceso · Subsección 3 — Determinación por Procesos"},{"n":36,"t":"Expropiación","x":"Los honorarios en el proceso de expropiación se deben regular del siguiente modo:\n\n1) Si existe conformidad con el monto indemnizatorio, se debe regular el sesenta  por ciento (60 %) del porcentaje que arroja la escala establecida en el artículo  27 en la que se ubica el proceso.\n2) Si existe oposición al monto indemnizatorio, se debe regular el total del  porcentaje de la escala que se calcula sobre el valor establecido en la  sentencia.","e":"Título II — Disposiciones Particulares · Capítulo 1 — Parámetros Para Regulación · Sección 2 — Cuantía del Proceso · Subsección 3 — Determinación por Procesos"},{"n":37,"t":"Acciones posesorias, interdictos, división de bienes","x":"En las acciones posesorias, interdictos o de división de bienes comunes, se aplica la escala establecida en el artículo 27 sobre el valor de los bienes en litigio.","e":"Título II — Disposiciones Particulares · Capítulo 1 — Parámetros Para Regulación · Sección 2 — Cuantía del Proceso · Subsección 3 — Determinación por Procesos"},{"n":38,"t":"Procesos de rendición de cuentas","x":"En los procesos de rendición de cuentas, si no hubiere observaciones, se debe regular el cincuenta por ciento (50 %) del porcentaje que arroja la escala establecida en el artículo 27.\nSe debe calcular sobre el importe de la cuenta rendida.\nSi hay observaciones, se debe regular el setenta por ciento (70 %) de la escala, sobre el importe total de la cuenta.","e":"Título II — Disposiciones Particulares · Capítulo 1 — Parámetros Para Regulación · Sección 2 — Cuantía del Proceso · Subsección 3 — Determinación por Procesos"},{"n":39,"t":"Procesos Penales","x":"En los procesos penales, se debe tener en cuenta:\n\n1) En los casos cuyo monto pueda ser apreciado pecuniariamente, los honorarios  se deben fijar entre el diez (10 %) y el veinte por ciento (20 %) del monto del  proceso, teniendo en cuenta para ello la naturaleza del caso, la actividad  realizada por el profesional y la influencia que la sentencia tenga o pueda tener  por sí o con relación al derecho de las partes ulteriormente.\nLa acción indemnizatoria que se promueve en el proceso penal, se debe regular  como si se tratara de un proceso ordinario en sede civil.\n2) En los casos sin cuantía, tanto en primera como en segunda instancia, se  deben regular conforme lo establecido en el artículo 70, según las distintas  intervenciones del profesional.","e":"Título II — Disposiciones Particulares · Capítulo 1 — Parámetros Para Regulación · Sección 2 — Cuantía del Proceso · Subsección 3 — Determinación por Procesos"},{"n":40,"t":"Proceso judicial en segunda instancia","x":"En cada uno de los procesos judiciales de segunda instancia, los honorarios profesionales se deben calcular entre el cuarenta (40 %) y el cincuenta por ciento (50 %) de la cantidad que se fije para honorarios en primera instancia.\nSi la sentencia recurrida es revocada parcialmente o modificada, el tribunal de segunda instancia debe adecuar las regulaciones por las actividades desplegadas en primera instancia en consideración al nuevo resultado del proceso. En estos casos debe fijarse los honorarios que corresponden a ambas instancias.\nSi la sentencia recurrida es revocada en todas sus partes, los honorarios profesionales de la apelante se deben determinar entre el cincuenta por ciento (50 %) y el sesenta por ciento (60 %) por ciento de los fijados a la parte vencedora en primera instancia.","e":"Título II — Disposiciones Particulares · Capítulo 1 — Parámetros Para Regulación · Sección 2 — Cuantía del Proceso · Subsección 3 — Determinación por Procesos"},{"n":41,"t":"Recursos superiores","x":"Por la interposición de recursos ante la Corte de Justicia de la Provincia de San Juan, extraordinarios, de inconstitucionalidad, de revisión, de casación, inaplicabilidad de ley, ordinarios, directos y otros similares o que no sean los normales de acceso, corresponde que se regulen honorarios cuyo mínimo no puede ser inferior al equivalente a 20 UMA.\nLas quejas, por denegación de estos recursos, como mínimo, 15 UMA.","e":"Título II — Disposiciones Particulares · Capítulo 1 — Parámetros Para Regulación · Sección 2 — Cuantía del Proceso · Subsección 3 — Determinación por Procesos"},{"n":42,"t":"Amparo, Hábeas data y Hábeas corpus","x":"Por la interposición de acciones de amparo, hábeas data, hábeas corpus, los honorarios se deben regular conforme lo previsto en el artículo 83 de la presente Ley. En ningún caso la regulación puede ser inferior al monto equivalente a 10 UMA.","e":"Título II — Disposiciones Particulares · Capítulo 1 — Parámetros Para Regulación · Sección 2 — Cuantía del Proceso · Subsección 3 — Determinación por Procesos"},{"n":43,"t":"Exhortos y oficios Ley N° 22172","x":"Los exhortos y oficios, son remunerados con los siguientes honorarios:\n\n1) Por la inscripción de dominio y otros derechos reales, el dos por ciento (2 %) del  valor de los bienes;\n2) Por la inscripción de hipotecas, medidas precautorias y demás gravámenes, el  veinte por ciento (20 %) de la escala establecida en el artículo 27 sobre el  monto de las mismas. Por la cancelación, el diez por ciento (10 %) de dicha  escala;\n3) Por diligencias probatorias y otros actos no previstos en esta Ley, entre el diez  por ciento (10 %) y el veinte por ciento (20 %) de la escala establecida en el  artículo 27 de esta Ley;\n4) Por las notificaciones, citaciones, emplazamientos y medidas de simple trámite,  entre 2 y 5 UMA;\n 5) Cuando se trate de remates de bienes muebles o inmuebles, del cuatro por  ciento (4%) al seis por ciento (6%) del crédito reclamado. Igual criterio se  adopta si la subasta fracasa.\n\nEn los exhortos se exige como recaudo la información del Tribunal de origen sobre el valor del juicio. En ningún caso, la regulación puede ser inferior a 1 UMA.","e":"Título II — Disposiciones Particulares · Capítulo 1 — Parámetros Para Regulación · Sección 2 — Cuantía del Proceso · Subsección 3 — Determinación por Procesos"},{"n":44,"t":"Contencioso Administrativo","x":"Por la interposición del proceso contencioso administrativo se aplicará lo establecidos en los artículos 22 y 27 de la presente Ley. Si el mismo no tiene contenido económico los honorarios no pueden ser inferiores a 20 UMA.","e":"Título II — Disposiciones Particulares · Capítulo 1 — Parámetros Para Regulación · Sección 2 — Cuantía del Proceso · Subsección 3 — Determinación por Procesos"},{"n":45,"t":"Procesos Laborales","x":"En los procesos que tramitan en el fuero laboral se deben aplicar las disposiciones de esta Ley, tanto en las etapas de los procedimientos contradictorios, como en las ejecuciones de resoluciones administrativas o en las que intervenga como tribunal de alzada, según corresponda.","e":"Título II — Disposiciones Particulares · Capítulo 1 — Parámetros Para Regulación · Sección 2 — Cuantía del Proceso · Subsección 3 — Determinación por Procesos"},{"n":46,"t":"Mínimo a regular","x":"El mínimo establecido para regular honorarios de juicios susceptibles de apreciación pecuniaria que no estén previstos en esta Ley es de 10 UMA en los procesos de conocimiento y de 5 UMA en los procesos de mediación.","e":"Título II — Disposiciones Particulares · Capítulo 1 — Parámetros Para Regulación · Sección 2 — Cuantía del Proceso · Subsección 3 — Determinación por Procesos"},{"n":47,"t":"Procesos arbitrales","x":"En los procesos arbitrales se aplican las pautas establecidas en el artículo 83 de la presente Ley.","e":"Título II — Disposiciones Particulares · Capítulo 1 — Parámetros Para Regulación · Sección 2 — Cuantía del Proceso · Subsección 3 — Determinación por Procesos"},{"n":48,"t":"Intervención de varios abogados","x":"Si en el procedimiento interviene más de un abogado o procurador a la vez por una misma parte, se considera, a los efectos de la regulación, como un solo patrocinio o representación para regular los honorarios profesionales.\nEn el caso de sustitución del abogado o del procurador, los honorarios de cada uno se deben regular individualmente, en proporción a la tarea cumplida por cada uno o por las etapas en las que haya participado.","e":"Título II — Disposiciones Particulares · Capítulo 1 — Parámetros Para Regulación · Sección 2 — Cuantía del Proceso · Subsección 4 — Determinación por Etapas"},{"n":49,"t":"División en etapas","x":"Para regular los honorarios por la participación que los profesionales han tenido, los procesos se dividen en etapas según su naturaleza.","e":"Título II — Disposiciones Particulares · Capítulo 1 — Parámetros Para Regulación · Sección 2 — Cuantía del Proceso · Subsección 4 — Determinación por Etapas"},{"n":50,"t":"Etapas Procesales","x":"Las etapas son:\n\n1) Demanda y contestación en toda clase de juicios, una tercera parte del proceso.\n2) Actuaciones de prueba en los procesos ordinarios y especiales, otra tercera  parte.\n3) Demás diligencias y trámites hasta la finalización del proceso en primera  instancia, otra tercera parte del proceso.\n\nToda actividad complementaria o posterior a las etapas enumeradas anteriormente, debe ser considerada como una etapa independiente para regulación de honorarios. Esta regulación no debe superar la tercera parte de la regulación principal.","e":"Título II — Disposiciones Particulares · Capítulo 1 — Parámetros Para Regulación · Sección 2 — Cuantía del Proceso · Subsección 4 — Determinación por Etapas"},{"n":51,"t":"Proceso ejecutivo","x":"El proceso ejecutivo sin oposición de excepciones, se divide en dos etapas:\n\n1) Desde la demanda hasta la sentencia.\n2) Desde la sentencia hasta su conclusión.\nEl proceso ejecutivo con oposición de excepciones se divide en tres etapas:\n1) Demanda, oposición de excepciones y contestación de éstas.\n2) Etapa probatoria.\n3) Trámites posteriores a la sentencia.\n\nUna vez firme los honorarios, la ejecución de los mismos no debe tener otra sustanciación que la simple tramitación de embargo o ampliación de embargo sin necesidad de abrir la vía incidental.","e":"Título II — Disposiciones Particulares · Capítulo 1 — Parámetros Para Regulación · Sección 2 — Cuantía del Proceso · Subsección 4 — Determinación por Etapas"},{"n":52,"t":"Proceso monitorio","x":"El proceso monitorio sin oposición se divide en dos etapas:\n\n1) Demanda y sentencia.\n2) Trámites posteriores.\nSi existe oposición a la sentencia monitoria, se divide en tres etapas:\n1) Demanda y sentencia.\n2) Etapa probatoria.\n3) Trámite posterior a la resolución de las observaciones.","e":"Título II — Disposiciones Particulares · Capítulo 1 — Parámetros Para Regulación · Sección 2 — Cuantía del Proceso · Subsección 4 — Determinación por Etapas"},{"n":53,"t":"Incidentes","x":"El incidente se divide en dos etapas:\n\n1) Planteo que lo origine.\n2) Desarrollo hasta su conclusión.","e":"Título II — Disposiciones Particulares · Capítulo 1 — Parámetros Para Regulación · Sección 2 — Cuantía del Proceso · Subsección 4 — Determinación por Etapas"},{"n":54,"t":"Sucesorios","x":"El proceso sucesorio se divide en tres etapas:\n\n1) Actuaciones completas de iniciación.\n2) Actuaciones hasta la inscripción de la declaratoria de herederos o aprobación  del testamento.\n3) Trámites posteriores hasta la orden judicial de inscripción.","e":"Título II — Disposiciones Particulares · Capítulo 1 — Parámetros Para Regulación · Sección 2 — Cuantía del Proceso · Subsección 4 — Determinación por Etapas"},{"n":55,"t":"Honorarios por participación del abogado y del procurador","x":"Los honorarios del abogado que actúa con poder especial o general para asuntos judiciales, corresponden al cien por ciento (100 %) de lo que fija esta Ley.\nLos honorarios del abogado que actúa como patrocinante, corresponden al ochenta por ciento (80 %) del que actúa con poder.\nLos honorarios del procurador se deben fijar en un veinte por ciento (20 %) de los que, por esta Ley, corresponde fijar al abogado patrocinante.","e":"Título II — Disposiciones Particulares · Capítulo 1 — Parámetros Para Regulación · Sección 2 — Cuantía del Proceso · Subsección 5 — Determinación por Participación"},{"n":56,"t":"Litisconsorcio","x":"En caso de litisconsorcio en el proceso judicial, la regulación de los honorarios se debe limitar al interés de cada litisconsorte.\n La regulación a cada litisconsorte no puede superar el cincuenta por ciento (50 %) del monto que resulta de aplicar la escala establecida en el artículo 27 de la presente Ley.\nEn los procesos de jurisdicción voluntaria, a los fines de la regulación, se considera que hay una (1) sola parte.","e":"Título II — Disposiciones Particulares · Capítulo 1 — Parámetros Para Regulación · Sección 2 — Cuantía del Proceso · Subsección 5 — Determinación por Participación"},{"n":57,"t":"Profesional de la parte vencida","x":"Los honorarios del profesional de la parte que pierde total o parcialmente el pleito, se deben establecer conforme a las pautas establecidas en el artículo 83 de la presente Ley.\nNo puede exceder el setenta por ciento (70 %) de los honorarios regulados a la parte vencedora.","e":"Título II — Disposiciones Particulares · Capítulo 1 — Parámetros Para Regulación · Sección 2 — Cuantía del Proceso · Subsección 5 — Determinación por Participación"},{"n":58,"t":"Acumulación de acciones. Reconvención","x":"Si en el proceso se acumulan acciones o se deduce reconvención, se deben regular por separado los honorarios que correspondan a cada una.","e":"Título II — Disposiciones Particulares · Capítulo 1 — Parámetros Para Regulación · Sección 2 — Cuantía del Proceso · Subsección 5 — Determinación por Participación"},{"n":59,"t":"Normas especiales","x":"En el proceso sucesorio se aplican las normas de esta Ley, con las excepciones que a continuación se establecen.","e":"Título II — Disposiciones Particulares · Capítulo 1 — Parámetros Para Regulación · Sección 3 — Proceso Sucesorio"},{"n":60,"t":"Cuantía del proceso","x":"La cuantía del proceso se determina sobre el monto del acervo, inclusive los gananciales, que se valúan conforme lo establecen los artículos 22 y siguientes de la presente Ley.\n En caso de ampliación de la denuncia de bienes con posterioridad al auto regulatorio, deben dictarse tantos autos regulatorios como ampliaciones de bienes se realicen.\nEn el supuesto que no existan bienes de apreciación pecuniaria en el acervo, la regulación nunca es inferior a 10 UMA.","e":"Título II — Disposiciones Particulares · Capítulo 1 — Parámetros Para Regulación · Sección 3 — Proceso Sucesorio"},{"n":61,"t":"Base de regulación","x":"En el proceso sucesorio los honorarios se deben regular conforme a la escala del artículo 27.","e":"Título II — Disposiciones Particulares · Capítulo 1 — Parámetros Para Regulación · Sección 3 — Proceso Sucesorio"},{"n":62,"t":"Regulación por participación","x":"En el proceso sucesorio, los honorarios se regulan:\n\n1) Por las actuaciones en la primera etapa, el veinticinco por ciento (25 %) del total  a regular.\n2) Por las actuaciones en la segunda etapa, el veinticinco por ciento (25 %) del  total a regular.\n3) Por las actuaciones en la tercera etapa, el cincuenta por ciento (50 %) del total  a regular.","e":"Título II — Disposiciones Particulares · Capítulo 1 — Parámetros Para Regulación · Sección 3 — Proceso Sucesorio"},{"n":63,"t":"Intervención de varios profesionales","x":"Cuando intervengan varios profesionales, los honorarios se deben regular clasificando los trabajos, debiendo discriminar el carácter de común a cargo de la masa o particular a cargo del interesado.","e":"Título II — Disposiciones Particulares · Capítulo 1 — Parámetros Para Regulación · Sección 3 — Proceso Sucesorio"},{"n":64,"t":"Abogado partidor","x":"Los honorarios del abogado o abogados partidores, en conjunto, se deben fijar sobre el valor de los bienes partidos, entre un tres por ciento (3%) y un cinco por ciento (5%) del total.","e":"Título II — Disposiciones Particulares · Capítulo 1 — Parámetros Para Regulación · Sección 3 — Proceso Sucesorio"},{"n":65,"t":"En los procesos concursales","x":"Los honorarios de los abogados y procuradores se regulan de conformidad con las disposiciones de la Ley de Concursos y Quiebras, respetando las modalidades de la presente Ley.","e":"Título II — Disposiciones Particulares · Capítulo 1 — Parámetros Para Regulación · Sección 4 — Concursos y Quiebras"},{"n":66,"t":"","x":"Actuaciones no previstas en la Ley de Concursos y Quiebras: Los honorarios no previstos por la Ley Nº 24.522 se regulan de la siguiente manera:\n\n1) En el pedido de quiebra formulado por acreedor y rechazado, el veinte por  ciento (20%) de la escala establecida en el artículo 27, sobre el monto del  crédito invocado para el abogado del peticionante, y el cien por ciento (100 %)  para el abogado del deudor;\n2) Por el pedido de formación de concurso preventivo formulado por el deudor y  rechazado, hasta el dos por ciento (2 %) del activo denunciado;\n3) Por el pedido de verificación formulado ante el Síndico, el treinta por ciento (30  %) de la escala establecida en el artículo 27, sobre el monto del crédito  verificado. Cuando el crédito no se verifique, corresponde regular la mitad;\n4) Por el incidente de revisión, la escala establecida en el artículo 27, sobre el  monto del crédito. La acumulación de los honorarios previstos en este inciso y  en el anterior, no puede superar el máximo de dicha escala;\n5) Por el pedido de verificación formulado en forma tardía, la escala establecida en  el artículo 27, sobre el cuarenta por ciento (40 %) del monto del crédito que se  pretende verificar;\n6) Por los incidentes de calificación de conducta y rehabilitación, 30 UMA como  mínimo;\n7) Por los demás incidentes previstos por la Ley Nº 24.522, cualquiera sea el  trámite impreso, la escala establecida en el artículo 27, sobre el valor  económico del litigio incidental.","e":"Título II — Disposiciones Particulares · Capítulo 1 — Parámetros Para Regulación · Sección 4 — Concursos y Quiebras"},{"n":67,"t":"Mediación con acuerdo","x":"Los honorarios de los profesionales se deben pactar. En caso de no existir pacto, los honorarios se deben regular:\n\n1) En los asuntos con contenido económico, se establece el quince por ciento  (15%) sobre el monto del acuerdo;\n2) En los asuntos sin contenido económico, un monto equivalente a 5 UMA como  mínimo, teniendo en cuenta lo establecido en el artículo 83.","e":"Título II — Disposiciones Particulares · Capítulo 1 — Parámetros Para Regulación · Sección 5 — Mediación"},{"n":68,"t":"Mediación sin acuerdo","x":"En caso que se clausure la etapa de mediación sin haber llegado a un acuerdo, los honorarios de los profesionales se deben fijar en un monto equivalente a 2 UMA.","e":"Título II — Disposiciones Particulares · Capítulo 1 — Parámetros Para Regulación · Sección 5 — Mediación"},{"n":69,"t":"Coactuación","x":"Cuando en la etapa de mediación intervenga más de un profesional, a los efectos del cobro de honorarios se considera que actuó uno solo, debiendo distribuir entre ellos lo convenido.","e":"Título II — Disposiciones Particulares · Capítulo 1 — Parámetros Para Regulación · Sección 5 — Mediación"},{"n":70,"t":"","x":"Asuntos judiciales no susceptibles de apreciación pecuniaria: En los procesos judiciales no susceptibles de apreciación pecuniaria, los honorarios profesionales se deben calcular en UMA, teniendo en cuenta las pautas establecidas en el artículo 83, y los mínimos detallados en los artículos siguientes.","e":"Título II — Disposiciones Particulares · Capítulo 1 — Parámetros Para Regulación · Sección 6 — Procesos Judiciales y Procedimientos sin Cuantía"},{"n":71,"t":"Procesos de familia","x":"Los honorarios mínimos que corresponde percibir por la actividad profesional, resultan de la cantidad de UMA que se detallan en las siguientes tablas:\n\n1) Acciones derivadas del matrimonio  a) Declaración de divorcio unilateral 20 UMA  b) Declaración de divorcio bilateral 20 UMA  c) Nulidad de matrimonio 30 UMA\n2) Acciones de determinación de la filiación 30 UMA\n3) Procesos de adopciones:\n a) Declaración estado adoptabilidad 30 UMA  b) Adopción 30 UMA  c) Adopción de integración 20 UMA\n4) Acciones derivadas de responsabilidad parental:\n a) Suspensión, pérdida y rehabilitación de la responsabilidad parental 20 UMA  b) Cuidado personal y régimen de comunicación 10 UMA\n5) Autorización para contraer matrimonio, salir del país, comparecer en juicio y  realizar actos jurídicos 5 UMA\n6) Acciones en materia de restitución internacional de niños niñas y adolescentes:\n a) Restitución 20 UMA  b) Medidas de protección 20 UMA  c) Régimen de comunicación o contacto internacional 20 UMA\n7) Determinación de la capacidad jurídica de las personas:\n a) Proceso de restricción de capacidad y declaración de incapacidad 20 UMA  b) Inhabilitación- designación curador 10 UMA  c) Rehabilitación de la capacidad jurídica de las personas 20 UMA  d) Acciones de inhabilitación por prodigalidad 10 UMA  e) Solicitud apoyo a personas con discapacidad 10 UMA  f) Autorización para disponer, gravar y adquirir bienes de incapaces 20 UMA\n8) Planteos especiales:\n a) Satisfacción inmediata de pretensión 10 UMA  b) Proceso de violencia familiar cuando sea contradictorio 10 UMA\n\nEl Juez, teniendo en cuenta la situación particular del justiciable, puede establecer por resolución fundada, menor cantidad de UMA del mínimo establecido, siempre que la reducción no exceda del 15%, para garantizar el acceso a la justicia a personas en situación de vulnerabilidad económica, debidamente acreditada.","e":"Título II — Disposiciones Particulares · Capítulo 1 — Parámetros Para Regulación · Sección 6 — Procesos Judiciales y Procedimientos sin Cuantía"},{"n":72,"t":"Actuación ante la justicia penal","x":"Los honorarios mínimos que corresponde percibir por la actividad profesional, resultan de la cantidad de UMA que se detallan en la siguiente tabla:\n\n1) Ampliación del objeto de la IPP: 2 UMA\n2) Anticipo de prueba: 2 UMA\n3) Conciliación en delitos de acción privada o pública 4 UMA\n4) Contravenciones y faltas administrativas 2 UMA  5) Control de detención y formalización de IPP 4 UMA\n6) Control de acusación 4 UMA\n7) Control judicial anterior a la formalización de IPP 2 UMA\n8) Debate del juicio oral y determinación de la pena 10 UMA\n9) Habeas corpus 4 UMA\n10) Impugnación extraordinaria revisión de sentencia condenatoria 10 UMA\n11) Impugnación extraordinaria casación 10 UMA\n12) Impugnación extraordinaria inconstitucionalidad 10 UMA\n13) Impugnación ordinaria apelación 10 UMA\n14) Juicio abreviado 10 UMA\n15) Modificación de medida cautelar 4 UMA\n16) Ofrecimiento de prueba en delitos de acción privada 4 UMA\n17) Presentación de denuncia penal con firma letrada 6 UMA\n18) Presentación de inimputabilidad 6 UMA\n19) Procedencia de diligencias propuestas 4 UMA\n20) Prorroga plazo IPP 4 UMA\n21) Rebeldía 2 UMA\n22) Rechazo de la querella 2 UMA\n23) Recusación 2 UMA\n24) Reducción plazo IPP 4 UMA\n25) Renovación de medida cautelar 4 UMA\n26) Requerimiento de medidas de coerción y cautelares 4 UMA\n27) Reserva de legajo de investigación 4 UMA\n28) Revisión de ejecución 6 UMA\n29) Revisión de medida cautelar 6 UMA\n30) Revocación condena condicional 6 UMA\n31) Revocación de la libertad condicional 6 UMA\n32) Revocación de la suspensión de juicio a prueba 6 UMA\n33) Revocación de medida cautelar 4 UMA\n34) Revocatoria decisiones fuera de audiencia 4 UMA\n35) Saneamiento o nulidad 6 UMA\n36) Sobreseimiento 10 UMA\n37) Solicitud de prisión domiciliaria 8 UMA\n38) Suspensión del juicio a prueba 10 UMA\n39) Tramites de ejecución 6 UMA\n40) Unificación de penas 4 UMA\n41) Unilateral de prórroga de la investigación previa a la formalización IPP 4  UMA\n42) Unilateral para apertura y examen de secuestro 4 UMA","e":"Título II — Disposiciones Particulares · Capítulo 1 — Parámetros Para Regulación · Sección 6 — Procesos Judiciales y Procedimientos sin Cuantía"},{"n":73,"t":"Trámites ante el Registro Público","x":"Los honorarios mínimos que corresponde percibir por la actividad profesional, resultan de la cantidad de UMA que se detallan en las siguientes tablas:\n\n1) Consulta de homonimia 1 UMA\n2) Inscripción de sociedad constituida en el extranjero 15 UMA\n3) Inscripción de una Sociedad, constitución de personas jurídicas en general 8  UMA\n4) Trámite de inscripción ante Inspección de Personería Jurídica 8 UMA\n5) Transferencia de fondo de comercio 10 UMA\n6) Inscripción de directorio S.A., inscripción de gerencia S.R.L., inscripción de  administrador S.A.S./extranjera/ut 5 UMA\n7) Aumento de capital en cualquier tipo de sociedades 5 UMA  8) Cancelación por cambio de jurisdicción a otra provincia, cambio de jurisdicción  a la provincia de San Juan, inscripción de sucursal en San Juan 10 UMA\n9) Modificaciones de contrato. Cesión de cuotas S.R.L. 10 UMA\n10) Modificaciones de contrato. Incorporación de herederos en S.R.L. 10 UMA\n11) Prórroga, reconducción 10 UMA\n12) Solicitud de copias, de certificados, cambio de domicilio, sede social,  autorización sistema contable computarizado, inscripción de poder 3 UMA\n13) Escisión, fusión, liquidación, subsanación, transformación 10 UMA\n14) Rúbrica de libros de comercio 2 UMA","e":"Título II — Disposiciones Particulares · Capítulo 1 — Parámetros Para Regulación · Sección 6 — Procesos Judiciales y Procedimientos sin Cuantía"},{"n":74,"t":"","x":"Actuaciones administrativas. En las actuaciones administrativas ante organismos públicos nacionales, provinciales o municipales, empresas del estado, entes descentralizados o autárquicos y Organismos Constitucionales los honorarios profesionales son:\n\n1) Si la cuestión no es susceptible de apreciación pecuniaria, según las pautas  establecidas en artículo 83, de 3 a 15 UMA.\n2) Si la cuestión es susceptible de apreciación pecuniaria, el quince por ciento (15  %) del monto total liquidado.","e":"Título II — Disposiciones Particulares · Capítulo 1 — Parámetros Para Regulación · Sección 7 — Actuaciones Ante Organismos Públicos"},{"n":75,"t":"Actuación en comisiones médicas","x":"En las actuaciones ante la Superintendencia de Riesgos del Trabajo, por procesos que tramiten ante las Comisiones Médicas o el Servicio de Homologación creado en el ámbito de las Comisiones Médicas Jurisdiccionales, devengará honorarios a cargo de las Aseguradoras de Riesgos del Trabajo o empleadores auto asegurados, conforme a los siguientes parámetros:\n\n1) Si la cuestión no es susceptible de apreciación pecuniaria y se reconoce total o  parcialmente la pretensión reclamada por el damnificado en el procedimiento  ante las Comisiones Médicas, de 5 a 10 UMA, según las pautas establecidas en  el artículo 83.\n2) Si la cuestión es susceptible de apreciación pecuniaria, el catorce por ciento (14  %) del total liquidado.\n\nLos honorarios devengados deben ser cancelados por la obligada al pago dentro de los diez (10) días de concluida la actuación administrativa o la homologación del trámite.","e":"Título II — Disposiciones Particulares · Capítulo 1 — Parámetros Para Regulación · Sección 7 — Actuaciones Ante Organismos Públicos"},{"n":76,"t":"Asuntos extrajudiciales","x":"En los asuntos extrajudiciales que no estén regulados en los artículos anteriores, los honorarios profesionales son:\n\n1) Consultas verbales dentro de horario de atención 0,5 UMA.\n2) Consultas verbales fuera de horario de atención 1 UMA.\n3) Consultas con informe 2 UMA.\n4) Redacción de cartas documento o telegramas laborales 1,5 UMA.\n5) Estudio o información de actuaciones judiciales, administrativos o ambas 3  UMA.\n 6) Asistencia y asesoramiento del cliente en la realización de actos jurídicos 4  UMA.\n7) Redacción de contratos de locación: del uno al cinco por ciento (1 al 5 %) del  valor del contrato. El arancel no debe ser inferior a 4 UMA.\n8) Redacción de boleto de compra venta: del uno al cinco por ciento (1 al 5 %) del  valor del mismo. El arancel no debe ser inferior a 4 UMA.\n9) Redacción de contratos o estatutos de sociedades comerciales, asociaciones,  fundaciones y constitución de personas jurídicas en general: del uno al tres por  ciento (1 al 3 %) del capital social. El arancel no debe ser inferior a 6 UMA.\n10) Redacción de otros contratos: del uno al cinco por ciento (1 al 5 %) del valor  de los mismos.\n11) Arreglos extrajudiciales: como mínimo, el cincuenta por ciento (50 %) de las  escalas fijadas para los acuerdos judiciales.\n12) Asistencia a una audiencia de mediación o conciliación: 5 UMA.\n13) Redacción de testamentos: uno por ciento (1 %) del valor de los bienes.\n14) División de bienes comunes: del diez al quince por ciento (10 al 15 %) del  valor de la cuota parte que corresponda al asistido profesionalmente.\n15) Trámites ante la Inspección General de Persona Jurídica: 10 UMA.","e":"Título II — Disposiciones Particulares · Capítulo 1 — Parámetros Para Regulación · Sección 8 — Actuaciones Extrajudiciales"},{"n":77,"t":"Cuantía","x":"Para la determinación judicial de honorarios profesionales por trabajos extrajudiciales, que no estén incluidos en el artículo anterior, el juez debe aplicar la escala establecida en el artículo 27.\nEn ningún caso los honorarios que se regulen pueden ser inferior al cincuenta por ciento (50%) de lo que corresponde judicialmente según la pauta del párrafo anterior.","e":"Título II — Disposiciones Particulares · Capítulo 1 — Parámetros Para Regulación · Sección 8 — Actuaciones Extrajudiciales"},{"n":78,"t":"Regulación en sentencia","x":"La sentencia debe regular los honorarios de los profesionales intervinientes, aún sin petición de los interesados.\nSi por la especificidad o por las circunstancias particulares del proceso, los honorarios de los profesionales intervinientes no deban o no puedan regularse en la sentencia, debe dictarse auto regulatorio anterior o posterior a la misma.","e":"Título II — Disposiciones Particulares · Capítulo 2 — Procedimiento Para Regulación"},{"n":79,"t":"Presentación de estimación","x":"Los interesados pueden, al momento de solicitar la regulación de sus honorarios, presentar una estimación, manifestando las situaciones fácticas, económicas o legales que puedan orientar al juez respecto de la base regulatoria, el porcentaje de regulación o de las UMA que correspondan.","e":"Título II — Disposiciones Particulares · Capítulo 2 — Procedimiento Para Regulación"},{"n":80,"t":"Traslado de la estimación","x":"De la estimación presentada se debe correr traslado a los demás interesados por el término de cinco (5) días, a fin de que expresen lo que estimen atinente a su derecho. El plazo es común.\nLa estimación se debe notificar conforme los medios y procedimientos establecidos en el Código Procesal Civil, Comercial y Minería.\nVencido el plazo sin que se haga observación, o efectuada la misma, el juez debe dictar auto que decida la base si corresponde, y que regule los honorarios a los profesionales intervinientes, salvo que no corresponda por ley especial o por petición expresa del profesional.","e":"Título II — Disposiciones Particulares · Capítulo 2 — Procedimiento Para Regulación"},{"n":81,"t":"Honorarios por actuaciones administrativas o extrajudiciales","x":"Cuando se trate de actuaciones administrativas o extrajudiciales, los honorarios de los profesionales intervinientes deben regularse en un procedimiento a ese efecto.\nLos interesados pueden solicitar la regulación de honorarios al juez de primera instancia que considere competente en razón de la materia y realizar su estimación. La presentación se realiza en la Mesa General de Entradas con copia de las actuaciones administrativas, las pruebas documentales y ofreciendo las demás pruebas de que el peticionante intente valerse.\nDe la demanda, el juez debe dar traslado a los interesados, por el plazo de cinco (5) días.\nEl traslado se notifica en el domicilio real del interesado, por cualquier medio previsto en el Código Procesal Civil, Comercial y Minería, con copias de la presentación o una transcripción de su parte pertinente o mencionando el link de descarga. No es necesario peticionar la autorización de la forma de notificación.\nSi no hay oposición, el juez regula los honorarios sin más trámite.\nSi hay oposición, se aplican las normas del proceso abreviado, salvo que el profesional solicite la aplicación del proceso ordinario.","e":"Título II — Disposiciones Particulares · Capítulo 2 — Procedimiento Para Regulación"},{"n":82,"t":"","x":"Regulación por actuaciones administrativas que derivan en proceso judicial: Cuando se trate de actuaciones administrativas que derivan en proceso judicial, el juez, al regular los honorarios devengados en ese proceso judicial, debe fijar también, por separado, los que correspondan a las actividades efectuadas ante la administración.\nQueda a salvo el derecho del profesional interviniente de adelantar su regulación por el procedimiento previsto en el artículo 80.","e":"Título II — Disposiciones Particulares · Capítulo 2 — Procedimiento Para Regulación"},{"n":83,"t":"Requisitos de la regulación de honorarios","x":"En la sentencia que regule honorarios o en el auto regulatorio, bajo pena de nulidad, el juez debe citar la disposición legal aplicada y fundar la regulación de honorarios teniendo en cuenta:\n\n1) El monto del asunto, si fuera susceptible de apreciación pecuniaria.\n2) El valor, motivo, extensión y calidad jurídica de la labor desarrollada.\n3) La complejidad y novedad de la cuestión planteada.\n4) La responsabilidad que de las particularidades del caso pudiera haberse  derivado para el profesional.\n5) El resultado obtenido.\n6) La probable trascendencia de la resolución a que se llegare, para futuros casos.\n7) La trascendencia económica y moral que para el interesado revista la cuestión  en debate.\n\nLa regulación de honorarios debe ser expresada en términos porcentuales o en UMA, según corresponda.","e":"Título II — Disposiciones Particulares · Capítulo 2 — Procedimiento Para Regulación"},{"n":84,"t":"Abogado patrocinado","x":"Si un abogado es patrocinado por otro, el honorario se debe regular considerando al patrocinado como procurador y al patrocinante como abogado.","e":"Título II — Disposiciones Particulares · Capítulo 2 — Procedimiento Para Regulación"},{"n":85,"t":"Notificación de la regulación","x":"La regulación se debe notificar al beneficiario, al obligado al pago y a su representante judicial, en la forma y por los medios previstos en el Código Procesal Civil, Comercial y Minería.","e":"Título II — Disposiciones Particulares · Capítulo 2 — Procedimiento Para Regulación"},{"n":86,"t":"Apelación","x":"La regulación de honorarios es apelable.\n Si está contenida en una sentencia, inclusive la que se dicta en el procedimiento al solo efecto regulatorio o en el proceso judicial derivado de actuaciones administrativas, la apelación se interpone y sustancia en los mismos plazos y formas que los previstos para el recurso de apelación que corresponda.\nSi está contenida en auto regulatorio, la apelación debe interponerse ante el actuario en el acto de notificación personal o en el plazo de cinco (5) días de ser notificado.\nSolamente cuando esté fundada, los restantes interesados pueden, a su vez, expresar lo que estimen atinente a su derecho en el plazo de cinco (5) días de ser concedido.","e":"Título II — Disposiciones Particulares · Capítulo 2 — Procedimiento Para Regulación"},{"n":87,"t":"Elevación por apelación","x":"El expediente se debe elevar al superior dentro de los dos (2) días siguientes, y la Cámara de Apelaciones debe resolver la apelación dentro de los diez (10) días de haberlo recibido, sin previa notificación a las partes ni otra sustanciación, y aunque esté pendiente de reposición el impuesto o tasa de justicia.\nEste trámite se aplica en todas las apelaciones de honorarios deducidas separadamente de la cuestión principal, aunque en ella se cuestione la base regulatoria o la calificación de las tareas de los beneficiarios.","e":"Título II — Disposiciones Particulares · Capítulo 2 — Procedimiento Para Regulación"},{"n":88,"t":"Recurso extraordinario","x":"La regulación de honorarios por debajo o por encima de los porcentuales o de las escalas establecidas en esta Ley, es recurrible en instancia extraordinaria.","e":"Título II — Disposiciones Particulares · Capítulo 2 — Procedimiento Para Regulación"},{"n":89,"t":"Trámite","x":"La acción por cobro de honorarios regulados judicialmente, tramita por la vía de ejecución de sentencia.","e":"Título II — Disposiciones Particulares · Capítulo 3 — Ejecución de Honorarios"},{"n":90,"t":"Exención de gravamen","x":"La ejecución de honorarios profesionales no devenga ni se puede gravar con tasa judicial, sellado, ni impuesto alguno.","e":"Título II — Disposiciones Particulares · Capítulo 3 — Ejecución de Honorarios"},{"n":91,"t":"Ejecución de honorarios convenidos","x":"Cuando se demanden honorarios convenidos provenientes de labor profesional, se debe proceder a preparar la vía ejecutiva conforme lo dispuesto por el Código Procesal Civil, Comercial y Minería de la Provincia de San Juan, acompañando la documentación que acredite la labor profesional y el convenio suscripto por el obligado; salvo que sus firmas estén certificadas por Escribano Público, que constituye título ejecutivo.","e":"Título II — Disposiciones Particulares · Capítulo 3 — Ejecución de Honorarios"},{"n":92,"t":"Plazo para el pago","x":"Los honorarios regulados judicialmente deben abonarse dentro de los cinco (5) días de quedar firme el auto que los regula.\nLos honorarios extrajudiciales se deben abonar dentro de los diez (10) días de intimado su pago, cuando sean exigibles.","e":"Título II — Disposiciones Particulares · Capítulo 4 — Pago de los Honorarios"},{"n":93,"t":"Moneda de pago","x":"Los honorarios deben pagarse en moneda de curso legal, salvo acuerdo de partes o lo previsto por el artículo 24.","e":"Título II — Disposiciones Particulares · Capítulo 4 — Pago de los Honorarios"},{"n":94,"t":"Pago en especie","x":"Se puede admitir, en la transacción o conciliación, la entrega en especie como pago de los honorarios debidos. Para ello, el profesional acreedor de los honorarios puede ofrecer prueba sobre el valor de mercado del objeto, para lo cual se debe aplicar el procedimiento establecido en el artículo 22.","e":"Título II — Disposiciones Particulares · Capítulo 4 — Pago de los Honorarios"},{"n":95,"t":"Intereses","x":"Los honorarios regulados, una vez firmes, devengan intereses de pleno derecho hasta su íntegro y efectivo pago.\nCorresponde aplicar a los honorarios idéntica tasa que se aplica al capital de condena; salvo que al capital se le aplique tasa pasiva, en cuyo caso a los honorarios se le debe aplicar la tasa activa para las operaciones de descuento del Banco Nación a treinta (30) días.\nLos honorarios recurridos devengan el interés indicado, desde la fecha de la primera regulación correspondiente a cada instancia.\nLa regulación de honorarios debe ser expresada en UMA y su equivalente en moneda de curso legal, más los intereses previstos en la Ley 9-O al día de su efectivo pago.","e":"Título II — Disposiciones Particulares · Capítulo 4 — Pago de los Honorarios"},{"n":96,"t":"Pago por el cliente","x":"Si el condenado en costas no abona los honorarios profesionales en tiempo y forma, el profesional puede requerir el pago a su cliente, luego de treinta (30) días corridos del incumplimiento y siempre que esté debidamente notificado.","e":"Título II — Disposiciones Particulares · Capítulo 4 — Pago de los Honorarios"},{"n":97,"t":"Recibo de pago","x":"Todo recibo que se extienda por el pago de honorarios, con imputación precisa del asunto, de fecha anterior a la conclusión de la gestión profesional, se considera como pago a cuenta.\n\n Sección 1°  Convenio de Honorarios","e":"Título II — Disposiciones Particulares · Capítulo 4 — Pago de los Honorarios"},{"n":98,"t":"Facultad de convenir","x":"Los abogados y procuradores pueden convenir con sus clientes el monto de sus honorarios en todo tipo de casos, encontrando como límite sólo el orden público y la buena fe contractual.\nEl convenio puede contener cláusulas que fijen al cliente la obligación de abonar sumas de dinero o bien someter el importe adeudado al éxito o pérdida por la labor profesional desarrollada.\nEn el caso de ganar el pleito, se puede pactar un porcentaje de la ganancia independientemente de lo que le regulen al condenado en costas.\nEn el caso de perder el pleito, puede pactar cobrar a su cliente lo que se le regule como condenado en costas o cuando son costas por su orden.\nEn caso de perder técnicamente el pleito, pero habiendo logrado disminuir sustancialmente el monto reclamado al cliente en la demanda, puede pactar un porcentaje sobre esa suma.\nTambién entre cliente y abogado, pueden celebrar libremente convenios de honorarios exclusivamente para determinar las retribuciones de aquellas tareas de asesoramiento profesional administrativo o extrajudicial, en cuyo caso las pautas establecidas en la presente Ley se aplican de modo supletorio.","e":"Título II — Disposiciones Particulares · Capítulo 5 — Convenio y Pacto de Cuota Litis"},{"n":99,"t":"Forma del convenio","x":"El convenio se debe celebrar por escrito, en tantos originales como partes intervengan.","e":"Título II — Disposiciones Particulares · Capítulo 5 — Convenio y Pacto de Cuota Litis"},{"n":100,"t":"Prueba del convenio","x":"El convenio sobre honorarios solo puede probarse con la exhibición del propio documento o por el reconocimiento de la parte obligada al pago de los honorarios.","e":"Título II — Disposiciones Particulares · Capítulo 5 — Convenio y Pacto de Cuota Litis"},{"n":101,"t":"Partes del convenio","x":"Esta Ley solo se aplica al convenio de honorarios celebrado por un abogado o procurador inscripto en el Foro de Abogados de la Provincia de San Juan.","e":"Título II — Disposiciones Particulares · Capítulo 5 — Convenio y Pacto de Cuota Litis"},{"n":102,"t":"Efectos entre partes","x":"El convenio de honorarios tiene efecto solo entre partes y los derechos se transmiten a los derecho-habientes.","e":"Título II — Disposiciones Particulares · Capítulo 5 — Convenio y Pacto de Cuota Litis"},{"n":103,"t":"Condena a la contraparte","x":"El convenio no puede afectar el derecho a los honorarios que corresponden, cuando la condena en costas, total o parcial, recae en la parte contraria.","e":"Título II — Disposiciones Particulares · Capítulo 5 — Convenio y Pacto de Cuota Litis"},{"n":104,"t":"Revocación de poder o patrocinio","x":"La revocación del poder o patrocinio no anula el convenio de honorarios, salvo que aquella haya sido motivada en la culpa del abogado o procurador.\nEn este último supuesto el abogado o procurador conserva el derecho a los honorarios que se regulen judicialmente.","e":"Título II — Disposiciones Particulares · Capítulo 5 — Convenio y Pacto de Cuota Litis"},{"n":105,"t":"Renuncia en la actuación","x":"El profesional que renuncia al patrocinio o a la representación en cualquier momento del procedimiento, una vez iniciado, solo tiene derecho a los honorarios que se regulen judicialmente, teniendo en cuenta las etapas cumplidas conforme al monto del convenio de honorarios suscripto oportunamente.","e":"Título II — Disposiciones Particulares · Capítulo 5 — Convenio y Pacto de Cuota Litis"},{"n":106,"t":"Prohibición al convenio","x":"Es nulo el convenio, cuando:\n\n1) El valor de los honorarios se condicione al tiempo que dura el juicio.\n2) No sea celebrado por abogados o procuradores.\n3) Verse sobre participación de honorarios entre un abogado o procurador  matriculado y otra persona que carezca de dicho título.","e":"Título II — Disposiciones Particulares · Capítulo 5 — Convenio y Pacto de Cuota Litis"},{"n":107,"t":"Celebración y presentación","x":"Los abogados pueden celebrar, con sus clientes, pacto de cuota Litis.\nEl pacto de cuota litis se puede celebrar antes o durante el proceso. Se puede presentar para ser ratificado judicialmente, por el profesional o el cliente.\nNo es necesario presentarlo para ratificación judicial en el fuero laboral.","e":"Título II — Disposiciones Particulares · Capítulo 5 — Convenio y Pacto de Cuota Litis · Sección 2 — Pacto de Cuota Litis"},{"n":108,"t":"Requisitos del pacto","x":"El pacto debe observar las siguientes reglas:\n\n1) Se debe redactar en tantos ejemplares como partes lo suscriban.\n2) No puede exceder del veinticinco por ciento (25 %) del resultado del pleito,  cualquiera fuese el número de pactos celebrados e independientemente del  número de profesionales intervinientes.\n 3) En los asuntos previsionales, de alimentos y con la intervención de menores  que actuaren con representante legal, no puede exceder el veinte por ciento  (20%) del monto resultante de multiplicar la cuota por dos (2) años.","e":"Título II — Disposiciones Particulares · Capítulo 5 — Convenio y Pacto de Cuota Litis · Sección 2 — Pacto de Cuota Litis"},{"n":109,"t":"Exclusión de honorarios","x":"Los honorarios que declarados a cargo de la parte contraria corresponden exclusivamente a los profesionales, sin perjuicio de lo acordado con el cliente.","e":"Título II — Disposiciones Particulares · Capítulo 5 — Convenio y Pacto de Cuota Litis · Sección 2 — Pacto de Cuota Litis"},{"n":110,"t":"Inventariador, valuador y partidor","x":"Los honorarios del perito inventariador y valuador se regulan entre el uno y tres por ciento (1 y 3%) sobre el total del avalúo, teniendo en cuenta los planos que hubiere tenido que levantar.\nLos honorarios del perito partidor se fija sobre el valor del haber a dividirse entre el uno y medio y el tres por ciento (1,5 al 3 %).","e":"Título II — Disposiciones Particulares · Capítulo 6 — Participación de Peritos"},{"n":111,"t":"Auxiliares de la justicia","x":"Los honorarios de los interventores, peritos y otros funcionarios judiciales cuya regulación no se encuentre prevista expresamente en este capítulo, deben ser fijados por el juez, teniendo en cuenta las reglas establecidas por los artículos 83 y 27, y las leyes especiales en lo pertinente, debiendo guardar la regulación una adecuada proporción con la practicada a los demás profesionales intervinientes, según el trabajo realizado.","e":"Título II — Disposiciones Particulares · Capítulo 6 — Participación de Peritos"},{"n":112,"t":"Aplicación","x":"Esta Ley se aplica a todos los procesos en curso, en los que no haya regulación firme de honorarios, al tiempo de su publicación.","e":"Título III — Disposiciones Finales"},{"n":113,"t":"Lenguaje inclusivo","x":"A los efectos de la presente Ley, los términos que se refieren a la individualización de personas han de ser entendidos y aplicados con perspectiva de género.","e":"Título III — Disposiciones Finales"},{"n":114,"t":"","x":"Objeto Cumplido.","e":"Título III — Disposiciones Finales"},{"n":115,"t":"","x":"Comuníquese al Poder Ejecutivo.","e":"Título III — Disposiciones Finales"}];

/* lista de juzgados (para el selector con filtro al cargar una causa) */
const JUZGADOS_LISTA = [...new Set(JUZ_DIR.map(x=>x.juz))].sort((a,b)=>a.localeCompare(b,"es"));
const _njz = s => String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]/g,"");
/* busca el juzgado de una causa en el directorio (primero exacto, después por inclusión) */
function juzgadoDir(c){
  const hay=[_njz(c.car),_njz(c.carLarga)].filter(Boolean); if(!hay.length) return "";
  let e=JUZ_DIR.find(x=>{ const B=_njz(x.car); return B&&hay.includes(B); });
  if(!e) e=JUZ_DIR.find(x=>{ const B=_njz(x.car); return B&&B.length>=10&&hay.some(h=>h.includes(B)||B.includes(h)); });
  if(!e){ const limpiar=s=>String(s||"").replace(/c\/\s*_+/gi," ").replace(/c\/\s*s\//gi," s/");
    const cs=_njz(sintetizar(limpiar(c.carLarga||c.car))); if(cs.length>=6)
    e=JUZ_DIR.find(x=>{ const B=_njz(sintetizar(limpiar(x.car))); return B&&B.length>=6&&(B===cs||B.includes(cs)||cs.includes(B)); }); }
  return e?e.juz:"";
}

/* ---------- persistencia local ---------- */
function guardarLocal(){
  try{ localStorage.setItem(LS, JSON.stringify(DB)); }
  catch(e){ toast("No se pudo guardar en este equipo: "+e.message,true); }
}
function cargarLocal(){
  try{
    const raw=localStorage.getItem(LS);
    if(!raw) return dbVacia();
    const d=JSON.parse(raw), base=dbVacia();
    COLS.forEach(c=>{ if(!d[c]) d[c]=base[c]; });
    d.cfg = Object.assign({}, base.cfg, d.cfg||{});
    if(!d.cfg.dbUrl) d.cfg.dbUrl = base.cfg.dbUrl;          /* si quedó vacía de una versión anterior */
    if(!d.cfg._tv2){ d.cfg.tema="claro"; d.cfg._tv2=1; }     /* una sola vez: pasar a fondo blanco */
    if(!d.cfg.raizEstudio) d.cfg.raizEstudio = base.cfg.raizEstudio;
    if(!d.valores||!d.valores.uma||!d.valores.uma.length) d.valores=base.valores;
    if(!d.socios||!Object.keys(d.socios).length) d.socios=base.socios;
    if(!d.lapidas) d.lapidas={};
    if(!d.ahorros) d.ahorros={};
    if(!d.liq) d.liq={};
    if(!d.caja) d.caja={};
    if(!d.costos) d.costos={};
    /* saldo de ahorro que estaba en la config → pasa a ser el primer depósito */
    if(d.cfg && Number(d.cfg.ahorroActual)>0 && !Object.keys(d.ahorros).length && !d.cfg._ahoMig){
      const aid="aho_ini"; d.ahorros[aid]={id:aid,fecha:hoy(),tipo:"dep",monto:Number(d.cfg.ahorroActual),obs:"Saldo inicial",_t:now()};
      d.cfg._ahoMig=1; d.cfg.ahorroActual=0;
    }
    /* socias nuevas: se agregan si no estaban y no fueron borradas a propósito */
    Object.values(base.socios).forEach(s=>{
      if(!d.socios[s.id] && !d.lapidas["socios/"+s.id]) d.socios[s.id]=Object.assign({_t:now(),_nuevo:1},s);
    });
    return d;
  }catch(e){ console.warn(e); return dbVacia(); }
}

/* graba un registro: marca tiempo, guarda local y empuja a la nube */
function put(col,obj){
  obj._t = now();
  if(!obj.id) obj.id = uid(col.slice(0,3));
  DB[col][obj.id]=obj;
  guardarLocal(); Nube.push(col,obj.id,obj);
  return obj;
}
function quitar(col,id){
  delete DB[col][id];
  DB.lapidas[col+"/"+id]=now();
  guardarLocal(); Nube.borrar(col,id);
}
const lista = col => Object.values(DB[col]||{});

/* ---------- respaldo en la nube (Firebase Realtime Database por REST) ---------- */
const Nube = {
  estado:"off", cola:[], reloj:null,
  url(p){
    const c=DB.cfg; if(!c.dbUrl) return null;
    let b=c.dbUrl.trim().replace(/\/+$/,"");
    if(!/^https?:\/\//.test(b)) b="https://"+b;
    const q = c.auth ? "?auth="+encodeURIComponent(c.auth.trim()) : "";
    return b+"/"+c.raiz.replace(/^\/+|\/+$/g,"")+"/"+p+".json"+q;
  },
  marca(e,txt){
    this.estado=e;
    const n=$("#syn"); if(!n) return;
    n.className="syn "+(e==="ok"?"ok":e==="err"?"err":e==="wait"?"wait":"");
    n.querySelector("span").textContent=txt||({ok:"Al día en la nube",err:"Sin conexión",wait:"Guardando…",off:"Sin configurar"}[e]);
  },
  async push(col,id,obj){
    const u=this.url(col+"/"+id); if(!u){ this.marca("off"); return; }
    this.marca("wait");
    try{
      const r=await fetch(u,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(obj)});
      if(!r.ok) throw new Error("HTTP "+r.status);
      this.marca("ok"); this.vaciarCola();
    }catch(e){
      this.cola.push({col,id,obj,borrar:false});
      localStorage.setItem("gfin_cola",JSON.stringify(this.cola));
      this.marca("err","Pendiente de subir ("+this.cola.length+")");
      this.arrancarReloj();
    }
  },
  async borrar(col,id){
    const u=this.url(col+"/"+id); if(!u) return;
    try{
      await fetch(u,{method:"DELETE"});
      const l=this.url("lapidas/"+col+"__"+id);
      if(l) await fetch(l,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(now())});
    }catch(e){
      this.cola.push({col,id,borrar:true});
      localStorage.setItem("gfin_cola",JSON.stringify(this.cola));
      this.arrancarReloj();
    }
  },
  arrancarReloj(){
    if(this.reloj) return;
    this.reloj=setInterval(()=>this.vaciarCola(),60000);
  },
  async vaciarCola(){
    if(!this.cola.length) return;
    const p=this.cola.slice(); this.cola=[];
    for(const it of p){
      try{
        const u=this.url(it.col+"/"+it.id); if(!u) throw new Error("sin url");
        if(it.borrar) await fetch(u,{method:"DELETE"});
        else await fetch(u,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(it.obj)});
      }catch(e){ this.cola.push(it); }
    }
    localStorage.setItem("gfin_cola",JSON.stringify(this.cola));
    if(!this.cola.length) this.marca("ok"); else this.marca("err","Pendiente de subir ("+this.cola.length+")");
  },
  /* trae todo y fusiona campo por registro: gana el más nuevo, nunca revive lo borrado */
  async bajarYFusionar(silencioso){
    const u=this.url(""); if(!u){ if(!silencioso) toast("Cargá primero la dirección de Firebase en Ajustes",true); return false; }
    this.marca("wait","Trayendo de la nube…");
    try{
      const r=await fetch(u.replace("//.json","/.json"),{cache:"no-store"});
      if(!r.ok) throw new Error("HTTP "+r.status);
      const rem=await r.json();
      if(!rem){ this.marca("ok","Nube vacía — se subirá lo local"); await this.subirTodo(); return true; }
      const lap=Object.assign({},DB.lapidas);
      Object.keys(rem.lapidas||{}).forEach(k=>{ const kk=k.replace("__","/"); lap[kk]=Math.max(lap[kk]||0, rem.lapidas[k]||0); });
      DB.lapidas=lap;
      COLS.forEach(col=>{
        if(col==="valores"||col==="cfg"){
          const a=DB[col], b=rem[col];
          if(b && (b._t||0) > (a._t||0)) DB[col]=Object.assign({},a,b);
          return;
        }
        const R=rem[col]||{};
        Object.keys(R).forEach(id=>{
          const muerto = lap[col+"/"+id] && lap[col+"/"+id] > (R[id]._t||0);
          if(muerto){ return; }
          const mio=DB[col][id];
          if(!mio || (R[id]._t||0) > (mio._t||0)) DB[col][id]=R[id];
        });
        Object.keys(DB[col]).forEach(id=>{ if(lap[col+"/"+id] && lap[col+"/"+id] > (DB[col][id]._t||0)) delete DB[col][id]; });
      });
      guardarLocal(); this.marca("ok");
      if(!silencioso) toast("Datos sincronizados con la nube");
      return true;
    }catch(e){ this.marca("err","No se pudo conectar"); if(!silencioso) toast("Error de conexión: "+e.message,true); return false; }
  },
  async subirTodo(){
    const u=this.url(""); if(!u){ toast("Falta la dirección de Firebase",true); return false; }
    this.marca("wait","Subiendo todo…");
    try{
      for(const col of COLS){
        const c=this.url(col);
        const r=await fetch(c,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(DB[col])});
        if(!r.ok) throw new Error("HTTP "+r.status+" en "+col);
      }
      const lp={}; Object.keys(DB.lapidas).forEach(k=>lp[k.replace("/","__")]=DB.lapidas[k]);
      await fetch(this.url("lapidas"),{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(lp)});
      this.marca("ok"); toast("Todo subido a la nube"); return true;
    }catch(e){ this.marca("err"); toast("No se pudo subir: "+e.message,true); return false; }
  },
  async copiaDelDia(){
    const c=DB.cfg; if(!c.dbUrl) return;
    const f=hoy();
    if(localStorage.getItem("gfin_copia")===f) return;
    try{
      let b=c.dbUrl.trim().replace(/\/+$/,""); if(!/^https?:\/\//.test(b)) b="https://"+b;
      const q=c.auth?"?auth="+encodeURIComponent(c.auth.trim()):"";
      const u=b+"/"+c.raiz.replace(/^\/+|\/+$/g,"")+"_copias/"+f+".json"+q;
      const r=await fetch(u,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(DB)});
      if(r.ok) localStorage.setItem("gfin_copia",f);
    }catch(e){}
  }
};

/* valor de UMA / UF / UP vigente a una fecha */
function valorVigente(tipo,fecha){
  const arr=(DB.valores[tipo]||[]).slice().sort((a,b)=>a.f<b.f?-1:1);
  if(!arr.length) return 0;
  const f=fecha||hoy();
  let v=0; for(const it of arr){ if(it.f<=f) v=it.v; else break; }
  return v || arr[0].v;
}
const umaHoy = () => valorVigente("uma",hoy());
function ultimoValor(tipo){
  const arr=(DB.valores[tipo]||[]).slice().sort((a,b)=>a.f<b.f?-1:1);
  return arr.length?arr[arr.length-1]:null;
}

/* monto de un gasto: si va en unidades, cantidad × valor vigente a la fecha */
function montoGasto(g){
  if(g.manual) return Number(g.monto)||0;
  const r=RUBROS.find(x=>x.id===g.rubro);
  if(!r||r.un==="$") return Number(g.monto)||0;
  const tipo = r.un==="UF"?"uf":r.un==="UP"?"up":"uma";
  const v=valorVigente(tipo,g.fecha);
  return v ? (Number(g.cant)||0)*v : (Number(g.monto)||0);
}
