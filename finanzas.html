  simSet(manual){
    const s=this.sim;
    s.base=parseNum(val("si_base")); s.pReg=parseNum(val("si_preg")); s.pCl=parseNum(val("si_pcl"));
    s.pSoc=parseNum(val("si_psoc")); s.socio=val("si_soc"); s.gastos=parseNum(val("si_gas")); s.pagador=val("si_pag");
    s.socios=[...document.querySelectorAll("#si_socios .chip.on")].map(b=>b.dataset.s);
    if(manual){ s.manual=true; s.hReg=parseNum(val("si_hreg")); s.hCl=parseNum(val("si_hcl")); }
    else { s.manual=false; s.hReg=s.base*s.pReg/100; s.hCl=s.base*s.pCl/100; }
    clearTimeout(this._sim); this._sim=setTimeout(()=>{
      const foco=document.activeElement?document.activeElement.id:null;
      this.render();
      if(foco){ const e=document.getElementById(foco); if(e){ e.focus(); if(e.setSelectionRange&&e.type!=="date") try{e.setSelectionRange(e.value.length,e.value.length)}catch(x){} } }
    },260);
  },
  simCalc(){
    const s=this.sim, cfg=DB.cfg;
    const hReg=s.hReg||0, hCl=s.hCl||0, bruto=hReg+hCl;
    let socio=null, totRet=0, retDet=[];
    if(s.socio && DB.socios[s.socio]){
      const so=DB.socios[s.socio];
      const hon=hReg*(s.pSoc||0)/100;
      const r=calcRetenciones(so,hon);
      socio={nombre:so.corto, honorario:hon, filas:r.filas, neto:r.neto, dif:r.dif};
      if(Math.abs(r.dif)>0.005){ totRet=-r.dif; retDet=[{socio:s.socio,fecha:hoy(),honorario:hon,neto:r.neto,dif:r.dif}]; }
    }
    const baseInf = cfg.baseInformante==="post" ? bruto-totRet : bruto;
    const informante = baseInf*(cfg.porcInformante||0)/100;
    const socios = s.socios.length? s.socios : ["s_jp"];
    const porSocioGasto = s.gastos? {[s.pagador]:s.gastos} : {};
    const neto = bruto - totRet - informante - (s.gastos||0);
    const parte = neto/socios.length;
    const porSocio = socios.map(id=>({id,nombre:nombreSocio(id),color:colorSocio(id),porc:100/socios.length,parte,gastos:porSocioGasto[id]||0,total:parte+(porSocioGasto[id]||0)}));
    Object.keys(porSocioGasto).forEach(id=>{ if(!socios.includes(id)) porSocio.push({id,nombre:nombreSocio(id),color:colorSocio(id),porc:0,parte:0,gastos:porSocioGasto[id],total:porSocioGasto[id]}); });
    const L={causa:{}, esArt:true, totReg:hReg, totCl:hCl, totOtr:0, bruto, retDet, totRet, porcInf:cfg.porcInformante, baseInf, informante,
      porSocioGasto, totGastos:s.gastos||0, neto, parte, socios, porSocio, netoSocios:{}};
    return {L, socio, hReg, hCl};
  },

  /* ======================= CALCULAR HONORARIOS ======================= */
  hon:{sub:"monto", monto:0, interv:"con", esquema:"ord", etapas:[0,1,2], rol:"apo", piso:true, vencida:false, q:"", ql:"", art:null, liq:0},
  v_honorarios(){

  v_estudioViejo(){ return this.panelMovs("est"); },
  v_personal(){ return this.panelMovs("per"); },
  v_ingresos(){ return this.panelMovs("ing"); },
  panelMovs(kind){
    const esIng = kind==="ing";
    const filt = m => esIng ? m.tipo==="ing" : (m.tipo==="gas" && m.ambito===kind);
    const cfg = {
      est:{tit:"Costos fijos del estudio", em:"🏢", color:"var(--amber)", verbo:"Gasto", neg:true, kpi:"Costos del mes"},
      per:{tit:"Gastos personales", em:"🏠", color:"var(--rose)",  verbo:"Gasto", neg:true, kpi:"Gastos del mes"},
      ing:{tit:"Ingresos fijos",    em:"🎓", color:"var(--acc)",   verbo:"Ingreso", neg:false, kpi:"Ingresos del mes"}
    }[kind];
    const todos = lista("movs").filter(filt);
    const mv = todos.filter(x=>mesDe(x.fecha)===this.mes).sort((a,b)=>a.fecha<b.fecha?1:-1);
    const totMes = mv.reduce((t,x)=>t+(Number(x.monto)||0),0);
    /* año en curso */
    const anio = this.mes.slice(0,4);
    const delAnio = todos.filter(x=>(x.fecha||"").slice(0,4)===anio);
    const totAnio = delAnio.reduce((t,x)=>t+(Number(x.monto)||0),0);
    const mesesAnio = new Set(delAnio.map(x=>mesDe(x.fecha))).size||1;
    /* categorías del mes */
    const cats={}; mv.forEach(x=>cats[x.cat||"Otros"]=(cats[x.cat||"Otros"]||0)+(Number(x.monto)||0));
    const ord=Object.entries(cats).sort((a,b)=>b[1]-a[1]);
    const maxC=Math.max(1,...ord.map(x=>x[1]));
    /* barras 8 meses de este cajón */
    const ms=ultimosMeses(8,this.mes).map(m=>{
      const v=todos.filter(x=>mesDe(x.fecha)===m).reduce((t,x)=>t+(Number(x.monto)||0),0);
      return {lb:m.slice(5)+"/"+m.slice(2,4), a:v};});
    return `
    <div style="display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:14px">
      ${this.selMes("mesMov","App.mes=this.value;App.render()")}
      <div style="flex:1"></div>
      <button class="btn sm pri" onclick="App.fMov(null,'${kind}')">＋ ${cfg.verbo}</button>
    </div>
    <div class="grid g3" style="margin-bottom:14px">
      ${this.kpi(cfg.kpi,pes0(totMes),fMesC(this.mes),cfg.color)}
      ${this.kpi("Promedio mensual "+anio,pes0(totAnio/mesesAnio),"sobre "+mesesAnio+" mes"+(mesesAnio>1?"es":"")+" con datos",cfg.color)}
      ${this.kpi("Acumulado "+anio,pes0(totAnio),delAnio.length+" movimientos","var(--tx2)")}
    </div>
    <div class="grid g2" style="margin-bottom:14px;align-items:start">
      <div class="card"><div class="hd"><h3>Composición por rubro · ${fMes(this.mes)}</h3></div><div class="bd tight">
        ${ord.length? `<div class="tblwrap"><table class="pl">
          <thead><tr><th>Rubro</th><th class="num" style="width:130px">Importe</th><th class="num" style="width:150px">Participación${hint("participacion")}</th></tr></thead>
          <tbody>${ord.map(([c,m])=>`<tr><td>${esc(c)}</td>
            <td class="num">${pes0(m)}</td>
            <td class="num">${pct1(share(m,totMes))}
              <div class="mini"><i style="width:${share(m,totMes).toFixed(0)}%;background:${cfg.color}"></i></div></td></tr>`).join("")}
          </tbody>
          <tfoot><tr class="tot"><td><b>Total ${cfg.verbo==="Gasto"?"costos":"ingresos"}</b></td><td class="num"><b>${pes0(totMes)}</b></td><td class="num"><b>100 %</b></td></tr></tfoot>
          </table></div>`
        :'<div class="vacio small">Nada cargado en el mes</div>'}
      </div></div>
      <div class="card"><div class="hd"><h3>Últimos 8 meses</h3></div><div class="bd">
        ${this.barras(ms.map(x=>({lb:x.lb,a:x.a})),140)}</div></div>
    </div>
    <div class="card"><div class="hd"><h3>${cfg.verbo==="Gasto"?"Gastos":"Ingresos"} del mes</h3><div class="sp"></div>
      <span class="tag" style="background:${cfg.color}22;color:${cfg.color}">${pes0(totMes)}</span></div>
      <div class="bd tight">${mv.length?`<div class="tblwrap"><table class="tbl">
      <thead><tr><th>Fecha</th><th>Detalle</th><th>Categoría</th><th>Medio</th><th class="num">Importe</th><th></th></tr></thead>
      <tbody>${mv.map(x=>`<tr><td class="small">${fFec(x.fecha)}</td>
        <td>${esc(x.obs||x.cat||"—")}</td>
        <td class="small">${esc(x.cat||"—")}</td>
        <td class="small muted">${esc(x.medio||"")}</td>
        <td class="num ${cfg.neg?"neg":"pos"}">${cfg.neg?"− ":"+ "}${pes(x.monto)}</td>
        <td style="width:56px"><button class="btn sm gh" onclick="App.fMov('${x.id}')">✎</button></td></tr>`).join("")}
      </tbody></table></div>`:'<div class="vacio"><span class="em">'+cfg.em+'</span>Sin '+(cfg.verbo==="Gasto"?"gastos":"ingresos")+' en '+fMes(this.mes)+'</div>'}</div></div>`;
  },

  /* ======================= AHORROS ======================= */
  saldoAhorro(){ return lista("ahorros").reduce((t,x)=>t+(x.tipo==="ret"?-1:1)*(Number(x.monto)||0),0); },
  v_ahorros(){
    const mov=lista("ahorros").sort((a,b)=>a.fecha<b.fecha?1:-1);
    const saldo=this.saldoAhorro();
    const meta=Number(DB.cfg.ahorroMeta)||0;
    const dep=lista("ahorros").filter(x=>x.tipo!=="ret").reduce((t,x)=>t+(Number(x.monto)||0),0);
    const ret=lista("ahorros").filter(x=>x.tipo==="ret").reduce((t,x)=>t+(Number(x.monto)||0),0);
    /* saldo acumulado por fila (de la más vieja a la más nueva) */
    const cron=lista("ahorros").slice().sort((a,b)=>a.fecha<b.fecha?-1:1);
    const run={}; let acc=0; cron.forEach(x=>{acc+=(x.tipo==="ret"?-1:1)*(Number(x.monto)||0); run[x.id]=acc;});
    const pc=meta?Math.min(100,saldo/meta*100):0;
    return `
    <div style="display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:14px">

      <button class="btn sm" onclick="App.fAhorro()">🎯 Meta</button>

      <button class="btn sm pri" onclick="App.fAhorroMov(null,'dep')">＋ Depósito</button>
    </div>
    <div class="grid g3" style="margin-bottom:14px">
      ${this.kpi("Ahorro acumulado",pes0(saldo),"lo que tenés guardado hoy","var(--acc)","🐷")}
      ${this.kpi("Total depositado",pes0(dep),ret?"menos "+pes0(ret)+" de retiros":"sin retiros","var(--blue)")}
      ${this.kpi("Meta",meta?pes0(meta):"sin definir",meta?NF4.format(pc)+" % alcanzado":"tocá «Meta» para ponerla","var(--viol)")}
    </div>
    ${meta?`<div class="card" style="margin-bottom:14px"><div class="hd"><h3>Progreso hacia la meta</h3><div class="sp"></div>
      <button class="btn sm gh" onclick="App.fAhorro()">✎</button></div><div class="bd">
      <div style="display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:6px"><span><b>${pes0(saldo)}</b> de ${pes0(meta)}</span><b>${NF4.format(pc)} %</b></div>
      <div class="prog" style="height:12px"><i style="width:${pc.toFixed(1)}%"></i></div>
      ${saldo<meta?'<div class="small muted" style="margin-top:8px">Te faltan '+pes0(meta-saldo)+' para llegar.</div>':'<div class="small" style="margin-top:8px;color:var(--acc)">¡Llegaste a la meta! 🎉</div>'}
      ${DB.cfg.ahorroNota?'<div class="small muted" style="margin-top:6px">'+esc(DB.cfg.ahorroNota)+'</div>':""}</div></div>`:""}
    <div class="card"><div class="hd"><h3>Movimientos de ahorro</h3><div class="sp"></div><span class="tag">${mov.length}</span></div>
      <div class="bd tight">${mov.length?`<div class="tblwrap"><table class="tbl">
      <thead><tr><th>Fecha</th><th>Detalle</th><th class="num">Depósito</th><th class="num">Retiro</th><th class="num">Saldo</th><th></th></tr></thead>
      <tbody>${mov.map(x=>`<tr><td class="small">${fFec(x.fecha)}</td>
        <td>${esc(x.obs||(x.tipo==="ret"?"Retiro":"Depósito"))}</td>
        <td class="num pos">${x.tipo!=="ret"?"+ "+pes(x.monto):"—"}</td>
        <td class="num neg">${x.tipo==="ret"?"− "+pes(x.monto):"—"}</td>
        <td class="num"><b>${pes(run[x.id]||0)}</b></td>
        <td style="width:56px"><button class="btn sm gh" onclick="App.fAhorroMov('${x.id}')">✎</button></td></tr>`).join("")}
      </tbody></table></div>`:'<div class="vacio"><span class="em">🐷</span>Todavía no registraste ahorros.<br><br><button class="btn pri" onclick="App.fAhorroMov(null,\'dep\')">Cargar el primer depósito</button></div>'}</div></div>`;
  },
  fAhorroMov(id,tipo){
    const m = id? DB.ahorros[id] : {id:"",fecha:hoy(),tipo:tipo||"dep",monto:"",obs:""};
    const esRet=(id?m.tipo:tipo)==="ret";
    this.modal({t:(id?"Editar ":"")+(esRet?"Retiro de ahorro":"Depósito a ahorro"), b:`
      <div class="frow c2">
        <label class="f"><span>Fecha</span><input class="inp" type="date" id="fa_fec" value="${m.fecha}"></label>
        <label class="f"><span>Importe</span><input class="inp money" id="fa_mon" value="${m.monto?nf(m.monto):""}" placeholder="0,00"></label>
      </div>
      <label class="f"><span>Detalle</span><input class="inp" id="fa_obs" value="${esc(m.obs||"")}" placeholder="Opcional"></label>
      <input type="hidden" id="fa_tipo" value="${esRet?"ret":"dep"}">`,
      p:`${id?'<button class="btn dan" onclick="App.cerrar();App.confirmar(\'¿Borrar el movimiento?\',()=>{quitar(\'ahorros\',\''+id+'\');App.render();toast(\'Borrado\')})">Eliminar</button>':""}

         <button class="btn pri" onclick="App.gAhorroMov('${id||""}')">Guardar</button>`});
  },
  gAhorroMov(id){
    const monto=parseNum(val("fa_mon")); if(!monto) return toast("Falta el importe",true);
    const o = id? Object.assign({},DB.ahorros[id]) : {id:uid("aho")};
    Object.assign(o,{fecha:val("fa_fec"), tipo:val("fa_tipo")==="ret"?"ret":"dep", monto, obs:val("fa_obs").trim()});
    put("ahorros",o); this.cerrar(); toast("Guardado"); this.render();
  },

  gReparto(id){
    const monto=parseNum(val("fr_mon")); if(!monto) return toast("Falta el monto",true);
    let causaId=val("fr_cau"), causaNom="";
    if(causaId==="__nueva"){
      const nom=(val("fr_caunom")||"").trim(); if(!nom) return toast("Escribí el nombre de la causa",true);
      causaId=uid("cau"); causaNom=nom;
      put("causas",{id:causaId,car:nom,carLarga:nom,corto:nom,cliente:"",extra:true,estado:"abierta",socios:["s_jp"],reparto:{s_jp:100}});
    } else if(causaId===""){ causaNom=""; }
    const soc=[...document.querySelectorAll("#fr_soc .chip.on")].map(b=>b.dataset.s);
    if(!soc.length) return toast("Elegí entre quiénes se divide",true);
    const rid=id||uid("liq");
    /* revertir gastos que este reparto tenía marcados (por si es edición) */
    lista("gastos").forEach(g=>{ if(g.reparto===rid){ const o=Object.assign({},g); delete o.devuelto; delete o.reparto; put("gastos",o); } });
    const infON = document.getElementById("fr_infON") ? chk("fr_infON") : true;
    const o = id? Object.assign({},DB.liq[id]) : {id:rid};
    Object.assign(o,{fecha:val("fr_fec"), causaId, causaNom:causaNom||o.causaNom||"", concepto:val("fr_con"),
      monto, enPoder:val("fr_pod"), informantePct: infON?parseNum(val("fr_inf")):0, sinInformante:!infON, socios:soc, soloYo:(soc.length===1&&soc[0]==="s_jp")});
    const c=calcReparto(o);
    put("liq",o);
    c.gs.forEach(g=>{ const gg=Object.assign({},DB.gastos[g.id],{devuelto:true,reparto:rid}); put("gastos",gg); });
    const cajaId="cajarep_"+rid;
    if(c.miTotal>0) put("caja",{id:cajaId,fecha:o.fecha,concepto:"Reparto: "+nombreReparto(o),monto:c.miTotal,signo:1,origen:"reparto",repartoId:rid});
    else if(DB.caja[cajaId]) quitar("caja",cajaId);
    this.cerrar(); toast("Liquidación guardada · tu parte fue a la caja"); this.render();
  },
  borrarReparto(id){
    lista("gastos").forEach(g=>{ if(g.reparto===id){ const o=Object.assign({},g); delete o.devuelto; delete o.reparto; put("gastos",o); } });
    if(DB.caja["cajarep_"+id]) quitar("caja","cajarep_"+id);
    quitar("liq",id); this.render(); toast("Liquidación borrada");
  },

  /* ---- resumen contable completo, multi-hoja, para subir a una IA ---- */
  resumenGeneralXls(){
    const R=Math.round, esc2=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    const cel=v=>{ if(typeof v==="number"&&isFinite(v)) return '<Cell><Data ss:Type="Number">'+v+'</Data></Cell>';
      return '<Cell><Data ss:Type="String">'+esc2(v)+'</Data></Cell>'; };
    const row=arr=>'<Row>'+arr.map(cel).join("")+'</Row>';
    const hoja=(nombre,filas)=>'<Worksheet ss:Name="'+esc2(String(nombre).slice(0,31).replace(/[\\/?*\[\]:]/g,""))+'"><Table>'+filas.map(row).join("")+'</Table></Worksheet>';
    const meses=mesesConDatos().slice().sort();

    /* 1 · Resumen mensual */
    const shResumen=[["Mes","Facturación","Costos por causa","Costos fijos","Costos operativos","Resultado del estudio","Margen %","Mi retiro","Otros ingresos","Gastos personales","Resultado personal"]];
    const T={f:0,cc:0,cf:0,co:0,re:0,mi:0,oi:0,gp:0,rp:0};
    meses.forEach(m=>{ const x=resumenMes(m);
      shResumen.push([fMesC(m),R(x.facturacion),R(x.costosCausas),R(x.costosFijos),R(x.costosOp),R(x.resultadoEstudio),
        x.facturacion?+NF1.format(x.margen).replace(",","."):0,R(x.mio),R(x.otrosIng),R(x.gPer),R(x.resultado)]);
      T.f+=x.facturacion;T.cc+=x.costosCausas;T.cf+=x.costosFijos;T.co+=x.costosOp;T.re+=x.resultadoEstudio;T.mi+=x.mio;T.oi+=x.otrosIng;T.gp+=x.gPer;T.rp+=x.resultado; });
    shResumen.push(["TOTAL",R(T.f),R(T.cc),R(T.cf),R(T.co),R(T.re),T.f?+((T.re/T.f*100).toFixed(1)):0,R(T.mi),R(T.oi),R(T.gp),R(T.rp)]);

    /* 2 · Liquidaciones (detalle de cada reparto) */
    const shLiq=[["Fecha","Causa","Tipo de carga","Monto que entró","Informante","Gastos reintegrados","Neto repartido","Mi parte","Reparto por socio"]];
    lista("liq").sort((a,b)=>a.fecha<b.fecha?-1:1).forEach(r=>{ const c=calcReparto(r);
      shLiq.push([r.fecha||"", nombreReparto(r), r.manualSplit?"Simplificada":"Completa", R(c.monto), R(c.informante), R(c.gTot), R(c.neto), R(c.miTotal),
        c.porSocio.map(s=>nombreSocio(s.id)+": "+nf0(s.total)).join(" | ")]); });
    if(shLiq.length===1) shLiq.push(["(sin liquidaciones cargadas)","","","","","","","",""]);

    /* 3 · Costos fijos del estudio (pagado / pendiente) */
    const shCostos=[["Mes","Concepto","Importe","Estado","Fecha de pago"]];
    lista("costos").sort((a,b)=>(a.mes+a.cat)<(b.mes+b.cat)?-1:1).forEach(x=>{
      shCostos.push([x.mes||"", x.cat||"", R(x.monto), x.pagado?"Pagado":"Pendiente", x.fechaPago||""]); });
    if(shCostos.length===1) shCostos.push(["(sin costos cargados)","","","",""]);

    /* 4 · Causas (cartera) */
    const shCausas=[["Carátula","Cliente","Juzgado","Fuero","ART","Estado","Cobrado","Gastos puestos","Falta cobrar","Mi parte"]];
    lista("causas").sort((a,b)=>nombreCausa(a).localeCompare(nombreCausa(b),"es")).forEach(c=>{
      const L=liquidar(c.id), esp=c.montoProsperado?(calcReclamo(c).cuotaLitis+calcReclamo(c).honReg):0;
      const est=(ESTADOS.find(e=>e.id===estadoDe(c))||{nom:""}).nom;
      shCausas.push([nombreCausa(c), c.cliente||"", c.juzgado||(c.extra?"Extrajudicial":""), c.fuero||"", esArtCausa(c)?"Sí":"No", est,
        R(L.bruto), R(L.totGastos), esp?R(Math.max(0,esp-L.bruto)):0, R((L.porSocio.find(s=>s.id==="s_jp")||{total:0}).total)]); });

    /* 5 · Mi caja */
    const shCaja=[["Fecha","Concepto","Entra","Sale","Origen"]];
    lista("caja").sort((a,b)=>a.fecha<b.fecha?-1:1).forEach(x=>{
      shCaja.push([x.fecha||"", x.concepto||"", x.signo!==-1?R(x.monto):0, x.signo===-1?R(x.monto):0, x.origen==="reparto"?"Reparto":"Manual"]); });
    shCaja.push(["","SALDO", R(lista("caja").filter(x=>x.signo!==-1).reduce((t,x)=>t+(+x.monto||0),0)), R(lista("caja").filter(x=>x.signo===-1).reduce((t,x)=>t+(+x.monto||0),0)), ""]);

    /* 6 · Indicadores de gestión + prompt para la IA */
    const nM=meses.length||1;
    const promFact=T.f/nM, promRes=T.re/nM, promCF=T.cf/nM, margenProm=T.f?T.re/T.f*100:0;
    const pctCostos=T.f?(T.cc+T.cf)/T.f*100:0;
    const breakeven = margenProm>0 ? promCF/(margenProm/100) : 0;
    let mejor="",peor="",maxF=-1,minF=Infinity;
    meses.forEach(m=>{const x=resumenMes(m); if(x.facturacion>maxF){maxF=x.facturacion;mejor=fMesC(m);} if(x.facturacion<minF){minF=x.facturacion;peor=fMesC(m);}});
    const carteraAbierta=lista("causas").filter(c=>estadoDe(c)==="abierta").length;
    const shInd=[
      ["Indicador","Valor"],
      ["Meses con datos",nM],
      ["Facturación total del período",R(T.f)],
      ["Facturación promedio mensual",R(promFact)],
      ["Resultado del estudio acumulado",R(T.re)],
      ["Resultado promedio mensual",R(promRes)],
      ["Margen operativo promedio (%)",+margenProm.toFixed(1)],
      ["Costos fijos promedio mensual",R(promCF)],
      ["Costos totales sobre facturación (%)",+pctCostos.toFixed(1)],
      ["Punto de equilibrio mensual estimado (facturación)",R(breakeven)],
      ["Mi retiro acumulado",R(T.mi)],
      ["Mes de mayor facturación",mejor+" ("+nf0(maxF)+")"],
      ["Mes de menor facturación",peor+" ("+nf0(minF)+")"],
      ["Causas por cobrar (cartera)",carteraAbierta],
      ["",""],
      ["NOTA","Montos en pesos argentinos, sin decimales. Cortes contables por mes calendario (1 al último día)."],
      ["PROMPT SUGERIDO PARA LA IA","Actuá como experto en administración de estudios jurídicos. Analizá estas planillas (resumen mensual, liquidaciones, costos fijos, causas, caja e indicadores) y decime: evolución y tendencia de la facturación y la rentabilidad, estructura y control de costos, meses fuertes y débiles, punto de equilibrio, salud de la cartera por cobrar, y 5 recomendaciones concretas y priorizadas para mejorar el resultado del estudio."]
    ];

    return '<?xml version="1.0"?>\n<?mso-application progid="Excel.Sheet"?>\n'+
      '<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">'+
      hoja("Resumen mensual",shResumen)+hoja("Liquidaciones",shLiq)+hoja("Costos fijos",shCostos)+
      hoja("Causas",shCausas)+hoja("Mi caja",shCaja)+hoja("Indicadores",shInd)+
      '</Workbook>';
  },
  bajarResumen(){
    const xml=this.resumenGeneralXls();
    const b=new Blob([xml],{type:"application/vnd.ms-excel"});
    const a=el("a"); a.href=URL.createObjectURL(b); a.download="resumen_estudio_"+hoy()+".xls"; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    toast("Resumen completo descargado (6 hojas)");
  },

    this.modal({t:id?"Editar ingreso mío":"Ingreso a mi bolsillo", b:`
      <div class="frow c2">
        <label class="f"><span>Fecha</span><input class="inp" type="date" id="fc_fec" value="${m.fecha}"></label>
        <label class="f"><span>Importe</span><input class="inp money" id="fc_mon" value="${m.monto?nf(m.monto):""}" placeholder="0,00"></label>

  /* ---- traer la tabla de UMA del Foro ---- */
  async revisarUma(){
    const FUENTE="https://www.fasj.org.ar/wp/ley-de-honorarios/";
    this.modal({t:"Revisando el valor de la UMA",b:'<div class="vacio"><span class="em">⏳</span>Buscando en la página del Foro…</div>'});
    const vias=[FUENTE,
      "https://r.jina.ai/"+FUENTE,
      "https://api.allorigins.win/raw?url="+encodeURIComponent(FUENTE)];
    let txt=null, err="";
    for(const u of vias){
      try{
        const c=new AbortController(); const t=setTimeout(()=>c.abort(),15000);
        const r=await fetch(u,{signal:c.signal}); clearTimeout(t);
        if(!r.ok) throw new Error("HTTP "+r.status);
        const s=await r.text();
        if(s && s.length>500){ txt=s; break; }
      }catch(e){ err=e.message||"bloqueado"; }
    }
    if(!txt) return this.modal({t:"No pude leerla desde acá",ancho:true,b:
      `<p style="margin-top:0">La página del Foro no deja que otra página lea su contenido (es una restricción del navegador, no un problema de tu conexión).</p>
       <p class="small muted">Abrí la tabla, copiá los renglones nuevos y pegalos acá abajo: yo saco las fechas y los importes.</p>
       <textarea class="inp" id="ru_t" style="min-height:120px;font-family:var(--fm);font-size:12.5px" placeholder="19/08/2026   77.072,51"></textarea>`,
      p:'<button class="btn" onclick="App.cerrar()">Cerrar</button>'+
        '<a class="btn" href="'+FUENTE+'" target="_blank" rel="noopener">Abrir la tabla ↗</a>'+
        '<button class="btn pri" onclick="App.leerValores(\'uma\',document.getElementById(\'ru_t\').value)">Leer lo pegado</button>'});
    this.leerValores("uma",txt,true);
  },
  pegarValores(){
    this.modal({t:"Pegar valores",ancho:true,b:`
      <label class="f"><span>Qué estás cargando</span><select class="inp" id="pv_t">
        <option value="uma">UMA</option><option value="uf">UF — unidad forense</option><option value="up">UP — unidad previsional</option></select></label>
      <label class="f"><span>Pegá o escribí fecha y valor</span>
        <textarea class="inp" id="pv_x" style="min-height:120px;font-family:var(--fm);font-size:12.5px" placeholder="19/08/2026   77.072,51&#10;22/06/2026   74.108,19"></textarea>
        <span style="text-transform:none;letter-spacing:0;font-weight:400;color:var(--tx3);font-size:12px;margin-top:5px;display:block">
          Un renglón por valor. Si pegás una tabla entera, saco todos los pares de fecha e importe que encuentre.</span></label>`,
      p:'<button class="btn" onclick="App.cerrar()">Cancelar</button><button class="btn pri" onclick="App.leerValores(val(\'pv_t\'),val(\'pv_x\'))">Leer</button>'});
  },
  leerValores(tipo,txt,esWeb){
    const limpio=String(txt||"").replace(/<[^>]+>/g," ").replace(/&nbsp;/g," ");
    const re=/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})[\s\S]{0,60}?\$?\s*([\d]{1,3}(?:\.\d{3})*,\d{2})/g;
    const enc=[]; let m;
    while((m=re.exec(limpio))){
      const f=m[3]+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0");
      const v=parseNum(m[4]);
      if(v>100 && !enc.find(x=>x.f===f)) enc.push({f,v});
    }
    if(!enc.length) return toast("No encontré ninguna fecha con su importe",true);
    const hay=(DB.valores[tipo]||[]);
    const nuevos=enc.filter(x=>!hay.find(y=>y.f===x.f && Math.abs(y.v-x.v)<0.01)).sort((a,b)=>a.f<b.f?1:-1);
    if(!nuevos.length) return this.modal({t:"Ya estaba todo",b:'<p>Encontré '+enc.length+' valores y ya los tenías cargados. El de '+tipo.toUpperCase()+' está al día.</p>',
      p:'<button class="btn pri" onclick="App.cerrar()">Listo</button>'});
    this._nv={tipo,nuevos};
    this.modal({t:"Valores nuevos de "+tipo.toUpperCase(),ancho:true,b:`
      <p class="small muted" style="margin-top:0">${esWeb?"Leí la tabla del Foro y encontré":"Encontré"} <b>${nuevos.length}</b> ${nuevos.length===1?"valor que no tenías":"valores que no tenías"}. Destildá los que no quieras.</p>
      <div id="nv_l" style="max-height:300px;overflow-y:auto;border:1px solid var(--line);border-radius:12px">
        ${nuevos.map((x,i)=>`<label style="display:flex;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer">
          <input type="checkbox" checked data-i="${i}">
          <span style="flex:1">rige desde el <b>${fFec(x.f)}</b></span>
          <span class="mono"><b>${pes(x.v)}</b></span></label>`).join("")}
      </div>`,
      p:'<button class="btn" onclick="App.cerrar()">Cancelar</button><button class="btn pri" onclick="App.guardarNuevos()">Guardar los tildados</button>'});
  },
  guardarNuevos(){
    const {tipo,nuevos}=this._nv;
    const sel=[...document.querySelectorAll("#nv_l input:checked")].map(i=>nuevos[+i.dataset.i]);
    let arr=(DB.valores[tipo]||[]).slice();
    sel.forEach(x=>{ arr=arr.filter(y=>y.f!==x.f); arr.push(x); });
    arr.sort((a,b)=>a.f<b.f?-1:1);
    DB.valores[tipo]=arr; guardarValores();
    this.cerrar(); this.render(); toast(sel.length+" valores de "+tipo.toUpperCase()+" guardados");
  },
  borrarValor(tipo,f){
    DB.valores[tipo]=(DB.valores[tipo]||[]).filter(x=>x.f!==f);
    guardarValores(); this.cerrar(); this.render(); toast("Valor eliminado");
  },

  },
  /* acepta la dirección sola, la línea del databaseURL, o todo el bloque firebaseConfig pegado */
  sacarUrl(txt){
    const t=String(txt||"").trim();
    if(!t) return "";
    let m=t.match(/databaseURL\s*[:=]\s*["'`]([^"'`]+)["'`]/i); if(m) return m[1].trim();
    m=t.match(/https?:\/\/[^\s"'`,)]*(?:firebaseio\.com|firebasedatabase\.app)[^\s"'`,)]*/i); if(m) return m[0].trim();
    m=t.match(/[A-Za-z0-9._-]+\.(?:firebaseio\.com|firebasedatabase\.app)/i); if(m) return "https://"+m[0].trim();
    return t.split(/\s+/)[0];
  },
  gNube(){
    const crudo=val("ax_url");
    DB.cfg.dbUrl=this.sacarUrl(crudo);
    if(!DB.cfg.dbUrl) return toast("No encontré ninguna dirección en lo que pegaste",true);
    const campo=document.getElementById("ax_url"); if(campo) campo.value=DB.cfg.dbUrl;
    if(crudo.trim()!==DB.cfg.dbUrl) toast("Saqué la dirección: "+DB.cfg.dbUrl);
    DB.cfg.raiz=val("ax_raiz").trim()||"estudiomendoza40/finanzas";
    DB.cfg.auth=val("ax_auth").trim(); DB.cfg.raizEstudio=(document.getElementById("ax_rest")||{value:DB.cfg.raizEstudio}).value.trim();
    guardarCfg();
    Nube.bajarYFusionar().then(ok=>{ if(ok){ Nube.copiaDelDia(); this.render(); } });
  },
  gReglas(){
    DB.cfg.porcInformante=parseNum(val("ax_inf")); DB.cfg.baseInformante=val("ax_binf");
    DB.cfg.porcReguladoDef=parseNum(val("ax_preg")); DB.cfg.porcCuotaLitisDef=parseNum(val("ax_pcl"));
    DB.cfg.porcEugeniaDef=parseNum(val("ax_peu"));
    DB.cfg.librSellado=parseNum(val("ax_sell")); DB.cfg.librAccion=parseNum(val("ax_acc"));
    DB.cfg.librPorc=parseNum(val("ax_lporc")); DB.cfg.baseCuotaLitisDef=val("ax_bcl");
    guardarCfg(); toast("Reglas guardadas"); this.render();
  },
  exportar(){
    const b=new Blob([JSON.stringify(DB,null,1)],{type:"application/json"});
    const a=el("a"); a.href=URL.createObjectURL(b); a.download="finanzas_"+hoy()+".json"; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  },

  /* ===================== RESGUARDO (planilla para el mail) =====================
     Genera un .xls (tabla HTML que abre Excel/Sheets) con todo lo del período,
     diciendo quién pagó qué. Sirve para que la info nunca se pierda. */
  planillaXls(desde,hasta,titulo){
    const enR = f => { const d=(f||"").slice(0,10); return d>=desde && d<=hasta; };
    const cau = cid => { const c=DB.causas[cid]; return c? nombreCausa(c) : "(sin causa)"; };
    const est=v=>'style="background:#0f9d6e;color:#fff;font-weight:bold"';
    const money=n=>NF.format(Number(n)||0);
    const tabla=(tit,cols,filas,totCol)=>{
      let tot=0; if(totCol!=null) filas.forEach(f=>tot+=Number(f[totCol])||0);
      return `<tr><td colspan="${cols.length}" ${est()} >${esc(tit)} (${filas.length})</td></tr>
      <tr>${cols.map(c=>'<td style="background:#e7ecf4;font-weight:bold">'+esc(c.t)+'</td>').join("")}</tr>
      ${filas.length? filas.map(f=>'<tr>'+cols.map((c,i)=>'<td'+(c.n?' style="mso-number-format:\\@;text-align:right"':'')+'>'+esc(c.n?money(f[i]):(f[i]==null?"":f[i]))+'</td>').join("")+'</tr>').join("")
        : '<tr><td colspan="'+cols.length+'" style="color:#888">Sin movimientos en el período</td></tr>'}
      ${totCol!=null&&filas.length?'<tr><td colspan="'+totCol+'" style="font-weight:bold;text-align:right">TOTAL</td><td style="font-weight:bold;text-align:right">'+money(tot)+'</td>'+(cols.length>totCol+1?'<td colspan="'+(cols.length-totCol-1)+'"></td>':'')+'</tr>':''}
      <tr><td colspan="${cols.length}"></td></tr>`;
    };

    /* gastos de causa */
    const gc=lista("gastos").filter(g=>enR(g.fecha)).sort((a,b)=>a.fecha<b.fecha?-1:1)
      .map(g=>{const r=RUBROS.find(x=>x.id===g.rubro)||{nom:g.rubro||"—"};
        return [fFec(g.fecha),cau(g.causa),(r.nom+(g.obs?" · "+g.obs:"")),nombreSocio(g.pagador),montoGasto(g)];});
    /* gastos del estudio */
    const ge=lista("movs").filter(m=>m.tipo==="gas"&&m.ambito==="est"&&enR(m.fecha)).sort((a,b)=>a.fecha<b.fecha?-1:1)
      .map(m=>[fFec(m.fecha),m.cat||"—",m.obs||"",m.medio||"",Number(m.monto)||0]);
    /* cobros */
    const cb=lista("cobros").filter(c=>enR(c.fecha)).sort((a,b)=>a.fecha<b.fecha?-1:1)
      .map(c=>[fFec(c.fecha),cau(c.causa),(c.concepto==="cl"?"Cuota litis":c.concepto==="reg"?"Honorarios regulados":"Otro"),nombreSocio(c.titular||"estudio"),c.medio||"",Number(c.monto)||0]);
    /* ingresos fijos */
    const inf=lista("movs").filter(m=>m.tipo==="ing"&&enR(m.fecha)).sort((a,b)=>a.fecha<b.fecha?-1:1)
      .map(m=>[fFec(m.fecha),m.cat||"—",m.obs||"",m.medio||"",Number(m.monto)||0]);
    /* ahorros */
    const ah=lista("ahorros").filter(a=>enR(a.fecha)).sort((a,b)=>a.fecha<b.fecha?-1:1)
      .map(a=>[fFec(a.fecha),(a.tipo==="ret"?"Retiro":"Depósito"),a.obs||"",Number(a.monto)||0]);

    const html=`<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
    <head><meta charset="utf-8"><style>td{border:1px solid #ccc;padding:4px 8px;font-family:Arial;font-size:11pt}</style></head>
    <body><table>
      <tr><td colspan="6" style="font-size:15pt;font-weight:bold;border:0">${esc(titulo)}</td></tr>
      <tr><td colspan="6" style="border:0;color:#555">Período ${fFec(desde)} al ${fFec(hasta)} · generado el ${fFec(hoy())} · Gudiño Cabrera y Asociados</td></tr>
      <tr><td colspan="6"></td></tr>
      ${tabla("GASTOS DE CAUSA",[{t:"Fecha"},{t:"Causa"},{t:"Concepto"},{t:"Quién pagó"},{t:"Importe",n:1}],gc,4)}
      ${tabla("GASTOS DEL ESTUDIO",[{t:"Fecha"},{t:"Categoría"},{t:"Detalle"},{t:"Medio"},{t:"Importe",n:1}],ge,4)}
      ${tabla("COBROS",[{t:"Fecha"},{t:"Causa"},{t:"Concepto"},{t:"A nombre de"},{t:"Medio"},{t:"Monto",n:1}],cb,5)}
      ${tabla("INGRESOS FIJOS",[{t:"Fecha"},{t:"Categoría"},{t:"Detalle"},{t:"Medio"},{t:"Importe",n:1}],inf,4)}
      ${tabla("AHORROS",[{t:"Fecha"},{t:"Movimiento"},{t:"Detalle"},{t:"Importe",n:1}],ah,3)}
    </table></body></html>`;
    return {html, vacio: !(gc.length||ge.length||cb.length||inf.length||ah.length)};
  },
  bajarPlanilla(desde,hasta,titulo,nombreArch){
    const {html}=this.planillaXls(desde,hasta,titulo);
    const b=new Blob(["﻿"+html],{type:"application/vnd.ms-excel"});
    const a=el("a"); a.href=URL.createObjectURL(b); a.download=nombreArch+".xls"; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  },
  /* rango de la semana (lunes a domingo) que contiene a f */
  rangoSemana(f){
    const d=new Date((f||hoy())+"T12:00:00"); const dow=(d.getDay()+6)%7; /* 0=lunes */
    const lun=new Date(d); lun.setDate(d.getDate()-dow);
    const dom=new Date(lun); dom.setDate(lun.getDate()+6);
    const iso=x=>x.toISOString().slice(0,10);
    return {desde:iso(lun), hasta:iso(dom)};
  },
  ultimoViernesMes(anio,mes0){ /* mes0: 0-11 */
    const d=new Date(anio,mes0+1,0); /* último día del mes */
    while(d.getDay()!==5) d.setDate(d.getDate()-1);
    return d;
  },
  descargarSemana(){
    const r=this.rangoSemana(hoy());
    this.bajarPlanilla(r.desde,r.hasta,"Gastos de la semana","gastos_semana_"+r.hasta);
    try{ localStorage.setItem("gfin_bkSemana", this.claveSemana()); }catch(e){}
  },
  descargarMes(){
    const m=this.mes||mesHoy(); const [a,mm]=m.split("-").map(Number);
    const desde=m+"-01"; const hasta=m+"-"+String(new Date(a,mm,0).getDate()).padStart(2,"0");
    this.bajarPlanilla(desde,hasta,"Sábana de gastos de "+fMes(m),"gastos_mes_"+m);
    try{ localStorage.setItem("gfin_bkMes", m); }catch(e){}
  },
  claveSemana(f){ const r=this.rangoSemana(f||hoy()); return r.hasta; }, /* domingo de la semana */
  chequearResguardo(){
    let bkS="",bkM=""; try{ bkS=localStorage.getItem("gfin_bkSemana")||""; bkM=localStorage.getItem("gfin_bkMes")||""; }catch(e){}
    const hoyD=new Date(hoy()+"T12:00:00"), dow=hoyD.getDay();
    const semACT=this.claveSemana();
    const mesACT=mesHoy();
    const uv=this.ultimoViernesMes(hoyD.getFullYear(),hoyD.getMonth());
    const esFinDeMes = hoyD>=uv;   /* estamos en/después del último viernes del mes */
    /* mensual pendiente: llegó el último viernes y no se bajó la sábana de este mes */
    if(esFinDeMes && bkM!==mesACT){ this.modalResguardo("mes"); return; }
    /* semanal pendiente: es viernes o fin de semana y no se bajó esta semana */
    if((dow===5||dow===6||dow===0) && bkS!==semACT){ this.modalResguardo("semana"); return; }
    /* si empezó una semana nueva y la anterior nunca se bajó, avisar igual */
    if(bkS && bkS<semACT && dow>=1 && dow<=4){ this.modalResguardo("semana"); return; }
  },
  modalResguardo(tipo){
    const mensual = tipo==="mes";
    const r=this.rangoSemana(hoy());
    const per = mensual? fMes(mesHoy()) : (fFec(r.desde)+" al "+fFec(r.hasta));
    this.modal({t:(mensual?"Resguardo del mes":"Resguardo de la semana"),ancho:true,b:`
      <div style="display:flex;gap:14px;align-items:flex-start">
        <div style="font-size:34px">🗄️</div>
        <div style="flex:1">
          <p style="margin:0 0 8px;font-size:14.5px">Antes de seguir, descargá ${mensual?"la <b>sábana del mes</b>":"la <b>planilla de la semana</b>"} y guardala o mandátela por mail.</p>
          <p class="small muted" style="margin:0">Período: <b>${per}</b>. Incluye gastos de causa, gastos del estudio, cobros, ingresos y ahorros, con quién pagó cada cosa. Así la información queda respaldada y no se pierde con ninguna actualización.</p>
        </div>
      </div>`,
      p:`<button class="btn gh" onclick="App.cerrar()" style="color:var(--tx3)">Ahora no</button>
         ${mensual?'<button class="btn" onclick="App.descargarSemana()">También la semana</button>':""}
         <button class="btn pri" onclick="${mensual?"App.descargarMes()":"App.descargarSemana()"};App.cerrar();${mensual?"":"App.trasResguardo()"}">⬇ Descargar y continuar</button>`});
  },
  trasResguardo(){ /* tras bajar la semana, si además falta la del mes, la pide */
    setTimeout(()=>{ let bkM=""; try{bkM=localStorage.getItem("gfin_bkMes")||"";}catch(e){}
      const h=new Date(hoy()+"T12:00:00"); const uv=this.ultimoViernesMes(h.getFullYear(),h.getMonth());
      if(h>=uv && bkM!==mesHoy()) this.modalResguardo("mes"); },400);
  },
  restaurar(inp){
    const f=inp.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{ try{
      const d=JSON.parse(r.result);

  /* ---- lectura directa de la base (solo lectura) ---- */
  baseUrl(ruta,extra){
    const c=DB.cfg; if(!c.dbUrl) return null;
    let b=c.dbUrl.trim().replace(/\/+$/,""); if(!/^https?:\/\//.test(b)) b="https://"+b;
    const p=[]; if(c.auth) p.push("auth="+encodeURIComponent(c.auth.trim())); if(extra) p.push(extra);
    return b+"/"+String(ruta||"").replace(/^\/+|\/+$/g,"")+".json"+(p.length?"?"+p.join("&"):"");
  },
  /* ¿esto parece un conjunto de causas? */
  pareceCausas(j){
    if(!j||typeof j!=="object") return null;
    const vals=Object.values(j).filter(x=>x&&typeof x==="object");
    if(!vals.length) return null;
    const conCar=vals.filter(x=>x.car||x.caratula||x.carLarga||x.caratulaCompleta);
    return conCar.length>=Math.max(1,vals.length*0.3) ? j : null;
  },
  async importarCausas(){
    if(!DB.cfg.dbUrl) return toast("Primero cargá la dirección de Firebase en Ajustes",true);
    this.modal({t:"Buscando las causas",b:'<div class="vacio"><span class="em">⏳</span>Leyendo la base…</div>'});
    const raiz=(DB.cfg.raizEstudio||"").replace(/^\/+|\/+$/g,"");
    const cand=[raiz+"/causas", raiz, "estudiomendoza40/v2/causas", "estudiomendoza40/v2",
                "estudiomendoza40/causas", "estudiomendoza40"].filter((v,i,a)=>v&&a.indexOf(v)===i);
    let err="";
    for(const ruta of cand){
      try{
        const u=this.baseUrl(ruta); if(!u) break;
        const r=await fetch(u,{cache:"no-store"});
        if(!r.ok){ err="HTTP "+r.status; continue; }
        const j=await r.json(); if(!j||typeof j!=="object") continue;
        let datos = this.pareceCausas(j) || (j.causas? this.pareceCausas(j.causas):null);
        if(datos){
          if(ruta!==raiz+"/causas" && ruta!==raiz){ DB.cfg.raizEstudio=ruta.replace(/\/causas$/,""); guardarCfg(); }
          return this.mostrarImport(datos);
        }
      }catch(e){ err=e.message; }
    }
    this.modal({t:"No encontré las causas solas",b:
      '<p style="margin-top:0">Probé en <code>'+cand.map(esc).join('</code>, <code>')+'</code> y no di con ellas'+(err?' ('+esc(err)+')':"")+'.</p>'+
      '<p class="small muted">Abrí el explorador y andá bajando hasta ver la rama donde están las causas: cuando la app la reconozca, te ofrece traerlas.</p>',
      p:'<button class="btn" onclick="App.cerrar()">Cerrar</button>'+
        '<button class="btn" onclick="App.cerrar();App.pegarJson()">Pegar un JSON</button>'+
        '<button class="btn pri" onclick="App.explorar(\'\')">🔎 Explorar la base</button>'});

      p:'<button class="btn" onclick="App.cerrar()">Cerrar</button>'+

  },
  socioPorTexto(t){
    const s=String(t||"").toLowerCase();
    if(s.includes("eugenia")||s.includes("velaz")) return "s_eug";
    if(s.includes("rosana")||s.includes("toranzo")) return "s_ros";
    if(s.includes("reinaldo")) return "s_rei";
    return "s_jp";
  },
  mapearRubro(t){
    const s=String(t||"").toLowerCase();
    if(/^\s*uf|unidad\s*forense/.test(s)) return {rubro:"uf",  cant:/2/.test(s)?2:1};
    if(/^\s*up|previsional/.test(s))      return {rubro:"up",  cant:/2/.test(s)?2:1};
    if(/adelanto|perito.*adelanto/.test(s))return{rubro:"per", cant:1};
    if(/plus/.test(s))                    return {rubro:"plus",cant:1};
    if(/estudio|m[eé]dic/.test(s))        return {rubro:"est", cant:1};
    if(/traslado|vi[aá]tic|combustible/.test(s)) return {rubro:"tras",cant:1};
    if(/edicto/.test(s))                  return {rubro:"edicto", cant:1};
    if(/c[eé]dul|oficio/.test(s))         return {rubro:"ced", cant:1};
    return {rubro:"otro",cant:1};
  },
  mapearCausa(x){
    const car = x.car||x.caratula||x.carLarga||x.titulo||x.nombre||"";
    const soc = this.socioPorTexto(x.socio||x.socioACargo||x.aCargo||"");
    const socios = soc==="s_jp" ? ["s_jp"] : ["s_jp",soc];
    let gs = x.gastos||x.gs||x.movimientos||[];
    if(gs&&!Array.isArray(gs)) gs=Object.values(gs);
    const gastos=(gs||[]).filter(g=>g&&typeof g==="object").map(g=>{
      const m=this.mapearRubro(g.rubro||g.tipo||g.concepto||g.detalle||"");
      return {fecha:String(g.fecha||g.f||hoy()).slice(0,10), rubro:m.rubro, cant:Number(g.cant)||m.cant,
        monto:parseNum(g.monto!=null?g.monto:g.importe), pagador:this.socioPorTexto(g.pago||g.pagador||g.quien||g.socio||""),
        obs:String(g.obs||g.observaciones||g.detalle||"").slice(0,180)};
    }).filter(g=>g.monto>0);
    const juzgado = x.juzgado||x.juz||x.jz||"";
    const fuero = x.fuero||x.fue||"";
    const est = String(x.estado||x.est||"").toLowerCase();
    const carStr = String(car).slice(0,120);
    return {car:carStr, carLarga:x.carLarga||x.caratulaCompleta||"",
      cliente:x.cliente||x.actor||x.clienteDe||"", fuero, juzgado, expte:x.ex||x.expte||"",
      tipo: esArtTexto(carStr+" "+fuero) ? "art" : "simple",
      socios,
      estado:(est==="archivada"||est==="cerrada"||x.archivada)?"archivada":"abierta", ext:x.id||"", gastos};
  },
  mostrarImport(datos){
    const arr=Object.values(datos).filter(x=>x&&typeof x==="object").map(x=>this.mapearCausa(x)).filter(x=>x.car);
    const yaHay=new Set(lista("causas").map(c=>(c.car||"").toLowerCase().trim()));
    const nuevas=arr.filter(x=>!yaHay.has(x.car.toLowerCase().trim()));
    if(!nuevas.length) return this.modal({t:"Nada nuevo para traer",b:'<p>Encontré '+arr.length+' causas y ya están todas cargadas acá.</p>',
      p:'<button class="btn pri" onclick="App.cerrar()">Listo</button>'});
    this._imp=nuevas;
    const conGastos=nuevas.reduce((t,x)=>t+(x.gastos?x.gastos.length:0),0);
    this.modal({t:"Traer causas del estudio",ancho:true,b:`
      <p class="small muted" style="margin-top:0">Encontré <b>${arr.length}</b> causas, de las cuales <b>${nuevas.length}</b> todavía no están acá. Destildá las que no quieras.</p>
      ${conGastos?`<label style="display:flex;gap:9px;align-items:center;background:var(--surf2);border:1px solid var(--line);border-radius:12px;padding:11px;margin-bottom:11px;cursor:pointer;font-size:13.5px">
        <input type="checkbox" id="imp_gas" checked> <span>Traer también los <b>${conGastos} gastos</b> que vienen cargados en esas causas (revisá después el rubro y quién los puso)</span></label>`:""}
      <div style="display:flex;gap:8px;margin-bottom:10px">
        <button class="btn sm" onclick="document.querySelectorAll('#imp_l input').forEach(i=>i.checked=true)">Todas</button>
        <button class="btn sm" onclick="document.querySelectorAll('#imp_l input').forEach(i=>i.checked=false)">Ninguna</button></div>
      <div id="imp_l" style="max-height:340px;overflow-y:auto;border:1px solid var(--line);border-radius:12px">
        ${nuevas.map((x,i)=>`<label style="display:flex;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer">
          <input type="checkbox" checked data-i="${i}">
          <span style="flex:1"><b>${esc(x.car)}</b><div class="small muted">${esc(x.cliente||"")} ${esc(x.juzgado||"")}${x.gastos&&x.gastos.length?" · "+x.gastos.length+" gastos":""}</div></span>
          <span>${x.socios.map(s=>'<i class="dot" style="background:'+colorSocio(s)+';margin-left:3px"></i>').join("")}</span></label>`).join("")}
      </div>`,
      p:'<button class="btn" onclick="App.cerrar()">Cancelar</button><button class="btn pri" onclick="App.confirmarImport()">Traer las tildadas</button>'});
  },
  confirmarImport(){
    const sel=[...document.querySelectorAll("#imp_l input[data-i]:checked")].map(i=>this._imp[+i.dataset.i]);
    const traerG=chk("imp_gas"); let ng=0;
    sel.forEach(x=>{
      const c=put("causas",{id:uid("cau"),car:x.car,carLarga:x.carLarga,cliente:x.cliente,fuero:x.fuero,
        juzgado:x.juzgado,socios:x.socios,porcRegulado:DB.cfg.porcReguladoDef,porcCuotaLitis:DB.cfg.porcCuotaLitisDef,
        estado:x.estado,origen:"estudio",extId:x.ext});
      if(traerG&&x.gastos) x.gastos.forEach(g=>{
        put("gastos",{id:uid("gas"),causa:c.id,fecha:g.fecha,rubro:g.rubro,cant:g.cant,monto:g.monto,
          manual:true,pagador:g.pagador,obs:g.obs,origen:"estudio"}); ng++;
      });

  /* trae los juzgados (y fuero) de la app del estudio para las causas que ya tenés cargadas */
  async actualizarJuzgados(){
    if(!DB.cfg.dbUrl) return toast("Primero cargá la dirección de Firebase en Ajustes",true);
    this.modal({t:"Actualizando juzgados",b:'<div class="vacio"><span class="em">⏳</span>Leyendo la base del estudio…</div>'});
    const raiz=(DB.cfg.raizEstudio||"estudiomendoza40/v2").replace(/^\/+|\/+$/g,"");
    const cand=[raiz+"/causas", raiz, "estudiomendoza40/v2/causas"].filter((v,i,a)=>v&&a.indexOf(v)===i);
    let datos=null;
    for(const ruta of cand){
      try{ const u=this.baseUrl(ruta); if(!u) break;
        const r=await fetch(u,{cache:"no-store"}); if(!r.ok) continue;
        const j=await r.json(); datos=this.pareceCausas(j)||(j&&j.causas?this.pareceCausas(j.causas):null);
        if(datos) break;
      }catch(e){}
    }
    if(!datos) return this.modal({t:"No pude leer el estudio",b:'<p>No encontré las causas en la base. Probá con «⬇ Traer del estudio».</p>',p:'<button class="btn" onclick="App.cerrar()">Cerrar</button>'});
    /* índice por id externo y por carátula normalizada */
    const norm=s=>String(s||"").toLowerCase().replace(/\s+/g," ").trim();
    const porId={}, porCar={};
    Object.values(datos).filter(x=>x&&typeof x==="object").forEach(x=>{
      const m=this.mapearCausa(x);
      if(x.id!=null) porId[String(x.id)]=m;
      if(m.car) porCar[norm(m.car)]=m;
    });
    let n=0;
    lista("causas").forEach(c=>{
      const m = (c.extId!=null&&porId[String(c.extId)]) || porCar[norm(c.car)];
      if(!m) return;
      const cambios={};
      if(m.juzgado && m.juzgado!==c.juzgado) cambios.juzgado=m.juzgado;
      if(m.fuero && !c.fuero) cambios.fuero=m.fuero;
      if(m.tipo && !c.tipo) cambios.tipo=m.tipo;
      if(!c.extId && m.ext!=null) cambios.extId=m.ext;
      if(Object.keys(cambios).length){ put("causas",Object.assign({},c,cambios)); n++; }
    });
    this.cerrar(); this.render();
    toast(n? "Actualicé el juzgado de "+n+" causa"+(n===1?"":"s") : "Todas las causas ya tenían su juzgado");
  },


  /* ---- informe imprimible de la liquidación ---- */
  imprimirLiq(cid){
    const L=liquidar(cid); if(!L) return;
    const c=L.causa;
    const fila=(t,m,cl)=>'<tr><td>'+t+'</td><td class="n'+(cl?" "+cl:"")+'">'+m+'</td></tr>';
    const w=window.open("","_blank","width=820,height=900");
    if(!w) return toast("El navegador bloqueó la ventana de impresión",true);
    w.document.write(`<!DOCTYPE html><html lang="es-AR"><head><meta charset="utf-8"><title>Liquidación ${esc(c.car)}</title>
    <style>
      @page{margin:2cm}
      body{font-family:Arial,Helvetica,sans-serif;font-size:11pt;color:#111;margin:0;padding:18px}
      h1{font-size:15pt;margin:0 0 2px} h2{font-size:12pt;margin:20px 0 6px;border-bottom:1px solid #999;padding-bottom:3px}
      .sub{color:#555;font-size:10pt;margin-bottom:14px}
      table{width:100%;border-collapse:collapse;font-size:10.5pt}
      td,th{padding:5px 7px;border-bottom:1px solid #ddd;text-align:left}
      td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
      .det td{padding-left:26px;color:#555;font-size:9.5pt}
      .sum td{font-weight:bold;background:#f2f2f2}
      .fin td{font-weight:bold;background:#e8f5ee;border-top:2px solid #0a7a52;border-bottom:2px solid #0a7a52}
      .pie{margin-top:26px;font-size:9pt;color:#777;border-top:1px solid #ccc;padding-top:8px}
    </style></head><body>
    <h1>Liquidación de honorarios</h1>
    <div class="sub"><b>${esc(nombreCausa(c))}</b> — ${esc(c.carLarga||c.car)}${c.cliente?" · Cliente: "+esc(c.cliente):""}${c.juzgado?" · "+esc(c.juzgado):""}<br>Emitido el ${fFec(hoy())}</div>
    <h2>Cobros</h2><table>
      ${fila("Honorarios regulados cobrados",pes(L.totReg))}
      ${fila("Pacto de cuota litis",pes(L.totCl))}
      ${L.totOtr?fila("Otros cobros",pes(L.totOtr)):""}
      <tr class="sum"><td>Masa bruta</td><td class="n">${pes(L.bruto)}</td></tr></table>
    <h2>Deducciones</h2><table>
      ${fila("Impuestos de los socios sobre sus regulados","− "+pes(L.totRet))}
      ${L.retDet.map(r=>'<tr class="det"><td>'+esc(nombreSocio(r.socio))+" · "+fFec(r.fecha)+" — cobra "+pes(r.neto)+" de "+pes(r.honorario)+'</td><td class="n">− '+pes(-r.dif)+"</td></tr>").join("")}
      ${fila("Informante ("+NF4.format(L.porcInf)+" % de "+pes(L.baseInf)+")","− "+pes(L.informante))}
      ${fila("Devolución de gastos","− "+pes(L.totGastos))}
      ${Object.keys(L.porSocioGasto).map(s=>'<tr class="det"><td>'+esc(nombreSocio(s))+'</td><td class="n">− '+pes(L.porSocioGasto[s])+"</td></tr>").join("")}
      <tr class="fin"><td>Neto a repartir entre ${L.socios.length} socio${L.socios.length>1?"s":""}</td><td class="n">${pes(L.neto)}</td></tr></table>
    <h2>Le corresponde a cada uno</h2><table>
      <tr><th>Socio</th><th class="n">%</th><th class="n">Parte</th><th class="n">Gastos devueltos</th><th class="n">Total</th></tr>
      ${L.porSocio.map(s=>'<tr><td>'+esc(s.nombre)+'</td><td class="n">'+NF4.format(s.porc||0)+' %</td><td class="n">'+pes(s.parte)+'</td><td class="n">'+pes(s.gastos)+'</td><td class="n"><b>'+pes(s.total)+"</b></td></tr>").join("")}
    </table>
    <h2>Quién tiene la plata</h2><table>
      <tr><th>Socio</th><th class="n">Ya cobró</th><th class="n">Le corresponde</th><th class="n">Diferencia</th></tr>
      ${L.porSocio.map(s=>'<tr><td>'+esc(s.nombre)+'</td><td class="n">'+pes(s.enMano)+'</td><td class="n">'+pes(s.total)+'</td><td class="n"><b>'+(Math.abs(s.saldo)<1?"al día":(s.saldo>0?"le falta cobrar ":"tiene de más ")+pes(Math.abs(s.saldo)))+"</b></td></tr>").join("")}
      ${L.informante?'<tr><td>Informante</td><td class="n">—</td><td class="n">'+pes(L.informante)+'</td><td class="n"><b>a pagar</b></td></tr>':""}
    </table>
    <div class="pie">Gudiño Cabrera y Asociados · Estudio Jurídico — documento de uso interno</div>
    </body></html>`);
    w.document.close(); setTimeout(()=>w.print(),350);
  }
});

function guardarCfg(){ DB.cfg._t=now(); guardarLocal(); Nube.putNodo("cfg",DB.cfg); }
function guardarValores(){ DB.valores._t=now(); guardarLocal(); Nube.putNodo("valores",DB.valores); }
Nube.putNodo=async function(nombre,obj){
  const u=this.url(nombre); if(!u){ this.marca("off"); return; }
  this.marca("wait");
  try{
    const r=await fetch(u,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(obj)});
    if(!r.ok) throw new Error("HTTP "+r.status);
    this.marca("ok");
  }catch(e){ this.marca("err","No se pudo guardar en la nube"); }
};

App.init();
