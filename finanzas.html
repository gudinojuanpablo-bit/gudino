   filas: {nom, signo(+1/-1), tipo(porc|fijo), val, base(hon|iva|fact|neto)} */
function porEscala(escala,x){
  const e=(escala||[]).slice().sort((a,b)=>(a.d||0)-(b.d||0));
  if(!e.length) return 0;
  let t=e[0];
  for(const tr of e){ if(x>=(tr.d||0)) t=tr; else break; }
  return (Number(t.fijo)||0) + (x-(t.exc!=null?t.exc:t.d))*(Number(t.tasa)||0)/100;
}
function calcRetenciones(socio,honorario){
  const H=Number(honorario)||0;
  const filas=[]; let iva=0, acum=H;
  (socio && socio.ret ? socio.ret : []).forEach(r=>{
    const base = r.base==="iva" ? iva : r.base==="fact" ? (H+iva) : r.base==="neto" ? acum : H;
    let m, det;
    if(r.tipo==="fijo"){ m=Number(r.val)||0; det=pes(r.val); }
    else if(r.tipo==="escala"){ m=porEscala(socio&&socio.escala,base); det="por escala sobre "+pes0(base)+" ("+NF4.format(base?m/base*100:0)+" %)"; }
    else { m=base*(Number(r.val)||0)/100; det=NF4.format(r.val)+" % de "+({hon:"honorarios",iva:"IVA",fact:"facturado",neto:"subtotal"}[r.base]||"honorarios"); }
    m = Math.abs(m)*(r.signo<0?-1:1);
    if(r.signo>0 && /iva/i.test(r.nom)) iva += Math.abs(m);
    acum += m;
    filas.push({nom:r.nom, monto:m, det});
  });
  return {honorario:H, filas, neto:acum, dif:acum-H, iva};
}

/* ---- honorarios según la Ley 2557-O ---- */
function tramoEscala(enUma){
  return ESCALA27.find(t=> enUma>t.d && (t.h==null || enUma<=t.h)) || ESCALA27[0];
}
function calcHonorarios(p){
  const uma = p.uma || umaHoy();
  const monto = Number(p.monto)||0;
  const enUma = uma? monto/uma : 0;
  const tr = tramoEscala(enUma);
  const iv = INTERV.find(x=>x.id===p.interv) || INTERV[0];
  let min, max;
  const pasos = [{t:"Cuantía del proceso", d:pes(monto)+"  ·  "+NF4.format(enUma)+" UMA", art:22}];

  if(iv.directo){
    min = monto*iv.directo.min/100; max = monto*iv.directo.max/100;
    pasos.push({t:iv.nom+" (art. "+iv.art+")", d:NF4.format(iv.directo.min)+" % a "+NF4.format(iv.directo.max)+" % del monto", art:+iv.art});
    pasos.push({t:"Honorario", d:pes(min)+" a "+pes(max), destacar:true});
  } else {
    min = monto*tr.min/100; max = monto*tr.max/100;
    pasos.push({t:"Escala del art. 27 — tramo "+tr.n, d:NF4.format(tr.min)+" % a "+NF4.format(tr.max)+" %", art:27});
    pasos.push({t:"Honorario de la escala", d:pes(min)+" a "+pes(max), destacar:true});
    if(iv.min!==1 || iv.max!==1){
      min*=iv.min; max*=iv.max;
      pasos.push({t:iv.nom+" (art. "+iv.art+")", d:pes(min)+" a "+pes(max), art:parseInt(iv.art)});
    }
  }

  const esq = ESQUEMAS[p.esquema] || ESQUEMAS.ord;
  const sel = p.etapas||[];
  const frac = iv.sinEtapas ? 1 : esq.et.reduce((t,e,i)=> t + (sel.includes(i)? e.f : 0), 0);
  if(!iv.sinEtapas && frac>=0 && frac<0.999){
    min*=frac; max*=frac;
    pasos.push({t:"Etapas cumplidas ("+sel.length+" de "+esq.et.length+")", d:NF4.format(frac*100)+" % → "+pes(min)+" a "+pes(max), art:49});
  }

  const rol = ROLES.find(r=>r.id===p.rol) || ROLES[0];
  if(rol.f!==1){
    min*=rol.f; max*=rol.f;
    pasos.push({t:rol.nom+" (art. 55)", d:NF4.format(rol.f*100)+" % → "+pes(min)+" a "+pes(max), art:55});
  }

  /* parte vencida: tope del 70 % de lo del vencedor (art. 57) */
  if(p.vencida){ min*=.7; max*=.7;
    pasos.push({t:"Profesional de la parte vencida (art. 57)", d:"tope del 70 % → "+pes(min)+" a "+pes(max), art:57}); }

  /* pisos legales */
  let pisoUma = iv.piso||0, pisoTxt = "";
  if(p.piso===false) pisoUma=0;
  if(pisoUma===10) pisoTxt="mínimo de 10 UMA del art. 46 para procesos de conocimiento";
  else if(pisoUma) pisoTxt="mínimo de "+pisoUma+" UMA del art. "+iv.art;
  const piso = pisoUma*uma;
  let aplicoPiso=false;
  if(piso && min<piso){ min=piso; aplicoPiso=true; if(max<piso) max=piso;
    pasos.push({t:"Piso legal", d:pisoTxt+" = "+pes(piso), aviso:true, art:pisoUma===10?46:parseInt(iv.art)}); }

  return {uma, monto, enUma, tramo:tr, min, max, pasos, esq, frac, rol, iv, aplicoPiso,
          minUma:uma?min/uma:0, maxUma:uma?max/uma:0};
}
const artLey = n => LEY.find(a=>a.n===+n) || null;

/* ---- lo que el juzgado descuenta de un libramiento ----
   Verificado con el libramiento de Naveda: 25.000.000 → 24.999.880 (sellado 100 + acción social 20). */
function descuentoLibramiento(monto){
  const m=Number(monto)||0;
  if(m<=0) return {fijo:0, porc:0, total:0};   /* sin libramiento no hay descuento */
  const c=DB.cfg;
  const fijo=(Number(c.librSellado)||0)+(Number(c.librAccion)||0);
  const porc=m*(Number(c.librPorc)||0)/100;
  return {fijo, porc, total:fijo+porc};
}

/* ---- liquidación del reclamo: de cuánto prosperó a cuánto cobra cada uno ---- */
function calcReclamo(c){
  if(!c) return null;
  const cfg=DB.cfg;
  const X=Number(c.montoProsperado)||0;
  const pReg=(c.porcRegulado!=null?c.porcRegulado:cfg.porcReguladoDef)||0;
  const pCl =(c.porcCuotaLitis!=null?c.porcCuotaLitis:cfg.porcCuotaLitisDef)||0;

  /* 1 — libramiento de capital a nombre del cliente */
  const dCap=descuentoLibramiento(X);
  const netoCliente=X-dCap.total;

  /* 2 — cuota litis que le cobramos al cliente */
  const base=(c.baseCuotaLitis||cfg.baseCuotaLitisDef)==="bruto"?X:netoCliente;
  const cuotaLitis=base*pCl/100;
  const leQueda=netoCliente-cuotaLitis;

  /* 3 — honorarios regulados, a cargo de la ART */
  const honReg=X*pReg/100;
  const socId=c.socioReg||"";
  const pSoc=(c.porcSocioReg!=null?c.porcSocioReg:cfg.porcEugeniaDef)||0;
  const honSoc=socId?honReg*pSoc/100:0;
  const honEst=honReg-honSoc;

  const libr=[];
  const unLibr=(nom,titular,bruto)=>{
    if(bruto<=0) return;
    const s=titular&&titular!=="estudio"?socioDe(titular):null;
    if(s && s.ret && s.ret.length){
      const r=calcRetenciones(s,bruto);
      libr.push({nom, titular, bruto, neto:r.neto, quita:bruto-r.neto, filas:r.filas, perfil:true});
    } else {
      const d=descuentoLibramiento(bruto);
      libr.push({nom, titular:titular||"estudio", bruto, neto:bruto-d.total, quita:d.total,
        filas:[{nom:"Sellado y acción social", monto:-d.fijo, det:"fijo por libramiento"}].concat(
          d.porc?[{nom:"Retención proporcional", monto:-d.porc, det:NF4.format(cfg.librPorc)+" %"}]:[]), perfil:false});
    }
  };
  unLibr("Honorarios regulados del estudio","estudio",honEst);
  if(socId) unLibr("Honorarios regulados de "+nombreSocio(socId),socId,honSoc);

  const honNeto=libr.reduce((t,l)=>t+l.neto,0);
  const masa=honNeto+cuotaLitis;   /* lo que entra al reparto entre socios */

  return {causa:c, X, pReg, pCl, dCap, netoCliente, base, cuotaLitis, leQueda,
          honReg, honEst, honSoc, socId, pSoc, libr, honNeto, masa};
}

const socioDe = id => DB.socios[id] || null;
/* ---- nombre sintético de la causa: "Abrego c/ Asociart", "Funes · Sucesorio" ---- */
const SUF=/\b(S\.?A\.?S?|S\.?R\.?L\.?|S\.?A\.?U\.?|A\.?R\.?T\.?|ART|SEGUROS|CIA|COMPAÑ[IÍ]A|LTDA|SOCIEDAD|AN[OÓ]NIMA|Y\s+OTROS?|Y\s+OTRAS?)\b\.?/gi;
const PART=/^(DE|DEL|LA|LAS|LOS|SAN|SANTA|DI|DA|MC|VAN|VON|ST)$/i;
const cap=t=>String(t||"").toLowerCase().replace(/(^|[\s'’-])(\p{L})/gu,(m,a,b)=>a+b.toUpperCase());
const frase=t=>{const s=String(t||"").toLowerCase().trim(); return s?s[0].toUpperCase()+s.slice(1):"";};
/* junta las siglas con puntos: O.S.S.E. → OSSE */
const unirSiglas=t=>String(t||"").replace(/\b(?:\p{L}\.){2,}/gu,m=>m.replace(/\./g,""));
const palabra=t=>{const s=String(t||"").trim();
  return (s===s.toUpperCase()&&s.length<=4&&/^\p{Lu}+$/u.test(s))?s:cap(s);};
function apellido(t){
  const w=unirSiglas(String(t||"")).replace(/[.,]/g," ").split(/\s+/).filter(Boolean);
  if(!w.length) return "";
  let n=0; while(n<w.length-1 && PART.test(w[n])) n++;
  const out=w.slice(0,n+1);
  return out.map((x,i)=> i<n ? (i===0?cap(x):x.toLowerCase()) : palabra(x)).join(" ");
}
function sintetizar(car){
  let s=unirSiglas(String(car||"").replace(/\s+/g," ").trim());
  if(!s) return "";
  let objeto="", m=s.match(/\s+s\/\s*(.+)$/i);
  if(m){ objeto=m[1]; s=s.slice(0,m.index); }
  else { m=s.match(/\s+[-–]\s+(.+)$/); if(m){ objeto=m[1]; s=s.slice(0,m.index); } }
  objeto=objeto.replace(/\(.*?\)/g,"").replace(/^[pP]-\s*/,"").replace(SUF,"").replace(/\s+/g," ").trim();
  const p=s.split(/\s+c\/\s*|\s*\bC\/\s*|\s+\bC\s+/i);
  const actor=apellido(p[0]);
  let dem=(p[1]||"").replace(SUF,"").replace(/\(.*?\)/g,"").replace(/\s+/g," ").trim();
  dem=dem?apellido(dem):"";
  if(dem) return actor+" c/ "+dem;
  if(objeto){ let o=frase(objeto); if(o.length>24) o=o.slice(0,23).replace(/\s\S*$/,"")+"…"; return actor+" · "+o; }
  return actor||cap(car).slice(0,40);
}
const nombreCausa = c => (c && c.corto && c.corto.trim()) || sintetizar(c&&c.car) || "(sin carátula)";
/* Filtro ART: primero detecta las laborales y, dentro de esas, las de ART.
   Ojo: "art." de "artículo" (art. 245, art. 9) NO es ART; solo cuenta la sigla
   ART/A.R.T. como aseguradora, "Asociart", "riesgos del trabajo" o L.R.T./S.R.T.
   Las causas contra OSSE nunca son de ART. */
const esArtTexto = s => {
  const t=String(s||"").toLowerCase();
  if(/\bosse\b|o\.?s\.?s\.?e|obras? sanitarias/.test(t)) return false;   // OSSE no es ART
  const n=t.replace(/[.\-]/g,"");                                         // sin puntos ni guiones
  return /asociart|riesgos del trabajo|\blrt\b|\bsrt\b/.test(n)          // siglas / aseguradora segura
      || /\bart\b(?!\s*\d)/.test(n);                                      // sigla ART, pero no "art 245" (artículo)
};
const esLaboralCausa = c => c && /laboral/i.test((c.fuero||"")+" "+(c.juzgado||"")+" "+juzgadoDir(c));
/* Sugerencia automática (orientativa; se corrige a mano en «Otras herramientas → Marcar ART») */
const artAuto = c => c && esLaboralCausa(c) && esArtTexto((c.car||"")+" "+(c.carLarga||""));
/* La marca manual manda: si vos la marcaste (o desmarcaste), eso vale por sobre todo. */
const esArtCausa = c => { if(!c) return false;
  if(c.artManual===true)  return true;
  if(c.artManual===false) return false;
  return artAuto(c); };

const nombreSocio = id => id==="estudio" ? "El estudio" : (socioDe(id)?socioDe(id).corto : "—");
const colorSocio  = id => id==="estudio" ? "#10b981" : (socioDe(id)?socioDe(id).color : "#8593ac");

const gastosDe = cid => lista("gastos").filter(g=>g.causa===cid);
const cobrosDe = cid => lista("cobros").filter(c=>c.causa===cid);

/* liquidación completa de una causa */
function liquidar(cid,opts){
  opts=opts||{};
  const c=DB.causas[cid]; if(!c) return null;
  const cfg=DB.cfg;
  const cobros=cobrosDe(cid).sort((a,b)=>a.fecha<b.fecha?-1:1);
  const gastos=gastosDe(cid).sort((a,b)=>a.fecha<b.fecha?-1:1);

  const reg = cobros.filter(x=>x.concepto==="reg");
  const cl  = cobros.filter(x=>x.concepto==="cl");
  const otr = cobros.filter(x=>x.concepto==="otro");
  const sum = a => a.reduce((t,x)=>t+(Number(x.monto)||0),0);
  const totReg=sum(reg), totCl=sum(cl), totOtr=sum(otr);
  const bruto = totReg+totCl+totOtr;

  const esArt = true;   /* todas las causas usan el circuito completo */

  /* 1 — retenciones impositivas sobre los regulados a nombre de cada socio */
  const retDet=[]; let totRet=0;
  if(esArt) reg.forEach(x=>{
    const esEstudio = !x.titular || x.titular==="estudio";
    const s=esEstudio?null:socioDe(x.titular);
    if(!esEstudio && !s) return;
    if(esEstudio && !(x.comp && Number(x.comp.neto))) return;   /* al estudio solo se le descuenta lo del comprobante */
    let r;
    if(x.comp && Number(x.comp.neto)){       /* datos reales del comprobante de libramiento */
      const neto=Number(x.comp.neto), hon=Number(x.monto)||0;
      const f=[];
      const add=(n,v,sg)=>{ if(Number(v)) f.push({nom:n,monto:sg*Math.abs(Number(v)),det:"del comprobante"}); };
      add("IVA que se suma a la factura",(Number(x.comp.solicitado)||hon*1.21)-hon,1);
      add("Retención de IVA",x.comp.iva,-1); add("Retención de Ganancias",x.comp.gcias,-1);
      add("Retención DGR",x.comp.dgr,-1); add("Sellado",x.comp.sellado,-1); add("Acción Social",x.comp.accion,-1);
      r={honorario:hon, filas:f, neto, dif:neto-hon, real:true};
    } else {
      if(!s.ret || !s.ret.length) return;
      r=calcRetenciones(s,x.monto);
    }
    if(Math.abs(r.dif)<0.005) return;
    retDet.push({socio:x.titular, cobro:x.id, fecha:x.fecha, honorario:r.honorario, neto:r.neto, dif:r.dif, filas:r.filas, real:!!r.real});
    totRet += -r.dif;  /* dif negativa = le descuentan; sale de la masa */
  });

  /* 2 — informante */
  const baseInf = cfg.baseInformante==="post" ? (bruto-totRet) : bruto;
  const porcInf = (c.porcInformante!=null?c.porcInformante:cfg.porcInformante)||0;
  const informante = baseInf*porcInf/100;

  /* 3 — devolución de gastos al socio que los puso */
  const porSocioGasto={}; let totGastos=0;
  gastos.forEach(g=>{
    if(g.noReintegrar) return;
    const m=montoGasto(g); totGastos+=m;
    porSocioGasto[g.pagador]=(porSocioGasto[g.pagador]||0)+m;
  });

  /* 4 — reparto (por porcentajes; si no hay, se divide en partes iguales) */
  const socios=(c.socios&&c.socios.length)?c.socios:["s_jp"];
  const neto = bruto - totRet - informante - totGastos;
  const rep = repartoDe(c);
  const parte = neto/socios.length;

  const porSocio = socios.map(id=>{
    const pc = rep[id]||0;
    return {id, nombre:nombreSocio(id), color:colorSocio(id), porc:pc,
      parte:neto*pc/100, gastos:porSocioGasto[id]||0, total:neto*pc/100+(porSocioGasto[id]||0)};
  });
  Object.keys(porSocioGasto).forEach(id=>{
    if(!socios.includes(id)) porSocio.push({id,nombre:nombreSocio(id),color:colorSocio(id),porc:0,parte:0,gastos:porSocioGasto[id],total:porSocioGasto[id]});
  });

  /* cuánto termina cobrando cada socio con regulación a su nombre */
  const netoSocios={};
  retDet.forEach(r=>{ netoSocios[r.socio]=(netoSocios[r.socio]||0)+r.neto; });

  /* plata que ya tiene cada uno en la mano (lo del estudio lo administra Juan Pablo) */
  const enMano={};
  cobros.forEach(x=>{
    const t=x.titular||"estudio", dest = t==="estudio" ? "s_jp" : t;
    let m=Number(x.monto)||0;
    const d=retDet.find(r=>r.cobro===x.id); if(d) m=d.neto;
    enMano[dest]=(enMano[dest]||0)+m;
  });
  porSocio.forEach(s=>{ s.enMano=enMano[s.id]||0; s.saldo=s.total-s.enMano; });
  Object.keys(enMano).forEach(id=>{
    if(!porSocio.find(s=>s.id===id)) porSocio.push({id,nombre:nombreSocio(id),color:colorSocio(id),porc:0,parte:0,gastos:0,total:0,enMano:enMano[id],saldo:-enMano[id]});
  });

  return {causa:c, esArt, cobros, gastos, totReg, totCl, totOtr, bruto,
          retDet, totRet, porcInf, baseInf, informante, rep,
          porSocioGasto, totGastos, neto, parte, socios, porSocio, netoSocios};
}

/* porcentajes de reparto de una causa; si no están cargados, partes iguales */
function repartoDe(c){
  const socios=(c.socios&&c.socios.length)?c.socios:["s_jp"];
  const r={}; let suma=0;
  socios.forEach(id=>{ const v=c.reparto&&c.reparto[id]!=null?Number(c.reparto[id]):null; if(v!=null){ r[id]=v; suma+=v; } });
  if(Object.keys(r).length!==socios.length || Math.abs(suma-100)>0.01){
    socios.forEach(id=>r[id]=100/socios.length);
  }
  return r;
}

/* estado financiero resumido de una causa */
function estadoCausa(cid){
  const L=liquidar(cid);
  return {cobrado:L.bruto, gastos:L.totGastos, neto:L.neto, miParte:(L.porSocio.find(s=>s.id==="s_jp")||{total:0}).total, socios:L.socios.length};
}

/* ---------- LIQUIDACIÓN ENTRE SOCIOS (reparto de utilidades) ---------- */
const CONCEPTOS_REP = [
  {id:"jp",    nom:"Depositado a JP"},
  {id:"eug",   nom:"Depositado a Eugenia"},
  {id:"pacto", nom:"Pago de pacto (cuota litis)"}
];
function conceptoRepNom(id){ return ({jp:"Depositado a JP",eug:"Depositado a Eugenia",pacto:"Pacto de cuota litis",reg:"Honorarios regulados",cl:"Pacto de cuota litis",otro:"Otro"})[id]||"—"; }
/* nombre de la causa de un reparto (id de causa o nombre a mano) */
function nombreReparto(r){
  if(r.causaId && DB.causas[r.causaId]) return nombreCausa(DB.causas[r.causaId]);
  return r.causaNom || "(sin causa)";
}
/* gastos pendientes de recuperar de una causa (para deducir en el reparto) */
function gastosPendientes(causaId, exceptoReparto){
  if(!causaId) return [];
  return gastosDe(causaId).filter(g=> !g.noReintegrar && (!g.devuelto || g.reparto===exceptoReparto));
}
/* cálculo completo de un reparto */
function calcReparto(r){
  /* ---- carga simplificada: montos finales por socio, ya calculados afuera ---- */
  if(r.manualSplit){
    const montos = r.montos||{};
    const ids = Object.keys(montos).filter(id=>Number(montos[id]));
    const porSocio = ids.map(id=>({id, nombre:nombreSocio(id), color:colorSocio(id), divide:true,
      parte:Number(montos[id])||0, gastos:0, total:Number(montos[id])||0})).sort((a,b)=>b.total-a.total);
    const neto = porSocio.reduce((t,s)=>t+s.total,0);
    const monto = Number(r.monto)||neto;
    const mi = porSocio.find(s=>s.id==="s_jp") || {total:0,parte:0,gastos:0};
    return {manual:true, monto, infPct:0, informante:0, gs:[], gTot:0, descuentos:0, neto,
            socios:ids, N:ids.length, perShare:0, porSocio,
            miTotal:mi.total, miParte:mi.parte, miGastos:0};
  }
  const monto = Number(r.monto)||0;
  const infPct = r.informantePct!=null ? Number(r.informantePct) : (DB.cfg.porcInformante||10);
  const informante = monto*infPct/100;
  /* gastos de la causa a reintegrar (los pendientes, o los que ya tomó este reparto) */
  const gs = gastosPendientes(r.causaId, r.id);
  const gTot = gs.reduce((t,g)=>t+montoGasto(g),0);
  const descuentos = informante + gTot;
  const neto = monto - descuentos;
  /* división general entre los socios elegidos */
  const socios = (r.soloYo ? ["s_jp"] : (r.socios&&r.socios.length? r.socios : ["s_jp"]));
  const N = socios.length||1;
  const perShare = neto/N;
  /* gastos por socio (quién puso qué de esta causa) */
  const gPorSocio={}; gs.forEach(g=>{ gPorSocio[g.pagador]=(gPorSocio[g.pagador]||0)+montoGasto(g); });
  /* cada socio: parte general (si divide) + reintegro de lo que puso */
  const ids = [...new Set([...socios, ...Object.keys(gPorSocio)])];
  const porSocio = ids.map(id=>{
    const divide = socios.includes(id);
    const parte = divide ? perShare : 0;
    const reint = gPorSocio[id]||0;
    return {id, nombre:nombreSocio(id), color:colorSocio(id), divide, parte, gastos:reint, total:parte+reint};
  }).sort((a,b)=>b.total-a.total);
  const mi = porSocio.find(s=>s.id==="s_jp") || {total:0,parte:0,gastos:0};
  return {monto, infPct, informante, gs, gTot, descuentos, neto, socios, N, perShare, porSocio,
          miTotal:mi.total, miParte:mi.parte, miGastos:mi.gastos};
}
/* saldo de MI caja (lo que me queda): repartos + movimientos manuales míos */
function saldoCaja(){ return lista("caja").reduce((t,x)=>t+(x.signo===-1?-1:1)*(Number(x.monto)||0),0); }

/* ---------- agregados por mes ---------- */
function mesesConDatos(){
  const s=new Set();
  lista("cobros").forEach(x=>s.add(mesDe(x.fecha)));
  lista("gastos").forEach(x=>s.add(mesDe(x.fecha)));
  lista("movs").forEach(x=>s.add(mesDe(x.fecha)));
  lista("costos").forEach(x=>s.add(x.mes));
  lista("liq").forEach(x=>s.add(mesDe(x.fecha)));
  lista("caja").forEach(x=>s.add(mesDe(x.fecha)));
  s.add(mesHoy());
  return [...s].filter(Boolean).sort();
}
function resumenMes(m){
  const cob=lista("cobros").filter(x=>mesDe(x.fecha)===m);
  const gas=lista("gastos").filter(x=>mesDe(x.fecha)===m);
  const mv =lista("movs").filter(x=>mesDe(x.fecha)===m);
  const honCobrados=cob.reduce((t,x)=>t+(Number(x.monto)||0),0);
  const gastoCausas=gas.reduce((t,x)=>t+montoGasto(x),0);
  const otrosIng=mv.filter(x=>x.tipo==="ing").reduce((t,x)=>t+(Number(x.monto)||0),0);
  const gEstMov=mv.filter(x=>x.tipo==="gas"&&x.ambito==="est").reduce((t,x)=>t+(Number(x.monto)||0),0);
  const gEstFijo=lista("costos").filter(x=>x.mes===m).reduce((t,x)=>t+(Number(x.monto)||0),0);
  const gEst=gEstMov+gEstFijo;
  const gPer=mv.filter(x=>x.tipo==="gas"&&x.ambito==="per").reduce((t,x)=>t+(Number(x.monto)||0),0);
  /* mi parte real: proporcional de los cobros del mes según la liquidación de cada causa */
  let mio=0;
  const causasMes=[...new Set(cob.map(x=>x.causa))];
  causasMes.forEach(cid=>{
    if(!DB.causas[cid]) return;
    const L=liquidar(cid); if(!L||!L.bruto) return;
    const cobradoMes=cob.filter(x=>x.causa===cid).reduce((t,x)=>t+(Number(x.monto)||0),0);
    const miTot=(L.porSocio.find(s=>s.id==="s_jp")||{total:0}).total;
    mio += miTot*(cobradoMes/L.bruto);
  });
  /* ---- liquidaciones (repartos) del mes: bruto que entró + mi parte ---- */
  const liqMes=lista("liq").filter(x=>mesDe(x.fecha)===m);
  let facturacionRep=0; liqMes.forEach(r=>{ facturacionRep += calcReparto(r).monto; });
  /* mi caja del mes: ingresos que me quedaron (repartos + movimientos míos) */
  const cajaMes=lista("caja").filter(x=>mesDe(x.fecha)===m && x.signo!==-1).reduce((t,x)=>t+(Number(x.monto)||0),0);
  mio += cajaMes;
  /* ---- estado de resultados del estudio (términos de administración) ---- */
  const facturacion       = honCobrados + facturacionRep;/* ingresos brutos: cobros + liquidaciones */
  const costosFijos       = gEst;                         /* costos de estructura del estudio */
  const costosCausas      = gastoCausas;                 /* costos por causa (recuperables del cobro) */
  const costosOp          = costosFijos + costosCausas;  /* costos operativos totales */
  const resultadoEstudio  = facturacion - costosOp;      /* resultado operativo */
  const resultadoEstruct  = facturacion - costosFijos;   /* resultado antes de costos por causa */
  const margen            = share(resultadoEstudio, facturacion);      /* margen operativo % */
  const margenEstruct     = share(resultadoEstruct, facturacion);
  return {mes:m, honCobrados, gastoCausas, otrosIng, gEst, gPer, mio,
          facturacion, costosFijos, costosCausas, costosOp,
          resultadoEstudio, resultadoEstruct, margen, margenEstruct,
          ingresoTotal:mio+otrosIng, resultado:mio+otrosIng-gEst-gPer};
}
/* acumulado del año calendario (para promedios y totales anuales) */
function resumenAnio(anio){
  const ms=mesesConDatos().filter(m=>m.slice(0,4)===String(anio));
  const t={facturacion:0,costosFijos:0,costosCausas:0,costosOp:0,resultadoEstudio:0,mio:0,otrosIng:0,meses:ms.length};
  ms.forEach(m=>{ const r=resumenMes(m); t.facturacion+=r.facturacion; t.costosFijos+=r.costosFijos;
    t.costosCausas+=r.costosCausas; t.costosOp+=r.costosOp; t.resultadoEstudio+=r.resultadoEstudio;
    t.mio+=r.mio; t.otrosIng+=r.otrosIng; });
  t.margen=share(t.resultadoEstudio,t.facturacion);
  t.promFact = t.meses? t.facturacion/t.meses : 0;
  t.promRes  = t.meses? t.resultadoEstudio/t.meses : 0;
  return t;
}

  },

  /* ======================= CAUSAS ======================= */
  est:"abierta", sel:{}, verOtros:false, orden:{col:"car",dir:1}, agrupar:true, soloArt:false, verArch:false,
  ordenar(col){ const o=this.orden; o.dir = o.col===col ? -o.dir : (col==="car"?1:-1); o.col=col; this.render(); },
  flecha(col){ return this.orden.col===col ? (this.orden.dir>0?" ▴":" ▾") : ""; },
  juzgadoDe(c){ return (c.juzgado&&c.juzgado.trim()) || juzgadoDir(c) || (c.extra?"Extrajudicial / sin juicio":"Sin juzgado asignado"); },
  /* guarda en cada causa el juzgado que sale del directorio (para que quede en los datos y el resumen) */
  asignarJuzgados(){
    let n=0;
    lista("causas").forEach(c=>{ if(c.juzgado&&c.juzgado.trim()) return; const j=juzgadoDir(c);
      if(j){ put("causas",Object.assign({},c,{juzgado:j})); n++; } });
    this.render();
    toast(n? "Asigné juzgado a "+n+" causa"+(n===1?"":"s") : "No encontré causas nuevas para asignar");
  },
  /* una fila (tr) de la tabla de causas */
  filaCausa(f){
    const {c,L,esp,mi,falta}=f;
    const es=estadoDe(c), ed=ESTADOS.find(x=>x.id===es);
    const due=c.clienteDe||"", av=L.bruto&&esp?Math.min(100,L.bruto/esp*100):0;
    return `<tr${this.sel[c.id]?' style="background:var(--surf2)"':""}>
      <td onclick="event.stopPropagation()"><input type="checkbox" ${this.sel[c.id]?"checked":""} onchange="App.selUno('${c.id}',this.checked)"></td>
      <td class="cau clk" onclick="App.verCausa('${c.id}')" title="${esc(c.carLarga||c.car)}">
        <div class="nm"><i class="bar" style="background:${due?colorSocio(due):"var(--line2)"}"></i>
          <b>${esc(nombreCausa(c))}</b>
          ${c.extra?'<span class="tag b" style="flex:0 0 auto" title="Extrajudicial">📋</span>':""}
          ${es!=="abierta"?'<span class="tag '+ed.tag+'" style="flex:0 0 auto">'+ed.ic+'</span>':""}</div>
        ${(()=>{const s=[c.cliente, c.extra?"extrajudicial":(this.agrupar?"":c.juzgado)].filter(Boolean).join(" · ");return s?'<div class="sub">'+esc(s)+'</div>':"";})()}</td>
      <td class="clk" onclick="App.verCausa('${c.id}')">${L.socios.map(s=>'<span class="dot" title="'+esc(nombreSocio(s))+'" style="background:'+colorSocio(s)+';margin-right:3px"></span>').join("")}</td>
      <td class="num clk" onclick="App.verCausa('${c.id}')">${L.totGastos?pes0(L.totGastos):'<span class="muted">—</span>'}</td>
      <td class="num clk" onclick="App.verCausa('${c.id}')">${c.montoProsperado?pes0(c.montoProsperado):'<span class="muted">—</span>'}</td>
      <td class="num clk" onclick="App.verCausa('${c.id}')">${L.bruto?pes0(L.bruto):'<span class="muted">—</span>'}
        ${esp&&L.bruto?'<div class="mini"><i style="width:'+av.toFixed(0)+'%;background:'+(av>=99.5?"var(--acc)":"var(--blue)")+'"></i></div>':""}</td>
      <td class="num clk" onclick="App.verCausa('${c.id}')" style="color:${falta?"var(--rose)":"var(--tx3)"}">${falta?pes0(falta):"—"}</td>
      <td class="num clk ${mi>0?"pos":""}" onclick="App.verCausa('${c.id}')">${mi?pes0(mi):'<span class="muted">—</span>'}</td>
      <td>${es!=="archivada"?'<button class="btn sm gh" title="Archivar" onclick="event.stopPropagation();App.estadoUno(\''+c.id+'\',\'archivada\')">📦</button>'
         :'<button class="btn sm gh" title="Desarchivar" onclick="event.stopPropagation();App.estadoUno(\''+c.id+'\',\'abierta\')">↩</button>'}</td></tr>`;
  },
  theadCausas(check){
    return `<thead><tr>
      <th style="width:32px">${check?'<input type="checkbox" onchange="App.selTodo(this.checked)" title="Tildar todas">':""}</th>
      <th class="cau clk" onclick="App.ordenar('car')">Causa${this.flecha("car")}</th>
      <th style="width:66px">Socios</th>
      <th class="num clk" style="width:104px" onclick="App.ordenar('gas')">Gastos${this.flecha("gas")}</th>
      <th class="num clk" style="width:122px" onclick="App.ordenar('pro')">Prosperó${this.flecha("pro")}</th>
      <th class="num clk" style="width:128px" onclick="App.ordenar('cob')">Cobrado${this.flecha("cob")}</th>
      <th class="num clk" style="width:124px" onclick="App.ordenar('fal')" title="Lo que falta cobrar según el monto por el que prosperó">Falta${this.flecha("fal")}</th>
      <th class="num clk" style="width:118px" onclick="App.ordenar('mi')">Mi parte${this.flecha("mi")}</th>
      <th style="width:36px"></th></tr></thead>`;
  },
  selIds(){ return Object.keys(this.sel).filter(k=>this.sel[k]); },
  selTodo(v){ (this._vis||[]).forEach(id=>this.sel[id]=v); this.render(); },
  selUno(id,v){ this.sel[id]=v; this.render(); },

  v_causas(){
    if(this.causaSel) return this.vDetalleCausa(this.causaSel);
    const todas=lista("causas");
    const f=(this.filtro||"").toLowerCase();
    const nArch=todas.filter(c=>estadoDe(c)==="archivada").length;
    let cs=todas.filter(c=> (this.verArch ? estadoDe(c)==="archivada" : estadoDe(c)!=="archivada") &&
      (!this.soloArt || esArtCausa(c)) &&
      (!f||((c.car||"")+" "+(c.cliente||"")+" "+(c.carLarga||"")).toLowerCase().includes(f)));
    this._vis = cs.map(c=>c.id);
    const tot=cs.reduce((t,c)=>{const e=estadoCausa(c.id); t.cob+=e.cobrado; t.gas+=e.gastos; t.mio+=e.miParte; return t;},{cob:0,gas:0,mio:0});
    const sel=this.selIds().filter(id=>DB.causas[id]);
    const todasTildadas = cs.length && cs.every(c=>this.sel[c.id]);
    /* lo que debería entrar por cada causa, según el monto por el que prosperó */
    const esperadoDe=c=>{ if(!c.montoProsperado) return 0; const R=calcReclamo(c); return R.cuotaLitis+R.honReg; };
    const filas=cs.map(c=>{
      const L=liquidar(c.id);
      const esp=esperadoDe(c);
      return {c, L, esp,
        mi: L.bruto ? (L.porSocio.find(s=>s.id==="s_jp")||{total:0}).total : 0,
        falta: esp? Math.max(0, esp-L.bruto) : 0};
    });
    const O=this.orden, val=f=>({car:0,gas:f.L.totGastos,pro:f.c.montoProsperado||0,cob:f.L.bruto,fal:f.falta,mi:f.mi}[O.col]);
    filas.sort((a,b)=> O.col==="car"
      ? O.dir*nombreCausa(a.c).localeCompare(nombreCausa(b.c),"es")
      : O.dir*(val(a)-val(b)) || nombreCausa(a.c).localeCompare(nombreCausa(b.c),"es"));
    this._vis = filas.map(f=>f.c.id);
    const T=filas.reduce((t,f)=>{ t.gas+=f.L.totGastos; t.cob+=f.L.bruto; t.esp+=f.esp; t.falta+=f.falta; t.mi+=f.mi; return t; },
      {gas:0,cob:0,esp:0,falta:0,mi:0});

    return `
    <div style="display:flex;gap:9px;flex-wrap:wrap;margin-bottom:11px;align-items:center">
      <input class="inp" style="max-width:280px" placeholder="Buscar causa o cliente…" value="${esc(this.filtro)}"
        oninput="App.filtro=this.value;clearTimeout(App._b);App._b=setTimeout(()=>App.render(),220)">
      <button class="chip ${this.soloArt?"on":""}" style="padding:5px 12px;font-size:12.5px" onclick="App.soloArt=!App.soloArt;App.sel={};App.render()">⚕️ Solo ART</button>
      ${nArch?`<button class="chip ${this.verArch?"on":""}" style="padding:5px 12px;font-size:12.5px" onclick="App.verArch=!App.verArch;App.sel={};App.render()">📦 Archivadas <span class="muted">${nArch}</span></button>`:""}
      <div style="flex:1"></div>
      <button class="chip ${this.agrupar?"on":""}" style="padding:5px 12px;font-size:12.5px" onclick="App.agrupar=!App.agrupar;App.render()">🏛 Por juzgado</button>
      <button class="btn sm" onclick="App.asignarJuzgados()" title="Guardar en cada causa el juzgado del directorio">🏛 Asignar juzgados</button>
      <button class="btn sm pri" onclick="App.fCausa()">＋ Causa</button>
    </div>

    ${sel.length? `<div class="card" style="margin-bottom:11px;border-color:var(--acc)"><div class="bd" style="display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding:10px 14px">
      <b style="font-size:13.5px">${sel.length} seleccionada${sel.length===1?"":"s"}</b>
      <div style="flex:1"></div>
      ${this.verArch?'<button class="btn sm" onclick="App.estadoMasivo(\'abierta\')">↩ Desarchivar</button>'
                    :'<button class="btn sm" onclick="App.estadoMasivo(\'archivada\')">📦 Archivar</button>'}
      <button class="btn sm dan" onclick="App.borrarMasivo()">🗑 Eliminar</button>
      <button class="btn sm gh" onclick="App.sel={};App.render()">Soltar</button>
    </div></div>`:""}

    ${ !cs.length
      ? '<div class="card"><div class="bd tight">'+(todas.length? '<div class="vacio"><span class="em">'+(this.verArch?"📦":"⚖")+'</span>No hay causas '+(this.verArch?"archivadas":(this.soloArt||f)?"que coincidan con el filtro":"activas")+'</div>'
          : '<div class="vacio"><span class="em">⚖</span>No hay causas todavía.<br><br><button class="btn pri" onclick="App.fCausa()">Cargar la primera</button></div>')+'</div></div>'
      : this.agrupar
        ? (()=>{
            const grupos={}; filas.forEach(f=>{ const j=this.juzgadoDe(f.c); (grupos[j]=grupos[j]||[]).push(f); });
            const fRank=j=>{const s=(j||"").toLowerCase(); if(/sin juzgado|extrajud/.test(s))return 9; if(/laboral/.test(s))return 0; if(/civil/.test(s))return 1; if(/familia/.test(s))return 2; if(/paz/.test(s))return 3; if(/contencioso/.test(s))return 4; return 5;};
            const fNom=j=>{const s=(j||"").toLowerCase(); if(/sin juzgado|extrajud/.test(s))return "Sin juzgado / extrajudicial"; if(/laboral/.test(s))return "Fuero Laboral"; if(/civil/.test(s))return "Fuero Civil"; if(/familia/.test(s))return "Fuero de Familia"; if(/paz/.test(s))return "Juzgados de Paz"; if(/contencioso/.test(s))return "Contencioso Administrativo"; return "Otros";};
            const orden=Object.keys(grupos).sort((a,b)=> fRank(a)-fRank(b) || a.localeCompare(b,"es"));
            let curF=null;
            return `<div class="card"><div class="bd tight"><div class="tblwrap"><table class="tbl cuad">
              ${this.theadCausas(false)}
              <tbody>${orden.map(j=>{ const fs=grupos[j]; let out="";
                const fn=fNom(j); if(fn!==curF){ curF=fn; out+='<tr class="grpf"><td colspan="9">'+esc(fn)+'</td></tr>'; }
                out+='<tr class="grp"><td colspan="9">🏛 '+esc(j)+' <span class="c">· '+fs.length+'</span></td></tr>'
                  + fs.map(f=>this.filaCausa(f)).join(""); return out; }).join("")}
              </tbody></table></div></div></div>`;
          })()
        : `<div class="card"><div class="bd tight"><div class="tblwrap"><table class="tbl cuad">
            ${this.theadCausas(true)}
            <tbody>${filas.map(f=>this.filaCausa(f)).join("")}</tbody>
            ${cs.length>1?`<tfoot><tr><td></td><td class="cau">Total de ${cs.length} causas</td><td></td>
              <td class="num">${pes0(T.gas)}</td><td class="num">${T.esp?pes0(T.esp):"—"}</td>
              <td class="num">${pes0(T.cob)}</td><td class="num" style="color:${T.falta?"var(--rose)":"inherit"}">${T.falta?pes0(T.falta):"—"}</td>
              <td class="num">${pes0(T.mi)}</td><td></td></tr></tfoot>`:""}
            </table></div></div></div>` }`;
  },

  /* ---- estado y acciones en bloque ---- */
  estadoUno(id,est){
    const c=DB.causas[id]; if(!c) return;
    put("causas",Object.assign({},c,{estado:est}));
    const e=ESTADOS.find(x=>x.id===est);
    toast(nombreCausa(c)+" → "+e.nom.toLowerCase()); this.render();
  },
  estadoMasivo(est){
    const ids=this.selIds(); if(!ids.length) return;
    ids.forEach(id=>{ const c=DB.causas[id]; if(c) put("causas",Object.assign({},c,{estado:est})); });
    this.sel={}; this.render();
    toast(ids.length+" causas → "+ESTADOS.find(x=>x.id===est).nom.toLowerCase());
  },
  borrarMasivo(){
    const ids=this.selIds(); if(!ids.length) return;
    const conDatos=ids.filter(id=>cobrosDe(id).length||gastosDe(id).length);
    this.confirmar("Se eliminan "+ids.length+" causas"+(conDatos.length?", y "+conDatos.length+" de ellas tienen cobros o gastos cargados que también se borran":"")+". Esto no se puede deshacer.",()=>{
      ids.forEach(id=>{
        gastosDe(id).forEach(g=>quitar("gastos",g.id));
        cobrosDe(id).forEach(c=>quitar("cobros",c.id));
        quitar("causas",id);
      });
      this.sel={}; this.render(); toast(ids.length+" causas eliminadas");
    });
  },

  verCausa(id){ this.causaSel=id; this.v="causas"; this.render(); $("#vista").scrollTop=0; },

  /* ===================== PLANILLA DE LA CAUSA =====================
     Una sola hoja, de izquierda a derecha y de arriba abajo:
     quién trae el cliente → qué se pagó para iniciar → qué se pagó en el proceso
     → qué se cobró → qué se deduce → cuánto le toca a cada uno.
     Todas las celdas se editan en el lugar; se guardan al salir del campo. */
  vDetalleCausa(id){
    const c=DB.causas[id];
    if(!c){ this.causaSel=null; $("#tit").textContent="Causas"; return this.v_causas(); }
    const L=liquidar(id), R=calcReclamo(c);
    const socs=lista("socios").filter(s=>s.activo!==false);
    const est=ESTADOS.find(x=>x.id===estadoDe(c));
    const mi=(L.porSocio.find(s=>s.id==="s_jp")||{total:0}).total;

    const optSoc=(sel,vacio)=>(vacio?'<option value="">'+esc(vacio)+'</option>':"")+
      socs.map(s=>'<option value="'+s.id+'"'+(sel===s.id?" selected":"")+'>'+esc(s.corto)+'</option>').join("");

    /* ---- una fila de gasto ---- */
    const filaGasto=(rub,g)=>{
      const vacia=!g;
      const uni=rub.un!=="$";
      const tipo=rub.un==="UF"?"uf":rub.un==="UP"?"up":"uma";
      const vUnidad=uni?valorVigente(tipo,(g&&g.fecha)||hoy()):0;
      const monto=g?montoGasto(g):0;
      const libre = rub.id==="otro";
      return `<tr class="${vacia?"vac":""}">
        <td class="lb">${libre
          ? '<span class="ic">'+rub.ic+'</span><input type="text" value="'+esc(g&&g.obs||"")+'" placeholder="Describí el gasto…" style="font-weight:600;min-width:180px" onchange="App.edGasto(\''+id+'\',\'otro\',\''+(g?g.id:"")+'\',\'obs\',this)">'
          : '<span class="ic">'+rub.ic+'</span>'+esc(rub.nom)+(uni&&!vUnidad?'<div class="small" style="color:var(--amber);font-weight:400">falta cargar el valor de la '+rub.un+'</div>':"")}</td>
        <td style="width:96px">${uni?`<input class="mo" type="text" value="${g?NF4.format(g.cant||0):""}" placeholder="0"
            onchange="App.edGasto('${id}','${rub.id}','${g?g.id:""}','cant',this)" title="Cantidad de ${rub.un}">`:'<span class="muted small" style="padding-left:8px">—</span>'}</td>
        <td style="width:140px"><select onchange="App.edGasto('${id}','${rub.id}','${g?g.id:""}','pagador',this)">
          ${optSoc(g?g.pagador:"s_jp")}</select></td>
        <td style="width:150px"><input type="date" value="${g?g.fecha:""}"
          onchange="App.edGasto('${id}','${rub.id}','${g?g.id:""}','fecha',this)"></td>
        <td class="mo" style="width:150px"><input type="text" value="${monto?nf(monto):""}" placeholder="0,00"
          onchange="App.edGasto('${id}','${rub.id}','${g?g.id:""}','monto',this)"
          title="${uni?(vUnidad?"Se calcula solo: "+NF4.format(g?g.cant:0)+" × "+pes(vUnidad)+". Si escribís un importe, manda el que escribas.":"Falta cargar el valor de la "+rub.un+" (tocá la barra de arriba)"):"Importe libre"}"></td>

        <td class="x">${g?'<button onclick="App.borrarGasto(\''+g.id+'\')" title="Borrar">✕</button>':""}</td></tr>`;
    };

    /* ---- bloque de gastos por etapa ---- */
    const bloqueGastos=(et,n)=>{
      const rubs=RUBROS.filter(r=>r.et===et.id);
      const gs=gastosDe(id).filter(g=>{const r=RUBROS.find(x=>x.id===g.rubro); return r&&r.et===et.id;});
      let filas="";
      rubs.forEach(r=>{
        const propios=gs.filter(g=>g.rubro===r.id);
        propios.forEach(g=>filas+=filaGasto(r,g));
        /* "otro" (gasto libre) siempre deja un renglón en blanco para sumar más */
        if(!propios.length || r.id==="otro") filas+=filaGasto(r,null);
      });
      const tot=gs.reduce((t,g)=>t+montoGasto(g),0);
      return `<div class="blk"><div class="t"><span class="n">${n}</span><h4>${esc(et.nom)}</h4><div class="sp"></div>
        <span class="tot">${tot?pes(tot):"—"}</span></div>
        <div class="plw"><table class="pl"><thead><tr>
          <th style="padding-left:12px">Concepto</th><th>Cantidad</th><th>Quién pagó</th><th>Cuándo</th><th style="text-align:right">Importe</th><th></th>
        </tr></thead><tbody>${filas}</tbody></table></div></div>`;
    };

    /* ---- una fila de cobro ---- */
    const filaCobro=(slot,nom,titular,bruto,nota)=>{
      const cb=this.cobroSlot(id,slot);
      const neto=cb?this.netoCobro(cb):0;
      const quita=cb?(Number(cb.monto)||0)-neto:0;
      return `<tr class="${cb?"":"vac"}">
        <td class="lb">${esc(nom)}${nota?'<div class="small muted" style="font-weight:400">'+esc(nota)+'</div>':""}</td>
        <td style="width:150px"><input type="date" value="${cb?cb.fecha:""}" onchange="App.edCobro('${id}','${slot}','fecha',this)"></td>
        <td class="mo" style="width:150px"><input type="text" value="${bruto?nf(bruto):""}" placeholder="0,00" disabled
          style="opacity:.75;cursor:default" title="Lo que debería cobrarse según el monto del reclamo"></td>
        <td class="mo" style="width:150px"><input type="text" value="${cb?nf(cb.monto):""}" placeholder="0,00"
          onchange="App.edCobro('${id}','${slot}','monto',this)" title="Lo que se cobró de verdad"></td>
        <td class="ro" style="width:130px;color:var(--rose)">${quita?"− "+pes(quita):"—"}</td>
        <td class="ro" style="width:150px"><b>${cb?pes(neto):"—"}</b></td>
        <td class="x">${cb?'<button onclick="App.fCobro(\''+cb.id+'\')" title="Ver el detalle" style="opacity:1;color:var(--tx3)">✎</button>':""}</td></tr>`;
    };

    const otrosCobros=cobrosDe(id).filter(x=>!x.slot);
    const socReg=c.socioReg||"";

    return `
    <button class="btn sm gh" style="margin-bottom:11px" onclick="App.causaSel=null;App.render()">← Volver a causas</button>

    <div class="card" style="margin-bottom:13px"><div class="bd" style="padding:14px 16px">
      <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start">
        <div style="flex:1;min-width:230px">
          <h2 style="margin:0 0 3px;font-size:17px;letter-spacing:-.3px">${esc(nombreCausa(c))}</h2>
          <div class="muted small">${esc(c.carLarga||c.car||"")}</div>
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">
          <span class="tag ${est.tag}">${est.ic} ${est.corto}</span>
          <button class="btn sm gh" onclick="App.fCausa('${id}')">✎ Datos</button>
          ${estadoDe(c)==="archivada"
            ? '<button class="btn sm gh" onclick="App.estadoUno(\''+id+'\',\'abierta\')">↩ Desarchivar</button>'
            : '<button class="btn sm gh" onclick="App.estadoUno(\''+id+'\',\'archivada\')">📦 Archivar</button>'}
          <button class="btn sm dan gh" onclick="App.borrarCausa('${id}')">🗑</button>
        </div>
      </div>
      <div class="grid g4" style="margin-top:13px;gap:10px">
        ${this.kpi("Gastos puestos",pes0(L.totGastos),"a recuperar","var(--amber)")}
        ${this.kpi("Cobrado",pes0(L.bruto),"honorarios y cuota litis","var(--blue)")}
        ${this.kpi("Neto a repartir",L.bruto?pes0(L.neto):"—",L.bruto?"entre "+L.socios.length:"sin cobros aún","var(--viol)")}
        ${this.kpi("Mi parte",L.bruto?pes0(mi):"—","parte + gastos","var(--acc)")}
      </div>
    </div>

    <div class="blk"><div class="t"><span class="n">0</span><h4>${c.extra?"Datos del trámite":"Antes del juicio"}</h4><div class="sp"></div>
      <div class="chips" style="gap:5px">
        <button type="button" class="chip ${!c.extra?"on":""}" style="padding:4px 12px;font-size:12px" onclick="App.edCausaVal('${id}','extra',false)">⚖ Judicial</button>
        <button type="button" class="chip ${c.extra?"on":""}" style="padding:4px 12px;font-size:12px" onclick="App.edCausaVal('${id}','extra',true)">📋 Extrajudicial</button>
      </div></div>
      <div class="plw"><table class="pl pf"><tbody>
        <tr><td class="lb">Nombre corto</td>
          <td colspan="2"><input type="text" value="${esc(c.corto||"")}" placeholder="${esc(sintetizar(c.car))}"
            onchange="App.edCausa('${id}','corto',this)" title="Si lo dejás vacío se arma solo con la carátula"></td>
          <td class="lb">Carátula completa</td>
          <td colspan="2"><input type="text" value="${esc(c.carLarga||c.car||"")}"
            onchange="App.edCausa('${id}','carLarga',this)"></td></tr>
        <tr><td class="lb">Cliente</td>
          <td colspan="2"><input type="text" value="${esc(c.cliente||"")}" placeholder="Nombre del cliente"
            onchange="App.edCausa('${id}','cliente',this)"></td>
          <td class="lb">El cliente es de</td>
          <td colspan="2"><select onchange="App.edCausa('${id}','clienteDe',this)">
            <option value="">— sin definir —</option>
            <option value="estudio"${c.clienteDe==="estudio"?" selected":""}>Del estudio</option>
            ${optSoc(c.clienteDe)}</select></td></tr>
        <tr><td class="lb">Socios que se reparten</td>
          <td colspan="2"><div class="chips" style="padding:4px 2px">
            ${socs.map(s=>`<button type="button" class="chip ${(c.socios||[]).includes(s.id)?"on":""}" style="padding:4px 11px;font-size:12px"
              onclick="App.toggleSocio('${id}','${s.id}')">${esc(s.corto)}</button>`).join("")}</div></td>
          <td class="lb">Pacto de cuota litis</td>
          <td colspan="2"><div style="display:flex;gap:5px;align-items:center;padding:2px">
            ${[15,20].map(v=>`<button type="button" class="chip ${parseNum(c.porcCuotaLitis)===v?"on":""}" style="padding:4px 12px;font-size:12px"
              onclick="App.edCausaVal('${id}','porcCuotaLitis',${v})">${v} %</button>`).join("")}
            <input type="text" class="mo" style="width:74px;text-align:right" value="${NF4.format(c.porcCuotaLitis!=null?c.porcCuotaLitis:DB.cfg.porcCuotaLitisDef)}"
              onchange="App.edCausa('${id}','porcCuotaLitis',this)"><span class="muted small">%</span></div></td></tr>
      </tbody></table></div></div>

    ${c.extra
      ? bloqueGastos({id:"otros",nom:"Gastos del trámite"},1)
      : bloqueGastos(ETAPAS_GASTO[0],1)+bloqueGastos(ETAPAS_GASTO[1],2)+
        (gastosDe(id).some(g=>{const r=RUBROS.find(x=>x.id===g.rubro);return r&&r.et==="otros";})||this.verOtros?bloqueGastos(ETAPAS_GASTO[2],3)
         :'<div style="margin:-6px 0 13px"><button class="btn sm gh" onclick="App.verOtros=true;App.render()">＋ Agregar otros gastos (traslados, cédulas…)</button></div>')}

    <div class="blk"><div class="t"><span class="n">4</span><h4>${c.extra?"Cobros del trámite":"Al cobrar"}</h4><div class="sp"></div>
      <span class="tot">${L.bruto?pes(L.bruto):"—"}</span></div>
      ${c.extra? `
      <div class="plw"><table class="pl"><thead><tr>
        <th style="padding-left:12px">Qué se cobró</th><th>Cuándo</th><th style="text-align:right">Monto</th>
        <th style="text-align:right">Le descuentan</th><th style="text-align:right">Entra a la cuenta</th><th></th>
      </tr></thead><tbody>
        ${cobrosDe(id).length? cobrosDe(id).sort((a,b)=>a.fecha<b.fecha?-1:1).map(x=>{const nt=this.netoCobro(x);return `<tr>
          <td class="lb" style="font-weight:400">${esc(x.obs||"Honorarios")}</td>
          <td class="small muted">${fFec(x.fecha)}</td><td class="ro">${pes(x.monto)}</td>
          <td class="ro" style="color:${x.monto-nt>0?"var(--rose)":"var(--tx3)"}">${x.monto-nt>0?"− "+pes(x.monto-nt):"—"}</td>
          <td class="ro"><b>${pes(nt)}</b></td>
          <td class="x"><button onclick="App.fCobro('${x.id}')" style="opacity:1;color:var(--tx3)">✎</button></td></tr>`;}).join("")
          : '<tr class="vac"><td colspan="6" class="lb" style="font-weight:400;color:var(--tx3);padding:14px 12px">Todavía no cargaste cobros. Usá «＋ Cobro».</td></tr>'}
      </tbody></table></div>
      <div style="padding:9px 14px;border-top:1px solid var(--line)">
        <button class="btn sm pri" onclick="App.fCobro(null,'${id}')">＋ Cobro</button>
      </div>`
      : `
      <div class="plw"><table class="pl"><tbody>
        <tr><td class="lb">Prosperó por</td>
          <td class="mo" colspan="2"><input type="text" value="${c.montoProsperado?nf(c.montoProsperado):""}" placeholder="0,00"
            onchange="App.edCausa('${id}','montoProsperado',this)" title="Capital más intereses, como salió de la sentencia o del acuerdo"></td>
          <td class="lb">% regulados</td>
          <td class="mo"><input type="text" value="${NF4.format(c.porcRegulado!=null?c.porcRegulado:DB.cfg.porcReguladoDef)}"
            onchange="App.edCausa('${id}','porcRegulado',this)"></td>
          <td colspan="2"></td></tr>
        ${c.montoProsperado?`<tr><td class="lb" style="font-weight:400" colspan="7">
          <span class="small muted">Al cliente le llega ${pes(R.netoCliente)} (le descuentan ${pes(R.dCap.total)} de sellado y acción social) y le quedan ${pes(R.leQueda)} después de la cuota litis.</span></td></tr>`:""}
      </tbody></table></div>

      <div class="plw"><table class="pl"><thead><tr>
        <th style="padding-left:12px">Qué se cobra</th><th>Cuándo</th><th style="text-align:right">Debería ser</th>
        <th style="text-align:right">Se cobró</th><th style="text-align:right">Le descuentan</th><th style="text-align:right">Entra a la cuenta</th><th></th>
      </tr></thead><tbody>
        ${filaCobro("cl","Pacto de cuota litis","estudio",R.cuotaLitis,NF4.format(R.pCl)+" % · lo paga el cliente")}
        ${filaCobro("reg_mi","Honorarios regulados a mi nombre","estudio",R.honEst,"a cargo de la demandada")}
        <tr><td class="lb">Socio con regulación propia</td>
          <td colspan="2"><select onchange="App.edCausa('${id}','socioReg',this)">
            ${optSoc(socReg,"— ninguno —")}</select></td>
          <td class="lb" style="font-weight:400"><span class="small muted">% de la regulación</span></td>
          <td class="mo"><input type="text" value="${NF4.format(c.porcSocioReg!=null?c.porcSocioReg:DB.cfg.porcEugeniaDef)}"
            onchange="App.edCausa('${id}','porcSocioReg',this)"></td><td colspan="2"></td></tr>
        ${socReg?filaCobro("reg_soc","Honorarios regulados de "+nombreSocio(socReg),socReg,R.honSoc,
          (socioDe(socReg)&&socioDe(socReg).ret||[]).length?"se le aplican sus impuestos":"solo sellado y acción social"):""}
        ${otrosCobros.map(x=>`<tr><td class="lb" style="font-weight:400">${x.concepto==="cl"?"Cuota litis":x.concepto==="reg"?"Regulados":"Otro"} · ${esc(x.obs||"suelto")}</td>
          <td class="small muted">${fFec(x.fecha)}</td><td class="ro muted">—</td><td class="ro">${pes(x.monto)}</td>
          <td class="ro">—</td><td class="ro"><b>${pes(this.netoCobro(x))}</b></td>
          <td class="x"><button onclick="App.fCobro('${x.id}')" style="opacity:1;color:var(--tx3)">✎</button></td></tr>`).join("")}
        <tr class="tot"><td class="lb">Total cobrado</td><td></td>
          <td class="ro">${c.montoProsperado?pes(R.cuotaLitis+R.honReg):"—"}</td>
          <td class="ro">${pes(L.bruto)}</td><td class="ro" style="color:var(--rose)">${L.totRet?"− "+pes(L.totRet):"—"}</td>
          <td class="ro"><b>${pes(L.bruto-L.totRet)}</b></td><td></td></tr>
      </tbody></table></div>
      <div style="padding:9px 14px;border-top:1px solid var(--line)">
        <button class="btn sm gh" onclick="App.fCobro(null,'${id}')">＋ Cobro suelto</button>
        ${c.montoProsperado&&!cobrosDe(id).length?'<button class="btn sm pri" onclick="App.registrarReclamo(\''+id+'\')">Cargar los cobros calculados</button>':""}
      </div>`}
    </div>

    ${!L.bruto? `<div class="blk"><div class="t"><span class="n">5</span><h4>Deducciones y reparto</h4></div>
      <div style="padding:22px 18px;text-align:center;color:var(--tx3)">
        Todavía no hay nada cobrado, así que no hay reparto que hacer.
        ${L.totGastos?'<div class="small" style="margin-top:8px">Hay <b>'+pes(L.totGastos)+'</b> en gastos puestos que se recuperan cuando entre el cobro'+(Object.keys(L.porSocioGasto).length?" ("+Object.keys(L.porSocioGasto).map(s=>nombreSocio(s)+" "+pes0(L.porSocioGasto[s])).join(", ")+")":"")+'.</div>':""}
      </div></div>`
    : `<div class="blk"><div class="t"><span class="n">5</span><h4>Deducciones y reparto</h4><div class="sp"></div>
      <span class="tot">${pes(L.neto)}</span></div>
      <div class="plw"><table class="pl"><tbody>
        <tr><td class="lb">Masa cobrada</td><td colspan="4"></td><td class="ro"><b>${pes(L.bruto)}</b></td><td class="x"></td></tr>
        <tr><td class="lb" style="font-weight:400">Impuestos de los socios sobre sus regulados</td><td colspan="4"></td>
          <td class="ro" style="color:var(--rose)">− ${pes(L.totRet)}</td><td class="x"></td></tr>
        <tr><td class="lb" style="font-weight:400">Informante</td>
          <td class="mo" style="width:96px"><input type="text" value="${NF4.format(L.porcInf)}"
            onchange="App.edCausa('${id}','porcInformante',this)"></td>
          <td class="muted small">% de ${pes0(L.baseInf)}</td><td colspan="2"></td>
          <td class="ro" style="color:var(--rose)">− ${pes(L.informante)}</td><td class="x"></td></tr>
        <tr><td class="lb" style="font-weight:400">Devolución de gastos</td>
          <td colspan="4" class="small muted">${Object.keys(L.porSocioGasto).map(s=>nombreSocio(s)+" "+pes0(L.porSocioGasto[s])).join(" · ")||"sin gastos"}</td>
          <td class="ro" style="color:var(--rose)">− ${pes(L.totGastos)}</td><td class="x"></td></tr>
        <tr class="tot"><td class="lb">Neto a repartir entre ${L.socios.length} socio${L.socios.length>1?"s":""}</td>
          <td colspan="4"></td><td class="ro">${pes(L.neto)}</td><td class="x"></td></tr>
      </tbody></table></div>

      <div class="plw"><table class="pl"><thead><tr>
        <th style="padding-left:12px">Socio</th><th style="text-align:right">%</th><th style="text-align:right">Su parte</th>
        <th style="text-align:right">Gastos que puso</th><th style="text-align:right">Le toca</th>
        <th style="text-align:right">Ya cobró</th><th style="text-align:right">Falta mover</th>
      </tr></thead><tbody>
        ${L.porSocio.map(s=>`<tr>
          <td class="lb"><span class="dot" style="background:${s.color};margin-right:7px"></span>${esc(s.nombre)}</td>
          <td class="mo" style="width:96px">${L.socios.includes(s.id)?`<input type="text" value="${NF4.format(s.porc)}"
            onchange="App.edReparto('${id}','${s.id}',this)">`:'<span class="ro muted">—</span>'}</td>
          <td class="ro">${pes(s.parte)}</td><td class="ro">${s.gastos?pes(s.gastos):"—"}</td>
          <td class="ro"><b style="color:${s.color}">${pes(s.total)}</b></td>
          <td class="ro muted">${pes(s.enMano)}</td>
          <td class="ro" style="color:${Math.abs(s.saldo)<1?"var(--tx3)":s.saldo>0?"var(--acc)":"var(--amber)"}">
            ${Math.abs(s.saldo)<1?"al día":(s.saldo>0?"cobrar ":"devolver ")+pes(Math.abs(s.saldo))}</td></tr>`).join("")}
        ${L.informante?`<tr><td class="lb" style="font-weight:400"><span class="dot" style="background:var(--tx3);margin-right:7px"></span>Informante</td>
          <td colspan="3"></td><td class="ro"><b>${pes(L.informante)}</b></td><td class="ro muted">—</td>
          <td class="ro" style="color:var(--amber)">pagar</td></tr>`:""}
      </tbody></table></div>
      <div style="padding:9px 14px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn sm gh" onclick="App.imprimirLiq('${id}')">🖨 Informe para socios</button>
        <button class="btn sm gh" onclick="App.repIguales('${id}')">Partes iguales</button>
      </div>
    </div>`}`;
  },

  /* ---- edición en la propia planilla ---- */
  edCausa(id,campo,el){
    const c=DB.causas[id]; if(!c) return;
    const num=["porcCuotaLitis","porcRegulado","porcInformante","porcSocioReg","montoProsperado"].includes(campo);
    put("causas",Object.assign({},c,{[campo]: num?parseNum(el.value):el.value}));
    this.render();
  },
  edCausaVal(id,campo,valor){
    const c=DB.causas[id]; if(!c) return;
    put("causas",Object.assign({},c,{[campo]:valor})); this.render();
  },
  toggleSocio(id,sid){
    const c=DB.causas[id]; if(!c) return;
    const s=(c.socios||[]).slice(), k=s.indexOf(sid);
    if(k>=0){ if(s.length===1) return toast("Tiene que quedar al menos un socio",true); s.splice(k,1); }
    else s.push(sid);
    const rep={}; s.forEach(x=>rep[x]=100/s.length);
    put("causas",Object.assign({},c,{socios:s,reparto:rep})); this.render();
  },
  edReparto(id,sid,el){
    const c=DB.causas[id]; if(!c) return;
    const rep=Object.assign({},repartoDe(c)); rep[sid]=parseNum(el.value);
    put("causas",Object.assign({},c,{reparto:rep})); this.render();
  },
  repIguales(id){
    const c=DB.causas[id]; if(!c) return;
    const rep={}; (c.socios||["s_jp"]).forEach(s=>rep[s]=100/(c.socios||["s_jp"]).length);
    put("causas",Object.assign({},c,{reparto:rep})); this.render();
  },
  edGasto(cid,rubro,gid,campo,el){
    let g = gid? Object.assign({},DB.gastos[gid]) : null;
    const v=el.value;
    if(!g){
      if((campo==="monto"||campo==="cant") && !parseNum(v)) return;
      if(campo==="fecha" && !v) return;
      if(campo==="obs" && !v.trim()) return;
      g={id:uid("gas"),causa:cid,rubro,fecha:hoy(),cant:1,monto:0,manual:false,pagador:"s_jp",obs:""};
    }
    if(campo==="fecha") g.fecha=v;
    else if(campo==="pagador") g.pagador=v;
    else if(campo==="obs") g.obs=v;
    else if(campo==="cant"){ g.cant=parseNum(v); g.manual=false; }
    else if(campo==="monto"){ g.monto=parseNum(v); g.manual=true; }
    if(!g.manual){ const m=montoGasto(g); if(m) g.monto=m; }
    put("gastos",g); this.render();
  },
  borrarGasto(gid){
    const g=DB.gastos[gid]; if(!g) return;
    quitar("gastos",gid); this.render(); toast("Gasto borrado");
  },
  cobroSlot(cid,slot){ return cobrosDe(cid).find(x=>x.slot===slot)||null; },
  netoCobro(cb){
    if(cb.comp && Number(cb.comp.neto)) return Number(cb.comp.neto);
    const t=cb.titular||"estudio";
    const s=t!=="estudio"?socioDe(t):null;
    if(s && s.ret && s.ret.length) return calcRetenciones(s,cb.monto).neto;
    /* el sellado y la acción social los descuenta el libramiento judicial;
       la cuota litis la paga el cliente directo, así que no lleva ese descuento */
    if(cb.concepto==="reg") return (Number(cb.monto)||0) - descuentoLibramiento(cb.monto).total;
    return Number(cb.monto)||0;
  },
  edCobro(cid,slot,campo,el){
    const c=DB.causas[cid]; if(!c) return;
    let cb=this.cobroSlot(cid,slot);
    const v=el.value;
    if(!cb){
      if(campo==="monto" && !parseNum(v)) return;
      const esCl=slot==="cl";
      cb={id:uid("cob"),causa:cid,slot,fecha:hoy(),concepto:esCl?"cl":"reg",monto:0,
          medio:esCl?"Transferencia":"Depósito judicial",
          titular: slot==="reg_soc"?(c.socioReg||"estudio"):"estudio",
          obs: esCl?"Pacto de cuota litis":slot==="reg_mi"?"Honorarios regulados del estudio":"Honorarios regulados del socio"};
    } else cb=Object.assign({},cb);
    if(campo==="fecha") cb.fecha=v;
    else if(campo==="monto"){
      cb.monto=parseNum(v);
      if(cb.comp){ cb.comp=null; delete cb.comp; }   /* el importe manda sobre un comprobante viejo */
    }
    if(slot==="reg_soc") cb.titular=c.socioReg||"estudio";
    if(slot!=="cl" && cb.titular==="estudio"){
      const d=descuentoLibramiento(cb.monto);
      cb.comp={solicitado:cb.monto,iva:0,gcias:0,dgr:0,sellado:DB.cfg.librSellado,accion:DB.cfg.librAccion,
               otros:d.porc,neto:cb.monto-d.total};
    }
    put("cobros",cb); this.render();
  },

  /* ---- liquidación del reclamo: de la sentencia a lo que cobra cada uno ---- */
  tarjetaReclamo(c){
    const id=c.id;
    if(!c.montoProsperado) return `

    return `

            <div class="ln"><span class="tt"><b>Le llega a la cuenta</b></span><span class="am">${pes(R.netoCliente)}</span></div>
            <div class="ln ded"><span class="tt">Cuota litis que le cobramos (${NF4.format(R.pCl)} % de ${pes0(R.base)})</span><span class="am">− ${pes(R.cuotaLitis)}</span></div>
            <div class="ln fin"><span class="tt"><b>Le queda al cliente</b></span><span class="am">${pes(R.leQueda)}</span></div>

        <div>
          <div class="small muted" style="font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin-bottom:8px">El estudio</div>
          <div class="casc">
            <div class="ln sum"><span class="tt">Honorarios regulados (${NF4.format(R.pReg)} %)</span><span class="am">${pes(R.honReg)}</span></div>
            ${R.libr.map(l=>`
              <div class="ln"><span class="tt">${esc(l.nom)}</span><span class="am">${pes(l.bruto)}</span></div>
              ${l.filas.map(f=>`<div class="ln det"><span class="tt">${esc(f.nom)} <span class="muted">· ${esc(f.det)}</span></span>
                <span class="am" style="color:${f.monto<0?"var(--rose)":"var(--acc)"}">${f.monto<0?"− ":"+ "}${pes(Math.abs(f.monto))}</span></div>`).join("")}
              <div class="ln det"><span class="tt"><b>le entra</b></span><span class="am" style="color:var(--acc)">${pes(l.neto)}</span></div>`).join("")}
            <div class="ln"><span class="tt">Cuota litis del cliente</span><span class="am">${pes(R.cuotaLitis)}</span></div>
            <div class="ln fin"><span class="tt"><b>Masa a repartir entre socios</b></span><span class="am">${pes(R.masa)}</span></div>

        </div>
      </div></div></div>`;
  },
  fReclamo(id){
    const c=DB.causas[id]; if(!c) return;
    this.modal({t:"Por cuánto prosperó el reclamo",ancho:true,b:`
      <label class="f"><span>Monto de la sentencia o del acuerdo</span>
        <input class="inp money" id="fr_m" value="${c.montoProsperado?nf(c.montoProsperado):""}" placeholder="0,00" oninput="App.reclamoVista('${id}')">
        <span style="text-transform:none;letter-spacing:0;font-weight:400;color:var(--tx3);font-size:12px;margin-top:5px;display:block">Capital más intereses.</span></label>
      <div class="frow c2">
        <label class="f"><span>% honorarios regulados</span><input class="inp money" id="fr_preg" value="${NF4.format(c.porcRegulado!=null?c.porcRegulado:DB.cfg.porcReguladoDef)}" oninput="App.reclamoVista('${id}')"></label>
        <label class="f"><span>% cuota litis pactada</span>
          <div style="display:flex;gap:6px">
            <button type="button" class="btn sm" onclick="document.getElementById('fr_pcl').value='15';App.reclamoVista('${id}')">15</button>
            <button type="button" class="btn sm" onclick="document.getElementById('fr_pcl').value='20';App.reclamoVista('${id}')">20</button>
            <input class="inp money" id="fr_pcl" value="${NF4.format(c.porcCuotaLitis!=null?c.porcCuotaLitis:DB.cfg.porcCuotaLitisDef)}" oninput="App.reclamoVista('${id}')">
          </div></label>

      <div id="fr_v"></div>`,
      p:'<button class="btn" onclick="App.cerrar()">Cancelar</button><button class="btn pri" onclick="App.gReclamo(\''+id+'\')">Guardar</button>'});
    this.reclamoVista(id);

  reclamoVista(id){
    const n=document.getElementById("fr_v"); if(!n) return;
    const c=Object.assign({},DB.causas[id],{montoProsperado:parseNum(val("fr_m")),
      porcRegulado:parseNum(val("fr_preg")), porcCuotaLitis:parseNum(val("fr_pcl"))});
    if(!c.montoProsperado){ n.innerHTML='<div class="small muted">Escribí el monto y te muestro el reparto.</div>'; return; }
    const R=calcReclamo(c);
    n.innerHTML=`<div class="casc" style="background:var(--surf2);border:1px solid var(--line);border-radius:12px;padding:10px">

      <div class="ln sum"><span class="tt">Masa a repartir</span><span class="am">${pes(R.masa)}</span></div></div>`;

  gReclamo(id){
    const c=DB.causas[id]; if(!c) return;
    put("causas",Object.assign({},c,{montoProsperado:parseNum(val("fr_m")),
      porcRegulado:parseNum(val("fr_preg")), porcCuotaLitis:parseNum(val("fr_pcl"))}));
    this.cerrar(); this.render(); toast("Monto guardado");
  },
  registrarReclamo(id){
    const c=DB.causas[id]; if(!c||!c.montoProsperado) return;
    const R=calcReclamo(c);
    this.confirmar("Voy a crear los cobros de esta liquidación: la cuota litis y un libramiento de honorarios por cada titular. Después los podés editar uno por uno.",()=>{
      const f=hoy();
      if(R.cuotaLitis>0) put("cobros",{id:uid("cob"),fecha:f,causa:id,concepto:"cl",monto:R.cuotaLitis,
        medio:"Transferencia",titular:"estudio",obs:"Cuota litis "+NF4.format(R.pCl)+" % sobre "+pes0(R.base)});
      R.libr.forEach(l=>{
        const o={id:uid("cob"),fecha:f,causa:id,concepto:"reg",monto:l.bruto,medio:"Depósito judicial",
          titular:l.titular,obs:l.nom};
        if(!l.perfil){ const d=descuentoLibramiento(l.bruto);
          o.comp={solicitado:l.bruto,iva:0,gcias:0,dgr:0,sellado:DB.cfg.librSellado,accion:DB.cfg.librAccion,
                  otros:d.porc,neto:l.neto}; }
        put("cobros",o);
      });
      this.render(); toast("Cobros registrados");
    });
  },

  compToggle(){
    const w=document.getElementById("fb_compWrap"); if(!w) return;
    const esSocio = val("fb_tit")!=="estudio";
    w.classList.toggle("hide",!esSocio);
    if(!esSocio){ const c=document.getElementById("fb_comp"); if(c) c.checked=false; }
  },
  compCalc(){
    const r=document.getElementById("fb_c_res"); if(!r) return;
    if(!chk("fb_comp")) return;
    const sol=parseNum(val("fb_c_sol"));
    const d=["fb_c_iva","fb_c_gci","fb_c_dgr","fb_c_sel","fb_c_acc","fb_c_otr"].reduce((t,k)=>t+parseNum(val(k)),0);
    const hon=sol/1.21, neto=sol-d;
    const m=document.getElementById("fb_mon"); if(m && sol) m.value=nf(hon);
    r.innerHTML = sol? `Honorario sin IVA: <b>${pes(hon)}</b> · IVA: ${pes(sol-hon)}<br>
      Retenciones y gastos: <b style="color:var(--rose)">${pes(d)}</b><br>
      Le entra en la cuenta: <b style="color:var(--acc);font-size:14px">${pes(neto)}</b>
      <span class="muted">(${NF4.format(hon?neto/hon*100:0)} % del honorario)</span>`
      : '<span class="muted">Escribí el monto solicitado del comprobante.</span>';
  },
  pickChip(b){ [...b.parentNode.children].forEach(c=>c.classList.remove("on")); b.classList.add("on"); },
  chipVal(sel){ const b=document.querySelector(sel+" .chip.on"); return b?b.dataset.v:""; },
  cobCauSel(){
    const nueva=val("fb_cau")==="__nueva", w=document.getElementById("fb_caunom_wrap");
    if(w) w.style.display=nueva?"":"none";
    if(nueva){ const i=document.getElementById("fb_caunom"); if(i) setTimeout(()=>i.focus(),40); }
  },
  gCobro(id){
    let causa=val("fb_cau");
    if(causa==="__nueva"){
      const nom=(val("fb_caunom")||"").trim();
      if(!nom) return toast("Escribí el nombre de la causa nueva",true);
      causa=uid("cau");
      put("causas",{id:causa,car:nom,carLarga:nom,corto:nom,cliente:"",extra:true,estado:"abierta",socios:["s_jp"],reparto:{s_jp:100}});
    }
    if(!causa) return toast("Elegí la causa",true);
    const monto=parseNum(val("fb_mon")); if(!monto) return toast("Falta el monto",true);
    const base={fecha:val("fb_fec"), causa, concepto:this.chipVal("#fb_con")||"reg", medio:val("fb_med"), obs:val("fb_obs").trim()};
    if(!id && chk("fb_div")){
      const sid=val("fb_divS"), p=parseNum(val("fb_divP"))/100;
      const mS=monto*p, mE=monto-mS;
      put("cobros",Object.assign({id:uid("cob")},base,{monto:mS,titular:sid,obs:(base.obs?base.obs+" · ":"")+"parte del socio ("+NF4.format(p*100)+" %)"}));
      put("cobros",Object.assign({id:uid("cob")},base,{monto:mE,titular:"estudio",obs:(base.obs?base.obs+" · ":"")+"parte del estudio"}));
      this.cerrar(); toast("Cobro dividido y guardado"); return this.render();
    }
    const o = id? Object.assign({},DB.cobros[id]) : {id:uid("cob")};
    Object.assign(o,base,{monto,titular:val("fb_tit")});
    if(chk("fb_comp")){
      const sol=parseNum(val("fb_c_sol"));
      const c={solicitado:sol, iva:parseNum(val("fb_c_iva")), gcias:parseNum(val("fb_c_gci")), dgr:parseNum(val("fb_c_dgr")),
        sellado:parseNum(val("fb_c_sel")), accion:parseNum(val("fb_c_acc")), otros:parseNum(val("fb_c_otr"))};
      c.neto = sol - c.iva - c.gcias - c.dgr - c.sellado - c.accion - c.otros;
      o.comp = c;
    } else delete o.comp;
    put("cobros",o); this.cerrar(); toast("Cobro guardado"); this.render();
  },

  /* ---- alta rápida de varios gastos de una misma causa en un solo acto ---- */
  gasLineas:[],

        <label class="f"><span>Causa</span><select class="inp" id="fgb_cau" onchange="App.gasCauSel()">
          <option value="">— elegir causa —</option>

          ${this.optCausas(causaPre||"")}</select></label>

      <label class="f"><span>¿Quién puso la plata?</span><select class="inp" id="fgb_pag">${this.optSocios("s_jp",false)}</select></label>
      <div style="font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--tx3);font-weight:700;margin:8px 0 8px">Gastos pagados</div>
      <div id="fgb_lineas"></div>
      <button class="btn sm" type="button" onclick="App.gasAddLinea()" style="margin:2px 0 14px">＋ Cargar otro gasto</button>
      <div style="display:flex;justify-content:space-between;align-items:center;background:var(--surf2);border:1px solid var(--line);border-radius:12px;padding:11px 15px;margin-bottom:12px">
        <span style="font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--tx3);font-weight:700">Total a guardar · <span id="fgb_count">1 gasto</span></span>
        <b id="fgb_total" style="font-size:19px;font-variant-numeric:tabular-nums">$ 0</b>
      </div>
      <label class="f"><span>Observación común (opcional)</span><input class="inp" id="fgb_nota" placeholder="Se agrega a todos; si cargás varios, la app enumera cada ítem sola"></label>

        <input type="checkbox" id="fgb_nore"> No descontarlo del reparto (lo absorbe el estudio)</label>`,
      p:`<button class="btn" onclick="App.cerrar()">Cancelar</button>
         <button class="btn pri" onclick="App.gGastoBatch()">Guardar</button>`});

  },
  gasLineaHTML(i){
    const L=this.gasLineas[i]||{};
    const opts=RUBROS.map(r=>'<option value="'+r.id+'"'+(r.id===L.rubro?" selected":"")+'>'+r.ic+"  "+esc(r.nom)+'</option>').join("");
    return `<div class="gasln">
      <div class="gaslnhd"><b>Gasto ${i+1}</b><div class="sp" style="flex:1"></div>
        ${this.gasLineas.length>1?'<button class="x" type="button" title="Quitar este gasto" onclick="App.gasDelLinea('+i+')">✕</button>':""}</div>
      <label class="f" style="margin-bottom:9px"><span>Rubro</span>
        <select class="inp" id="fgl_rub_${i}" onchange="App.gasCalc(${i})">${opts}</select></label>
      <div class="frow c2" style="margin-bottom:7px">
        <label class="f" style="margin:0"><span id="fgl_lb_${i}">Cantidad</span>
          <input class="inp money" id="fgl_cant_${i}" value="${NF4.format(L.cant||1)}" oninput="App.gasCalc(${i})"></label>
        <label class="f" style="margin:0"><span>Importe</span>
          <input class="inp money" id="fgl_mon_${i}" value="${L.monto?nf(L.monto):""}" placeholder="0,00"
            oninput="var c=document.getElementById('fgl_man_${i}');if(c)c.checked=true;App.gasTotal()"></label>
      </div>
      <label style="display:flex;gap:7px;align-items:center;font-size:12.5px;cursor:pointer">
        <input type="checkbox" id="fgl_man_${i}" ${L.manual?"checked":""} onchange="App.gasCalc(${i})"> Fijar el importe a mano</label>
      <label class="f" style="margin:7px 0 0"><span>¿De qué es? (opcional)</span>
        <input class="inp" id="fgl_obs_${i}" value="${esc(L.obs||"")}" placeholder="Ej: edicto Boletín Oficial 3 días, oficio al Registro…"></label>
      <div id="fgl_calc_${i}" class="small muted" style="margin-top:4px"></div>
    </div>`;
  },
  renderGasLineas(){
    const box=document.getElementById("fgb_lineas"); if(!box) return;
    box.innerHTML=this.gasLineas.map((_,i)=>this.gasLineaHTML(i)).join("");
    this.gasLineas.forEach((_,i)=>this.gasCalc(i));
  },
  gasSyncLineas(){
    this.gasLineas.forEach((L,i)=>{
      const r=document.getElementById("fgl_rub_"+i); if(!r) return;
      L.rubro=r.value; L.cant=parseNum(val("fgl_cant_"+i)); L.monto=parseNum(val("fgl_mon_"+i)); L.manual=chk("fgl_man_"+i); L.obs=(val("fgl_obs_"+i)||"").trim();
    });
  },
  gasCauSel(){
    const nueva=val("fgb_cau")==="__nueva", w=document.getElementById("fgb_caunom_wrap");
    if(w) w.style.display=nueva?"":"none";
    if(nueva){ const i=document.getElementById("fgb_caunom"); if(i) setTimeout(()=>i.focus(),40); }
  },
  gasAddLinea(){ this.gasSyncLineas(); this.gasLineas.push({rubro:"otro",cant:1,monto:0,manual:false,obs:""}); this.renderGasLineas(); },
  gasDelLinea(i){ this.gasSyncLineas(); this.gasLineas.splice(i,1); this.renderGasLineas(); },
  gasCalc(i){
    const r=RUBROS.find(x=>x.id===val("fgl_rub_"+i)); if(!r) return;
    const esUn=r.un!=="$", lb=document.getElementById("fgl_lb_"+i), ay=document.getElementById("fgl_calc_"+i);
    if(lb) lb.textContent = esUn? "Cantidad de "+r.un : "Cantidad (informativo)";
    const f=val("fgb_fec")||hoy();
    if(esUn){
      const tipo=r.un==="UF"?"uf":r.un==="UP"?"up":"uma";
      const v=valorVigente(tipo,f), c=parseNum(val("fgl_cant_"+i));
      if(v){ if(ay) ay.innerHTML=r.un+" al "+fFec(f)+": <b>"+pes(v)+"</b> → "+NF4.format(c)+" × "+pes(v)+" = <b>"+pes(c*v)+"</b>";
             if(!chk("fgl_man_"+i)){ const mo=document.getElementById("fgl_mon_"+i); if(mo) mo.value=nf(c*v); } }
      else if(ay) ay.innerHTML='<span style="color:var(--amber)">No hay valor de '+r.un+' cargado. Escribí el importe a mano.</span>';
    } else if(ay) ay.textContent="Importe libre.";
    this.gasTotal();
  },
  gasTotal(){
    let tot=0,n=0; this.gasLineas.forEach((_,i)=>{ const m=parseNum(val("fgl_mon_"+i)); if(m>0){tot+=m;n++;} });
    const t=document.getElementById("fgb_total"), c=document.getElementById("fgb_count");
    if(t) t.textContent=pes0(tot); if(c) c.textContent=(n||this.gasLineas.length)+" gasto"+((n||this.gasLineas.length)===1?"":"s");
  },
  gGastoBatch(){
    this.gasSyncLineas();
    let causa=val("fgb_cau");
    if(causa==="__nueva"){
      const nom=(val("fgb_caunom")||"").trim();
      if(!nom) return toast("Escribí el nombre de la causa nueva",true);
      causa=uid("cau");
      put("causas",{id:causa,car:nom,carLarga:nom,corto:nom,cliente:"",extra:true,estado:"abierta",socios:["s_jp"],reparto:{s_jp:100}});
    }
    if(!causa) return toast("Elegí la causa",true);
    const fecha=val("fgb_fec"), pagador=val("fgb_pag"), nore=chk("fgb_nore"), nota=(val("fgb_nota")||"").trim();
    const lineas=this.gasLineas.filter(L=>parseNum(L.monto)>0);
    if(!lineas.length) return toast("Cargá al menos un importe",true);
    if(lineas.length===1){
      const L=lineas[0];
      const obs=[nota,(L.obs||"").trim()].filter(Boolean).join(" — ");
      put("gastos",{id:uid("gas"),fecha,causa,rubro:L.rubro,cant:parseNum(L.cant),monto:parseNum(L.monto),manual:!!L.manual,pagador,obs,noReintegrar:nore});
    } else {
      const detalle=lineas.map(L=>{ const r=RUBROS.find(z=>z.id===L.rubro)||{nom:L.rubro,un:"$"};
        const que = r.un!=="$" ? NF4.format(parseNum(L.cant))+" "+r.un : r.nom;
        const ob = (L.obs||"").trim();
        return que+(ob?" ("+ob+")":"")+" "+pes0(parseNum(L.monto)); }).join(" · ");
      const total=lineas.reduce((t,L)=>t+parseNum(L.monto),0);
      put("gastos",{id:uid("gas"),fecha,causa,rubro:"otro",varios:true,cant:1,monto:total,manual:true,pagador,
        obs:(nota?nota+" — ":"")+detalle, noReintegrar:nore});
    }
    this.cerrar(); toast(lineas.length>1?lineas.length+" gastos guardados juntos":"Gasto guardado"); this.render();
  },
  fGastoUno(id,causaPre){
    const g = id? DB.gastos[id] : {id:"",fecha:hoy(),causa:causaPre||"",rubro:"uf",cant:1,monto:"",pagador:"s_jp",obs:"",manual:false,noReintegrar:false};
    this.modal({t:id?"Editar gasto":"Gasto de una causa", ancho:true, b:`
      <div class="frow c2">
        <label class="f"><span>Fecha</span><input class="inp" type="date" id="fg_fec" value="${g.fecha}" onchange="App.calcGasto()"></label>
        <label class="f"><span>Causa</span><select class="inp" id="fg_cau">${this.optCausas(g.causa,"— elegir causa —")}</select></label>
      </div>
      <label class="f"><span>Rubro</span><select class="inp" id="fg_rub" onchange="App.calcGasto()">
        ${RUBROS.map(r=>'<option value="'+r.id+'"'+(r.id===g.rubro?" selected":"")+'>'+r.ic+"  "+esc(r.nom)+'</option>').join("")}</select></label>
      <div class="frow c2">
        <label class="f"><span id="fg_lbCant">Cantidad de unidades</span>
          <input class="inp money" id="fg_cant" value="${NF4.format(g.cant||1)}" oninput="App.calcGasto()"></label>
        <label class="f"><span>Importe</span><input class="inp money" id="fg_mon" value="${g.monto?nf(g.monto):""}" oninput="document.getElementById('fg_man').checked=true"></label>
      </div>
      <div id="fg_ayuda" class="small muted" style="margin:-4px 0 12px"></div>
      <label style="display:flex;gap:8px;align-items:center;margin-bottom:12px;font-size:13.5px;cursor:pointer">
        <input type="checkbox" id="fg_man" ${g.manual?"checked":""}> Fijar el importe a mano (no recalcular por unidades)</label>
      <div class="frow c2">
        <label class="f"><span>¿Quién puso la plata?</span><select class="inp" id="fg_pag">${this.optSocios(g.pagador,false)}</select></label>
        <label class="f"><span>Observaciones</span><input class="inp" id="fg_obs" value="${esc(g.obs||"")}"></label>
      </div>
      <label style="display:flex;gap:8px;align-items:center;font-size:13.5px;cursor:pointer">
        <input type="checkbox" id="fg_nore" ${g.noReintegrar?"checked":""}> No descontarlo del reparto (lo absorbe el estudio)</label>`,
      p:`${id?'<button class="btn dan" onclick="App.cerrar();App.confirmar(\'¿Borrar este gasto?\',()=>{quitar(\'gastos\',\''+id+'\');App.render();toast(\'Gasto borrado\')})">Eliminar</button>':""}
         <button class="btn" onclick="App.cerrar()">Cancelar</button>
         <button class="btn pri" onclick="App.gGasto('${id||""}')">Guardar</button>`});
    this.calcGasto();
  },
  calcGasto(){

    document.getElementById("fg_lbCant").textContent = esUn? "Cantidad de "+r.un : "Cantidad (informativo)";
    const f=val("fg_fec")||hoy();
    if(esUn){
      const tipo=r.un==="UF"?"uf":r.un==="UP"?"up":"uma";
      const v=valorVigente(tipo,f), c=parseNum(val("fg_cant"));
      const a=document.getElementById("fg_ayuda");
      if(v){ a.innerHTML="Valor "+r.un+" al "+fFec(f)+": <b>"+pes(v)+"</b> → "+NF4.format(c)+" × "+pes(v)+" = <b>"+pes(c*v)+"</b>";
             if(!chk("fg_man")) document.getElementById("fg_mon").value=nf(c*v); }
      else a.innerHTML='<span style="color:var(--amber)">No hay valor de '+r.un+' cargado. Ponelo desde la barra de arriba o escribí el importe a mano.</span>';
    } else document.getElementById("fg_ayuda").textContent="Importe libre.";

        <td><span class="tag" style="background:${colorSocio(g.pagador)}22;color:${colorSocio(g.pagador)};${st}">${esc(nombreSocio(g.pagador))}</span>${g.noReintegrar?' <span class="tag w">no se devuelve</span>':""}${dev?' <span class="tag ok">recuperado</span>':""}</td>

  /* ======================= SIMULADOR ======================= */
  sim:{base:0,pReg:20,pCl:20,pSoc:10,socio:"s_eug",gastos:0,pagador:"s_jp",socios:["s_jp","s_eug"],hReg:0,hCl:0,manual:false},

          <label class="f"><span>Gastos a devolver</span><input class="inp money" id="si_gas" value="${s.gastos?nf(s.gastos):""}" placeholder="0,00" oninput="App.simSet()"></label>
          <label class="f"><span>Los puso</span><select class="inp" id="si_pag" onchange="App.simSet()">${this.optSocios(s.pagador,false)}</select></label>
        </div>
        <label class="f"><span>Socios que se reparten</span><div class="chips" id="si_socios">
          ${socs.map(x=>'<button type="button" class="chip '+(s.socios.includes(x.id)?"on":"")+'" data-s="'+x.id+'" onclick="this.classList.toggle(\'on\');App.simSet()">'+esc(x.corto)+'</button>').join("")}</div></label>
        <div class="small muted">El informante se toma del ${NF4.format(DB.cfg.porcInformante)} % configurado en Ajustes.</div>

      <div>
        ${R.socio? `<div class="card" style="margin-bottom:14px"><div class="hd"><h3>Cuánto termina cobrando ${esc(R.socio.nombre)}</h3></div><div class="bd">
          <div class="casc">
            <div class="ln"><span class="tt">Honorarios regulados a su nombre (${NF4.format(s.pSoc)} % de ${pes0(R.hReg)})</span><span class="am">${pes(R.socio.honorario)}</span></div>
            ${R.socio.filas.map(f=>`<div class="ln det"><span class="tt">${esc(f.nom)} <span class="muted">· ${esc(f.det)}</span></span><span class="am" style="color:${f.monto<0?"var(--rose)":"var(--acc)"}">${f.monto<0?"− ":"+ "}${pes(Math.abs(f.monto))}</span></div>`).join("")}
            <div class="ln fin"><span class="tt"><b>Le entra en la cuenta</b></span><span class="am">${pes(R.socio.neto)}</span></div>
            <div class="ln det"><span class="tt">Diferencia contra el honorario bruto</span><span class="am">${R.socio.dif<0?"− ":"+ "}${pes(Math.abs(R.socio.dif))} (${NF4.format(R.socio.honorario?R.socio.dif/R.socio.honorario*100:0)} %)</span></div>

        <div class="card"><div class="hd"><h3>Reparto final</h3></div><div class="bd">
